<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taqwa Islamic School — Inventory &amp; Notesheet Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230097d7'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23ffffff'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ============================================================
   Taqwa Islamic School — Inventory & Notesheet Portal
   Design language: deep Islamic green + antique gold, an
   Design language: restrained enterprise palette with Inter throughout,
   Amiri (Naskh-style serif) for display headings paired with
   Inter for UI/body text.
   ============================================================ */
:root{
  --color-bg: #f6f7f9;
  --color-surface: #ffffff;
  --color-surface-2: #eef1f3;
  --color-ink: #28323c;
  --color-ink-soft: #5c6a76;
  --color-ink-faint: #93a1ab;
  --color-border: #e3e7eb;
  --color-primary: #4a7d97;
  --color-primary-dark: #33586b;
  --color-primary-light: #eaf2f5;
  --color-gold: #5f9186;
  --color-gold-bright: #6fa598;
  --color-gold-soft: #eaf3f0;
  --color-danger: #b1594e;
  --color-danger-soft: #f7ece9;
  --color-success: #6f9169;
  --color-success-soft: #eef3ea;
  --color-medium: #bd8a45;
  --color-medium-soft: #f8efdf;
  --color-high: #a8674f;
  --color-high-soft: #f5e9e3;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(20,40,55,0.05);
  --shadow: 0 1px 2px rgba(20,40,55,0.04), 0 8px 20px -12px rgba(20,40,55,0.14);
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0; background:var(--color-bg); color:var(--color-ink);
  font-family: var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
body::before{ content:none; }
body::after{ content:none; }
a{ color:inherit; }
h1,h2,h3,h4{ font-family: var(--font-display); margin:0 0 4px; font-weight:700; color:var(--color-primary-dark); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 22px; position:relative; z-index:1; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:2px solid var(--color-gold-bright); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ---- Star motif ---- */
.plain-divider{ height:1px; margin:22px 0 16px; background:linear-gradient(90deg, transparent, var(--color-border) 15%, var(--color-border) 85%, transparent); }

/* ---- Header: brand band + nav ribbon ---- */
.brand-band{ background:linear-gradient(180deg, var(--color-primary-light), var(--color-surface)); border-bottom:1px solid var(--color-border); }
.brand-band-inner{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:15px 0; }
.brand{ display:flex; align-items:center; gap:13px; text-decoration:none; color:var(--color-ink); }
.brand-logo-img{ height:42px; width:auto; display:block; flex:none; }
.brand-divider{ width:1px; height:26px; background:var(--color-border); flex:none; }
.brand-sub{ font-size:11px; font-weight:600; color:var(--color-primary-dark); letter-spacing:.02em; line-height:1.3; max-width:150px; }
.header-right{ display:flex; align-items:center; gap:16px; }
.search-box input{ width:200px; }

.nav-ribbon{ position:sticky; top:0; z-index:50; background:var(--color-surface); border-bottom:1px solid var(--color-border); box-shadow:var(--shadow-sm); }
.nav-ribbon-inner{ display:flex; align-items:center; gap:2px; padding:7px 0; }
.nav-ribbon a{
  position:relative; text-decoration:none; color:var(--color-ink-soft); font-size:13.5px; font-weight:600;
  padding:9px 16px; display:inline-block; border-radius:8px;
  transition:color .18s ease, background-color .18s ease;
}
.nav-ribbon a::after{
  content:''; position:absolute; left:14px; right:14px; bottom:2px; height:2px;
  background:var(--color-primary); border-radius:2px;
  transform:scaleX(0); transform-origin:left; transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.nav-ribbon a:hover{ color:var(--color-primary-dark); background:var(--color-surface-2); }
.nav-ribbon a:hover::after{ transform:scaleX(1); }
.nav-ribbon a.active{ color:var(--color-primary-dark); font-weight:700; }
.nav-ribbon a.active::after{ transform:scaleX(1); }

.auth-box{ display:flex; align-items:center; gap:10px; padding-left:16px; border-left:1px solid var(--color-border); }
.role-chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; background:var(--color-primary-light); color:var(--color-primary-dark); border:1px solid var(--color-border); padding:5px 11px 5px 8px; border-radius:999px; }
.role-chip::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--color-gold); flex:none; }
.btn{ font-weight:600; font-size:13.5px; padding:8px 14px; border-radius:8px; border:1.5px solid transparent; transition:.15s; white-space:nowrap; }
.btn-primary{ background:var(--color-primary); color:#fff; }
.btn-primary:hover{ background:var(--color-primary-dark); }
.btn-gold{ background:var(--color-primary); color:#fff; }
.btn-gold:hover{ background:var(--color-primary-dark); }
.btn-outline{ background:transparent; border-color:var(--color-border); color:var(--color-ink); }
.btn-outline:hover{ border-color:var(--color-primary); color:var(--color-primary); }
.btn-danger{ background:transparent; border-color:var(--color-danger); color:var(--color-danger); }
.btn-danger:hover{ background:var(--color-danger); color:#fff; }
.btn-sm{ padding:5px 10px; font-size:12.5px; }
.btn-ghost-dark{ background:transparent; border-color:var(--color-border); color:var(--color-ink-soft); }
.btn-ghost-dark:hover{ background:var(--color-surface-2); color:var(--color-primary); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }


/* ---- Dashboard header subtitle ---- */
.page-subtitle-inline{ font-size:13px; color:var(--color-ink-faint); margin-bottom:16px; }

/* ---- Compact dashboard stat cards ---- */
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin:0 0 4px; }
.stat-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:12px 14px; display:flex; align-items:center; gap:11px; transition:box-shadow .18s ease, transform .18s ease; }
.stat-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
.stat-icon{ width:34px; height:34px; border-radius:9px; background:var(--color-primary-light); display:flex; align-items:center; justify-content:center; flex:none; }
.stat-num{ font-size:19px; font-weight:700; color:var(--color-ink); line-height:1.15; letter-spacing:-.01em; }
.stat-lbl{ font-size:11px; color:var(--color-ink-faint); margin-top:1px; }

/* ---- Section heading + KPI row ---- */
.section-heading{ font-size:12.5px; font-weight:700; color:var(--color-ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px; }
.kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
.kpi-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:12px 15px; transition:box-shadow .18s ease, transform .18s ease; }
.kpi-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
.kpi-lbl{ font-size:11.5px; color:var(--color-ink-faint); margin-bottom:4px; }
.kpi-val{ font-size:20px; font-weight:700; color:var(--color-ink); letter-spacing:-.01em; }

/* ---- Analytics chart cards ---- */
.analytics-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-top:16px; }
@media (max-width:820px){ .analytics-grid{ grid-template-columns:1fr; } }
.chart-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:17px 19px 13px; }
.chart-card-title{ font-size:12.5px; font-weight:700; color:var(--color-ink-soft); margin-bottom:10px; }
.donut-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.legend-list{ flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }

/* ---- Rich empty state for analytics ---- */
.empty-analytics{ text-align:center; padding:56px 24px; margin-top:16px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
.empty-analytics-icon{ width:64px; height:64px; border-radius:50%; background:var(--color-primary-light); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.empty-analytics h3{ font-size:16px; color:var(--color-ink); margin-bottom:6px; }
.empty-analytics p{ font-size:13px; color:var(--color-ink-faint); max-width:380px; margin:0 auto; }
.legend-row{ display:flex; align-items:center; gap:7px; font-size:12px; }
.legend-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.legend-label{ flex:1; color:var(--color-ink-soft); }
.legend-value{ font-weight:600; color:var(--color-ink); white-space:nowrap; }
.legend-pct{ color:var(--color-ink-faint); font-weight:400; }
.hbar-list{ display:flex; flex-direction:column; gap:9px; }
.hbar-row{ display:grid; grid-template-columns:100px 1fr auto; align-items:center; gap:8px; font-size:12px; }
.hbar-label{ color:var(--color-ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbar-track{ height:8px; background:var(--color-surface-2); border-radius:4px; overflow:hidden; }
.hbar-fill{ height:100%; background:var(--color-primary); border-radius:4px; }
.hbar-value{ font-weight:600; color:var(--color-ink); white-space:nowrap; }

/* ---- Content ---- */
.content{ padding:26px 0 60px; }
.page-title{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
.page-title h2{ font-size:23px; position:relative; display:inline-block; }
.page-title h2::after{ content:''; position:absolute; left:0; bottom:-6px; width:46px; height:3px; background:var(--color-gold); border-radius:2px; }
.page-subtitle{ color:var(--color-ink-soft); font-size:13.5px; margin:14px 0 4px; }
.breadcrumb{ font-size:12.5px; color:var(--color-ink-faint); margin-bottom:10px; }
.breadcrumb a{ text-decoration:none; color:var(--color-primary); font-weight:600; }

/* ---- Cards / grid ---- */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-top:18px; }
.card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:18px; transition:.15s; }
.card-link{ text-decoration:none; color:inherit; display:block; }
.card-link:hover .card{ box-shadow:var(--shadow); border-color:var(--color-gold); transform:translateY(-1px); }
.card-icon{ width:40px; height:40px; border-radius:10px; background:var(--color-primary-light); color:var(--color-primary); display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-family:var(--font-display); font-weight:700; font-size:17px; }
.card-title{ font-weight:700; font-size:15.5px; color:var(--color-primary-dark); margin-bottom:2px; }
.card-meta{ font-size:12.5px; color:var(--color-ink-faint); }
.card-badge-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

.nav-tile{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:24px; display:flex; gap:16px; align-items:flex-start; text-decoration:none; color:inherit; transition:.15s; }
.nav-tile:hover{ box-shadow:var(--shadow); border-color:var(--color-gold); transform:translateY(-2px); }
.nav-tile-icon{ width:52px; height:52px; border-radius:14px; background:var(--color-primary); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
.nav-tile h3{ font-size:18px; margin-bottom:4px; }
.nav-tile p{ font-size:13px; color:var(--color-ink-soft); margin:0; }

/* ---- Tabs ---- */
.tab-strip{ display:flex; gap:4px; border-bottom:1.5px solid var(--color-border); margin:18px 0 0; overflow-x:auto; }
.tab-btn{ background:none; border:none; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--color-ink-faint); border-bottom:2.5px solid transparent; margin-bottom:-1.5px; white-space:nowrap; }
.tab-btn:hover{ color:var(--color-primary); }
.tab-btn.active{ color:var(--color-primary); border-bottom-color:var(--color-gold); }
.tab-panel{ padding-top:18px; }

/* ---- Tables ---- */
.table-wrap{ overflow-x:auto; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
table{ width:100%; border-collapse:collapse; font-size:13.5px; }
thead th{ text-align:left; background:var(--color-primary-light); color:var(--color-primary-dark); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:10px 14px; border-bottom:1px solid var(--color-border); white-space:nowrap; }
tbody td{ padding:10px 14px; border-bottom:1px solid var(--color-border); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:nth-child(even){ background:var(--color-surface-2); }
tbody tr:hover{ background:var(--color-gold-soft); }
.row-clickable{ cursor:pointer; }

/* ---- Badges / tags ---- */
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:999px; text-transform:uppercase; }
.badge-low{ background:var(--color-success-soft); color:var(--color-success); }
.badge-medium{ background:var(--color-medium-soft); color:var(--color-medium); }
.badge-high{ background:var(--color-high-soft); color:var(--color-high); }
.badge-pending{ background:var(--color-gold-soft); color:var(--color-gold); }
.badge-approved{ background:var(--color-success-soft); color:var(--color-success); }
.badge-rejected{ background:var(--color-danger-soft); color:var(--color-danger); }
.badge-status{ background:var(--color-primary-light); color:var(--color-primary); }
.badge-danger{ background:var(--color-danger-soft); color:var(--color-danger); }

/* ---- Category procurement policy row ---- */
.cat-policy-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; border:1px solid var(--color-border); border-radius:8px; padding:8px 10px; background:var(--color-surface-2); }
.cat-policy-name{ font-size:12.5px; font-weight:600; color:var(--color-ink); flex:1; min-width:140px; }
.cat-policy-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.cat-policy-controls select{ font-size:11.5px; padding:5px 7px; border:1.5px solid var(--color-border); border-radius:6px; background:#fff; }
.policy-toggle{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; border:1.5px solid transparent; cursor:pointer; white-space:nowrap; }
.policy-toggle.on{ background:var(--color-high-soft); color:var(--color-high); }
.policy-toggle.off{ background:var(--color-success-soft); color:var(--color-success); }

/* ---- Forms ---- */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--color-ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.02em; }
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1.5px solid var(--color-border); border-radius:8px; font-family:inherit; font-size:14px; background:#fff; color:var(--color-ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--color-primary); }
.field textarea{ resize:vertical; min-height:70px; }
.field-hint{ font-size:11.5px; color:var(--color-ink-faint); margin-top:4px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:560px){ .field-row{ grid-template-columns:1fr; } }
.form-error{ background:var(--color-danger-soft); color:var(--color-danger); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:12px; }

/* ---- Spec sheet ---- */
.spec-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
.spec-item label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--color-ink-faint); margin-bottom:3px; }
.spec-item .val{ font-size:14.5px; color:var(--color-ink); font-weight:500; }

/* ---- Modal ---- */
.modal-overlay{ position:fixed; inset:0; background:rgba(11,40,30,0.55); display:none; align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:40px 16px; }
.modal{ background:#fff; border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.modal-header{ padding:18px 22px; border-bottom:1px solid var(--color-border); display:flex; align-items:center; justify-content:space-between; }
.modal-header h3{ font-size:18px; }
.modal-close{ background:none; border:none; font-size:20px; color:var(--color-ink-faint); line-height:1; padding:4px; }
.modal-body{ padding:20px 22px; max-height:64vh; overflow-y:auto; }
.modal-footer{ padding:16px 22px; border-top:1px solid var(--color-border); display:flex; justify-content:flex-end; gap:10px; }

/* ---- Timeline ---- */
.timeline{ list-style:none; margin:0; padding:0; }
.timeline li{ position:relative; padding:0 0 18px 24px; border-left:2px solid var(--color-border); }
.timeline li:last-child{ border-color:transparent; padding-bottom:0; }
.timeline li::before{ content:''; position:absolute; left:-6.5px; top:2px; width:11px; height:11px; border-radius:50%; background:var(--color-gold); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--color-gold); }
.timeline .t-title{ font-weight:700; font-size:13.5px; color:var(--color-primary-dark); }
.timeline .t-meta{ font-size:11.5px; color:var(--color-ink-faint); margin:2px 0 4px; }
.timeline .t-remark{ font-size:13px; color:var(--color-ink-soft); background:var(--color-surface-2); border-radius:8px; padding:8px 10px; }

/* ---- Procurement: approval cards ---- */
.approval-card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px; }
.approval-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:16px; }
.approval-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.approval-card-meta{ font-size:12px; color:var(--color-ink-soft); margin-bottom:4px; }
.approval-card-reason{ font-size:12.5px; color:var(--color-ink-faint); font-style:italic; margin:6px 0; }
.approval-card-actions{ display:flex; gap:8px; margin-top:10px; }
.chk-row{ display:flex; align-items:center; gap:7px; font-size:13.5px; }
.chk-row input{ width:15px; height:15px; }

/* ---- Procurement: new request line cards ---- */
.req-line-card{ border:1px solid var(--color-border); border-radius:var(--radius); padding:14px; margin-bottom:12px; background:var(--color-surface-2); }
.req-line-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }

/* ---- Procurement: value class colors reuse tier badges above ---- */


/* ---- Alerts ---- */
.alert-stack{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
.alert-item{ display:flex; align-items:center; gap:10px; background:var(--color-gold-soft); border:1px solid var(--color-gold); color:#5c4413; padding:10px 14px; border-radius:10px; font-size:13px; }
.alert-item strong{ font-weight:700; }
.alert-item .spacer{ flex:1; }

/* ---- Empty state ---- */
.empty-state{ text-align:center; padding:44px 20px; color:var(--color-ink-faint); }
.empty-state .icon{ font-size:30px; margin-bottom:8px; opacity:.6; }
.empty-state h3{ color:var(--color-ink-soft); font-size:15px; }

/* ---- Toast ---- */
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--color-primary-dark); color:#fff; padding:11px 16px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow); border-left:3px solid var(--color-gold); animation:toastIn .2s ease; }
.toast.error{ border-left-color:var(--color-danger); }
.toast.success{ border-left-color:var(--color-success); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ---- Footer ---- */
.footer{ border-top:1px solid var(--color-border); padding:24px 0; text-align:center; font-size:12px; color:var(--color-ink-faint); }
.footer-org{ margin-bottom:8px; }
.footer-contact{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; font-size:11.5px; }

/* ---- Search ---- */
.search-box{ position:relative; }
.search-box input{ width:190px; padding:8px 12px 8px 32px; border-radius:8px; border:1.5px solid var(--color-border); background:var(--color-surface-2); color:var(--color-ink); font-size:13px; }
.search-box input::placeholder{ color:var(--color-ink-faint); }
.search-box svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.55; }
.search-results{ position:absolute; top:calc(100% + 6px); left:0; width:320px; max-height:360px; overflow-y:auto; background:#fff; border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.25); z-index:60; }
.search-results a{ display:block; padding:10px 14px; text-decoration:none; color:var(--color-ink); font-size:13px; border-bottom:1px solid var(--color-border); }
.search-results a:hover{ background:var(--color-primary-light); }
.search-results a small{ display:block; color:var(--color-ink-faint); font-size:11px; margin-top:2px; }

@media print{
  .topbar, .footer, .btn, .modal-overlay, .search-box{ display:none !important; }
  body{ background:#fff; }
  .card, .table-wrap{ box-shadow:none; }
}
@media (max-width:720px){
  .topbar-nav{ display:none; }
  .search-box input{ width:120px; }
  .hero h1{ font-size:24px; }
}
</style>

function escapeHtml(str){ if(str===null||str===undefined) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function formatDate(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateDMY(iso){ if(!iso) return '—'; const d=new Date(iso+(String(iso).length<=10?'T00:00:00':'')); if(isNaN(d.getTime())) return String(iso); const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear(); }
function formatDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function formatMoney(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN'); }
function nextId(prefix){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
/* ============================================================
   Soft delete / Archive — Admin only. Records are never truly
   removed; they're flagged .deleted and logged in DB.archiveLog,
   and can be restored at any time.
   ============================================================ */
function archiveRecord(entityType, record, label, reason){
  DB.archiveLog.push({
    id: nextId('arch'), entityType, entityId: record.id, label,
    deletedByEmail: currentUserEmail, deletedByName: (myStaffRecord()||{}).name || currentUserEmail,
    reason: reason||'', deletedAt: new Date().toISOString(), restored: false
  });
  record.deleted = true;
  record.deletedAt = new Date().toISOString();
  record.deletedByEmail = currentUserEmail;
}
function restoreRecord(entityType, record){
  record.deleted = false;
  const logEntry = DB.archiveLog.slice().reverse().find(e=>e.entityType===entityType && e.entityId===record.id && !e.restored);
  if(logEntry) logEntry.restored = true;
}
function promptAndArchive(entityType, record, label, onDone){
  const reason = prompt('Delete "'+label+'"? This can be restored later from Archive.\n\nOptional reason:', '');
  if(reason===null) return false;
  archiveRecord(entityType, record, label, reason);
  if(onDone) onDone();
  return true;
}

  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}

/* ============================================================
   Google Drive helpers
   ============================================================ */
async function driveFetchPublic(path, params){
  const url = new URL(DRIVE_FILES_URL + path);
  url.searchParams.set('key', CONFIG.DRIVE_API_KEY);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url);
  if(!res.ok) throw new Error('Drive read failed ('+res.status+')');
  return res;
}
async function driveFetchAuthed(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer '+accessToken });
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('Drive request failed ('+res.status+'): '+t.slice(0,180)); }
  return res;
}
async function driveGetJson(fileId){
  const res = await driveFetchPublic('/'+fileId, { alt:'media' });
  return res.json();
}
async function driveSaveJsonAttempt(fileId, data){
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'/'+fileId+'?uploadType=media', {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(data)
  });
  return res.json();
}
async function driveSaveJson(fileId, data){
  let lastErr;
  for(let attempt=1; attempt<=3; attempt++){
    try{ return await driveSaveJsonAttempt(fileId, data); }
    catch(e){ lastErr = e; await new Promise(r=>setTimeout(r, 500*attempt)); }
  }
  throw lastErr;
}
async function driveCreateFolder(name){
  const res = await driveFetchAuthed(DRIVE_FILES_URL, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder' })
  });
  const j = await res.json(); return j.id;
}
async function driveCreateJsonFile(name, parentId, data){
  const boundary = 'taqwaportal'+Date.now();
  const metadata = { name, parents:[parentId] };
  const body =
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n'+
    '--'+boundary+'--';
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'?uploadType=multipart', {
    method:'POST', headers:{ 'Content-Type':'multipart/related; boundary='+boundary }, body
  });
  const j = await res.json(); return j.id;
}
async function driveSetPublicReadable(fileId){
  await driveFetchAuthed(DRIVE_FILES_URL+'/'+fileId+'/permissions', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ role:'reader', type:'anyone' })
  });
}
/* Converts an ArrayBuffer to base64 in fixed-size chunks so encoding larger
   files (bill photos, PDFs) doesn't stall the browser. */
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  const CHUNK_SIZE = 0x8000;
  let binary = '';
  for(let i=0; i<bytes.length; i+=CHUNK_SIZE){
    const chunk = bytes.subarray(i, i+CHUNK_SIZE);
    binary += String.fromCharCode.apply(null, chunk);
  }
  return btoa(binary);
}
async function driveUploadBinary(file, parentId){
  const metadata = { name:file.name, parents:[parentId] };
  const boundary = '-------taqwa'+Date.now();
  const arrayBuffer = await file.arrayBuffer();
  const base64Data = arrayBufferToBase64(arrayBuffer);
  const body =
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: '+file.type+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+base64Data+'\r\n'+
    '--'+boundary+'--';
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'?uploadType=multipart', {
    method:'POST',
    headers:{ 'Content-Type':'multipart/related; boundary='+boundary },
    body
  });
  const fileId = (await res.json()).id;
  await driveSetPublicReadable(fileId);
  return fileId;
}
function driveDownloadUrl(fileId){ return 'https://drive.google.com/uc?export=download&id='+fileId; }
function drivePreviewUrl(fileId){ return 'https://drive.google.com/file/d/'+fileId+'/preview'; }

   Auth

function allStaffEmails(){
  const set = new Set();
  CONFIG.ADMIN_EMAILS.forEach(e=>set.add(e.toLowerCase()));
  if(DB && Array.isArray(DB.staff)){
    DB.staff.forEach(s=>{ if(s.active!==false && s.email) set.add(s.email.toLowerCase()); });
  }
  return set;
}
function initAuth(){
  if(!CONFIG.OAUTH_CLIENT_ID) return;
  if(window.google && window.google.accounts && window.google.accounts.oauth2){
    setupTokenClient();
    return;
  }
  let tries = 0;
  const iv = setInterval(()=>{
    tries++;
    if(window.google && window.google.accounts && window.google.accounts.oauth2){
      clearInterval(iv);
      setupTokenClient();
    } else if(tries > 75){
      clearInterval(iv);
    }
  }, 200);
}
function setupTokenClient(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.OAUTH_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive email profile openid',
    callback: async (resp)=>{
      if(resp.error){ toast('Sign-in failed', 'error'); return; }
      accessToken = resp.access_token;
      const tryVerify = async (attempt)=>{
        try{
          const infoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:'Bearer '+accessToken } });
          if(!infoRes.ok) throw new Error('userinfo request failed ('+infoRes.status+')');
          const info = await infoRes.json();
          if(!info.email) throw new Error('no email in response');
          currentUserEmail = info.email;
          const allowed = allStaffEmails();
          if(allowed.size && !allowed.has((currentUserEmail||'').toLowerCase())){
            accessToken = null; currentUserEmail = null;
            toast('This Google account is not authorised for staff access.', 'error');
            renderTopbar(); return;
          }
          toast('Signed in as '+currentUserEmail, 'success');
          renderTopbar(); renderRoute();
        }catch(e){
          if(attempt < 2){ setTimeout(()=>tryVerify(attempt+1), 500); return; }
          accessToken = null; currentUserEmail = null;
          toast('Could not verify account — please try Staff Sign In again', 'error');
          renderTopbar();
        }
      };
      tryVerify(0);
    }
  });
}
function login(){ if(!tokenClient){ toast('Sign-in is not configured yet.', 'error'); return; } tokenClient.requestAccessToken({ prompt:'consent' }); }
function logout(){ accessToken = null; currentUserEmail = null; toast('Signed out'); renderTopbar(); renderRoute(); }

function computeActiveAlerts(){
  const alerts = [];
  DB.inventoryItems.forEach(item=>{
    const threshold = Number(item.reorderThreshold);
    if(threshold>0 && Number(item.quantity) <= threshold){
      const key = 'lowstock_'+item.id;
      if(!DB.dismissedAlerts.includes(key)){
        alerts.push({ key, title:'Low stock: '+item.name, message: deptName(item.departmentId)+' · '+catName(item.categoryId)+' — only '+item.quantity+' '+(item.unit||'')+' left (reorder at '+threshold+')' });
      }
    }
  });
  return alerts;
}
function renderAlertsHtml(){
  const alerts = computeActiveAlerts();
  if(!alerts.length) return '';
  return '<div class="alert-stack">' + alerts.map(a=>
    '<div class="alert-item"><span>⚠</span><span><strong>'+escapeHtml(a.title)+'</strong> — '+escapeHtml(a.message)+'</span><span class="spacer"></span>'
    + (isAdmin() ? '<button class="btn btn-outline btn-sm" data-dismiss-alert="'+a.key+'">Dismiss</button>' : '')
    + '</div>'
  ).join('') + '</div>';
}
function wireAlertDismissButtons(){
  document.querySelectorAll('[data-dismiss-alert]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      DB.dismissedAlerts.push(btn.getAttribute('data-dismiss-alert'));
      await saveDb(); renderRoute();
    });
  });
}

function pendingForMe(){
  if(!isSignedIn()) return [];
  const out = [];
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    if(r.status==='pending_approval' && canActOnApproval(r)) out.push(r);
    else if(r.status==='purchase_pending' && isMyPurchaseTask(r)) out.push(r);
    else if(r.status==='purchased' && isMyPurchaseTask(r)) out.push(r);
    else if(r.status==='received' && (isMyPurchaseTask(r) || isApproverRole() || isAdmin())) out.push(r);
    else if((r.status==='completed' || r.status==='archived') && !r.accountantClosed && isAccountant()) out.push(r);
  });
  return out;
}
/* ============================================================
   Analytics — spend computations (based on purchase records on request items)
   ============================================================ */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(d){ return d.toLocaleDateString('en-IN',{month:'short'}); }
function last6MonthBuckets(){
  const buckets = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: monthKey(d), label: monthLabel(d), value: 0 });
  }
  return buckets;
}
function purchasedItems(){ return DB.requestItems.filter(r=>!r.deleted && r.purchase && r.purchase.totalAmount!=null); }
function computeMonthlyExpenditure(){
  const buckets = last6MonthBuckets();
  const map = {}; buckets.forEach(b=>map[b.key]=b);
  purchasedItems().forEach(r=>{
    const d = new Date(r.purchase.purchaseDate || r.purchase.recordedAt);
    if(isNaN(d.getTime())) return;
    const k = monthKey(d);
    if(map[k]) map[k].value += Number(r.purchase.totalAmount)||0;
  });
  return buckets;
}
function computeCategoryExpenditure(){
  const totals = {};
  purchasedItems().forEach(r=>{
    const label = catName(r.categoryId);
    totals[label] = (totals[label]||0) + (Number(r.purchase.totalAmount)||0);
  });
  return Object.entries(totals).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,6);
}
function computeBuildingExpenditure(){
  const totals = {};
  purchasedItems().forEach(r=>{
    const label = buildingName(r.buildingId);
    totals[label] = (totals[label]||0) + (Number(r.purchase.totalAmount)||0);
  });
  return Object.entries(totals).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
}
function computeRequestsByStatus(){
  const buckets = { 'Pending Approval':0, 'In Progress':0, 'Completed':0, 'Rejected':0 };
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    if(r.status==='pending_approval') buckets['Pending Approval']++;
    else if(r.status==='rejected') buckets['Rejected']++;
    else if(r.status==='completed' || r.status==='archived') buckets['Completed']++;
    else buckets['In Progress']++;
  });
  return Object.entries(buckets).map(([label,value])=>({label,value}));
}
function currentMonthExpenditure(){
  const now = new Date(); const k = monthKey(now);
  let total = 0;
  purchasedItems().forEach(r=>{
    const d = new Date(r.purchase.purchaseDate || r.purchase.recordedAt);
    if(!isNaN(d.getTime()) && monthKey(d)===k) total += Number(r.purchase.totalAmount)||0;
  });
  return total;
}
function totalExpenditureAllTime(){
  return purchasedItems().reduce((s,r)=> s + (Number(r.purchase.totalAmount)||0), 0);
}

/* ============================================================
   Analytics — lightweight inline SVG chart builders
   ============================================================ */
const CHART_COLORS = ['#0a7bab','#2f8a7c','#b8791c','#a4432f','#5a6a78','#8fa0ab'];
function svgBarChart(data, opts){
  opts = opts || {};
  const w = 520, h = 200, padL = 34, padB = 26, padT = 14, padR = 10;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...data.map(d=>d.value));
  const barW = innerW / data.length * 0.55;
  const gap = innerW / data.length;
  let bars = '', labels = '';
  data.forEach((d,i)=>{
    const barH = max>0 ? (d.value/max) * innerH : 0;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + innerH - barH;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(barH,1).toFixed(1)+'" rx="3" fill="var(--color-primary)" opacity="0.88"><title>'+escapeHtml(d.label)+': '+formatMoney(d.value)+'</title></rect>';
    labels += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="var(--color-ink-faint)">'+escapeHtml(d.label)+'</text>';
  });
  const gridY = padT + innerH;
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="200" preserveAspectRatio="xMidYMid meet">'
    + '<line x1="'+padL+'" y1="'+gridY+'" x2="'+(w-padR)+'" y2="'+gridY+'" stroke="var(--color-border)" stroke-width="1"/>'
    + bars + labels + '</svg>';
}
function svgDonutChart(data){
  const size = 170, cx = size/2, cy = size/2, r = 62, stroke = 24;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total<=0){
    return '<svg viewBox="0 0 '+size+' '+size+'" width="170" height="170"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--color-border)" stroke-width="'+stroke+'"/></svg>';
  }
  let angle = -90, paths = '';
  const circumference = 2*Math.PI*r;
  data.forEach((d,i)=>{
    const frac = d.value/total;
    const dash = frac*circumference;
    paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+CHART_COLORS[i%CHART_COLORS.length]+'" stroke-width="'+stroke+'" stroke-dasharray="'+dash.toFixed(1)+' '+(circumference-dash).toFixed(1)+'" stroke-dashoffset="'+(-angle/360*circumference).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+escapeHtml(d.label)+': '+formatMoney(d.value)+'</title></circle>';
    angle += frac*360;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="170" height="170">'+paths+'</svg>';
}
function renderDonutWithLegend(data, emptyLabel, formatter){
  formatter = formatter || formatMoney;
  if(!data.length || data.every(d=>d.value<=0)){
    return '<div class="empty-state" style="padding:20px;"><div class="icon">📊</div><h3>'+escapeHtml(emptyLabel||'No data yet')+'</h3></div>';
  }
  const total = data.reduce((s,d)=>s+d.value,0);
  const legend = data.map((d,i)=>{
    const pct = total>0 ? Math.round((d.value/total)*100) : 0;
    return '<div class="legend-row"><span class="legend-dot" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+';"></span><span class="legend-label">'+escapeHtml(d.label)+'</span><span class="legend-value">'+formatter(d.value)+' <span class="legend-pct">('+pct+'%)</span></span></div>';
  }).join('');
  return '<div class="donut-row"><div>'+svgDonutChart(data)+'</div><div class="legend-list">'+legend+'</div></div>';
}
function renderHBarList(data){
  if(!data.length || data.every(d=>d.value<=0)){
    return '<div class="empty-state" style="padding:20px;"><div class="icon">📊</div><h3>No data yet</h3></div>';
  }
  const max = Math.max(1, ...data.map(d=>d.value));
  return '<div class="hbar-list">' + data.map(d=>{
    const pct = Math.max(2, Math.round((d.value/max)*100));
    return '<div class="hbar-row"><div class="hbar-label">'+escapeHtml(d.label)+'</div><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;"></div></div><div class="hbar-value">'+formatMoney(d.value)+'</div></div>';
  }).join('') + '</div>';
}

      DB.categories.filter(c=>c.departmentId===id && !c.deleted).forEach(c=>archiveRecord('category', c, c.name, 'Parent department deleted'));
      await saveDb(); toast('Department deleted (archived)','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
  document.querySelectorAll('[data-del-cat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-cat');
      const c = DB.categories.find(x=>x.id===id);
      if(!promptAndArchive('category', c, c.name)) return;
      await saveDb(); toast('Category deleted (archived)','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
}

let currentDeptTab = null;
function renderDepartmentPage(deptId){
  const app = document.getElementById('app');
  const dept = DB.departments.find(d=>d.id===deptId);
  if(!dept){ app.innerHTML = '<div class="content wrap"><div class="empty-state"><h3>Department not found</h3></div></div>'; return; }
  const cats = DB.categories.filter(c=>c.departmentId===deptId && !c.deleted);
  if(!currentDeptTab || !cats.find(c=>c.id===currentDeptTab)) currentDeptTab = cats[0] ? cats[0].id : null;

  app.innerHTML =
    '<div class="content wrap">'
    + '<div class="breadcrumb"><a href="#/inventory">Inventory</a> / '+escapeHtml(dept.name)+'</div>'
    + '<div class="page-title"><h2>'+escapeHtml(dept.name)+'</h2>'
    + (isAdmin() ? '<button class="btn btn-primary btn-sm" id="add-item-btn">+ Add Item</button>' : '')
    + '</div>'
    + '<div class="tab-strip" id="cat-tabs"></div>'
    + '<div class="tab-panel" id="cat-panel"></div>'
    + '</div>';

  const tabStrip = document.getElementById('cat-tabs');
  if(!cats.length){
    document.getElementById('cat-panel').innerHTML = '<div class="empty-state"><div class="icon">🗂️</div><h3>No categories yet</h3><p>'+(isAdmin()?'Add one from Manage Departments &amp; Categories.':'Check back later.')+'</p></div>';
  } else {
    tabStrip.innerHTML = cats.map(c=>'<button class="tab-btn '+(c.id===currentDeptTab?'active':'')+'" data-cat-tab="'+c.id+'">'+escapeHtml(c.name)+'</button>').join('');
    tabStrip.querySelectorAll('[data-cat-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ currentDeptTab = btn.getAttribute('data-cat-tab'); renderDepartmentPage(deptId); });
    });
    renderItemsTable(deptId, currentDeptTab);
  }
  const addBtn = document.getElementById('add-item-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>openItemModal(deptId, currentDeptTab, null));
}
function renderItemsTable(deptId, catId){
  const panel = document.getElementById('cat-panel');
  const items = DB.inventoryItems.filter(i=>i.departmentId===deptId && i.categoryId===catId && !i.deleted).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!items.length){
    panel.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h3>No items in this category yet</h3><p>'+(isAdmin()?'Use \u201c+ Add Item\u201d above to add the first one.':'Check back later.')+'</p></div>';
    return;

/* ============================================================
   PROCUREMENT — Purchase Request lifecycle
   ============================================================ */
let procTab = null;
function requestNumberNext(){
  const n = DB.requests.length + 1;
  const y = new Date().getFullYear();
  return 'PR-'+y+'-'+String(n).padStart(4,'0');
}
function itemPattern(reqItem){ const t = itemTypeById(reqItem.itemTypeId); return t ? t.pattern : 'consumable'; }
function isTerminal(reqItem){
  const pattern = itemPattern(reqItem);
  if(pattern==='asset') return reqItem.status==='archived';
  return reqItem.status==='completed';
}
/* ---- Stock Overview sync: completed purchases feed Inventory Management ---- */
function syncConsumableStock(r){
  const qty = (r.purchase && r.purchase.quantityPurchased) || r.quantityRequested || 0;
  const cat = DB.categories.find(c=>c.id===r.categoryId);
  let item = DB.inventoryItems.find(i=> !i.deleted && i.categoryId===r.categoryId && (i.name||'').toLowerCase()===(r.itemName||'').toLowerCase());
  if(item){
    item.quantity = (Number(item.quantity)||0) + qty;
    item.cost = r.purchase ? r.purchase.unitPrice : item.cost;
    item.purchaseDate = r.purchase ? r.purchase.purchaseDate : item.purchaseDate;
    item.updatedAt = new Date().toISOString();
  } else {
    DB.inventoryItems.push({
      id: nextId('item'), name: r.itemName, departmentId: cat ? cat.departmentId : DB.departments[0].id, categoryId: r.categoryId,
      quantity: qty, unit: '', cost: r.purchase ? r.purchase.unitPrice : 0, reorderThreshold: 0,
      purchaseDate: r.purchase ? r.purchase.purchaseDate : '', status:'Good',
      remarks: 'Auto-added from Procurement · '+r.requestNumber, linkedRequestItemId: r.id,
      updatedAt: new Date().toISOString()
    });
  }
}
function syncAssetToInventory(r, personEmail, personName, buildingId, roomId){
  const cat = DB.categories.find(c=>c.id===r.categoryId);
  const qty = (r.purchase && r.purchase.quantityPurchased) || 1;
  DB.inventoryItems.push({
    id: nextId('item'), name: r.itemName, departmentId: cat ? cat.departmentId : DB.departments[0].id, categoryId: r.categoryId,
    quantity: qty, unit:'unit', cost: r.purchase ? r.purchase.totalAmount : 0, reorderThreshold: 0,
    purchaseDate: r.purchase ? r.purchase.purchaseDate : '', status:'Good',
    remarks: 'Responsible: '+personName+' ('+buildingName(buildingId)+(roomId?' / '+roomName(roomId):'')+') · Auto-added from Procurement · '+r.requestNumber,
    linkedRequestItemId: r.id, updatedAt: new Date().toISOString()
  });
}
function myApprovalQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='pending_approval' && canActOnApproval(r)); }
function myPurchaseQueue(){ return DB.requestItems.filter(r=> !r.deleted && (r.status==='purchase_pending'||r.status==='purchased') && isMyPurchaseTask(r)); }
function myAssignmentQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='received' && (isMyPurchaseTask(r) || isApproverRole() || isAdmin())); }
function myAccountantQueue(){ return DB.requestItems.filter(r=> !r.deleted && isTerminal(r) && !r.accountantClosed && isAccountant()); }

function renderProcurementPage(initialTab){
  const app = document.getElementById('app');
  if(initialTab) procTab = initialTab;
  if(!procTab) procTab = 'new';
  const canApproveAny = isSignedIn() && isApproverRole();
  const hasPurchaseTasks = isSignedIn() && myPurchaseQueue().length>0;
  const canAssign = isSignedIn() && (isApproverRole() || isAdmin());
  const canAccountant = isSignedIn() && isAccountant();

  const tabs = [];
  if(isSignedIn()) tabs.push(['new','New Request']);
  if(canApproveAny) tabs.push(['approvals','Approvals'+(myApprovalQueue().length?' ('+myApprovalQueue().length+')':'')]);
  if(isSignedIn()) tabs.push(['tasks','My Purchase Tasks'+(myPurchaseQueue().length?' ('+myPurchaseQueue().length+')':'')]);
  if(canAssign) tabs.push(['assign','Receiving &amp; Assignment'+(myAssignmentQueue().length?' ('+myAssignmentQueue().length+')':'')]);
  if(canAccountant) tabs.push(['accountant','Accountant Closure'+(myAccountantQueue().length?' ('+myAccountantQueue().length+')':'')]);
  tabs.push(['all','All Requests']);

  app.innerHTML =
    '<div class="content wrap">'
    + '<div class="page-title"><h2>Procurement</h2>'
    +   (canManageStaff() ? '<span style="display:flex; gap:8px;"><button class="btn btn-outline btn-sm" id="manage-staff-btn">Manage Staff</button><button class="btn btn-outline btn-sm" id="manage-buildings-btn">Manage Buildings</button>'+(isAdmin()?'<button class="btn btn-outline btn-sm" id="view-archive-btn">Archive</button>':'')+'</span>' : '')
    + '</div>'
    + '<div class="page-subtitle-inline">Purchase requests, approvals, purchasing, receiving, assignment and closure — permanently tracked.</div>'
    + '<div class="tab-strip">' + tabs.map(t=>'<button class="tab-btn '+(procTab===t[0]?'active':'')+'" data-proc-tab="'+t[0]+'">'+t[1]+'</button>').join('') + '</div>'
    + '<div class="tab-panel" id="proc-panel"></div>'
    + '</div>';

  document.querySelectorAll('[data-proc-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ procTab = btn.getAttribute('data-proc-tab'); renderProcurementPage(); });
  });
  const msBtn = document.getElementById('manage-staff-btn'); if(msBtn) msBtn.addEventListener('click', openManageStaffModal);
  const mbBtn = document.getElementById('manage-buildings-btn'); if(mbBtn) mbBtn.addEventListener('click', openManageBuildingsModal);
  const arBtn = document.getElementById('view-archive-btn'); if(arBtn) arBtn.addEventListener('click', openArchiveModal);

  else if(procTab==='approvals') renderApprovalsTab();
  else if(procTab==='tasks') renderTasksTab();
  else if(procTab==='assign') renderAssignmentTab();
  else if(procTab==='accountant') renderAccountantTab();
  else renderAllRequestsTab();
}

        id, requestId, requestNumber, requestDate,
        requestedByEmail: currentUserEmail, requestedByName: (myStaffRecord()||{}).name || currentUserEmail,
        buildingId, roomId,
        categoryId: l.categoryId, itemTypeId, itemName: l.itemName, quantityRequested: l.quantityRequested,
        priority: l.priority, reason: l.reason, description: l.description,
        valueClass, procurementPolicy,
        linkedAssetId: null,
        status: 'pending_approval',
        approvalChain: chain, approvalIndex: 0,
        assignedPurchaserEmail: null, assignedPurchaserName: null,
        purchase: null, receipt: null, assignments: [], maintenanceEvents: [], disposal: null,
        accountantClosed: false, accountantClosedByEmail: null, accountantClosedAt: null, accountantRemark: null,

  panel.innerHTML =

    card.querySelector('[data-approve-one]').addEventListener('click', ()=>actOnApproval(r, 'approve', card));

    const selected = items.filter(r=> panel.querySelector('[data-select="'+r.id+'"]').checked);
    if(!selected.length){ toast('Select at least one item','error'); return; }

function renderApprovalCard(r){
  const staffOptions = DB.staff.filter(s=>s.active!==false).map(s=>'<option value="'+s.email+'">'+escapeHtml(s.name)+'</option>').join('');
  return '<div class="approval-card" data-approval-card="'+r.id+'">'

    + '<div class="approval-card-meta">'+escapeHtml(r.requestNumber)+' · '+escapeHtml(catName(r.categoryId))+' · Qty '+r.quantityRequested+' · '+priorityBadge(r.priority)+'</div>'
    + '<div class="approval-card-meta">'+escapeHtml(buildingName(r.buildingId))+(r.roomId?' / '+escapeHtml(roomName(r.roomId)):'')+' · Requested by '+escapeHtml(r.requestedByName||r.requestedByEmail)+'</div>'
    + (r.reason ? '<div class="approval-card-reason">"'+escapeHtml(r.reason)+'"</div>' : '')
    + '<div class="field" style="margin-top:8px;"><label>Delegate Purchaser</label><select data-purchaser="'+r.id+'"><option value="">— Not yet decided —</option>'+staffOptions+'</select></div>'
    + '<div class="field"><label>Remarks (optional)</label><input type="text" data-remark="'+r.id+'"></div>'
    + '<div class="approval-card-actions"><button class="btn btn-primary btn-sm" data-approve-one="'+r.id+'">Approve</button><button class="btn btn-danger btn-sm" data-reject-one="'+r.id+'">Reject</button></div>'
    + '</div>';
}
async function actOnApproval(r, action, cardEl, skipSave){
  const remarkEl = document.querySelector('[data-remark="'+r.id+'"]');
  const purchaserEl = document.querySelector('[data-purchaser="'+r.id+'"]');
  const remark = remarkEl ? remarkEl.value : '';
  const role = currentApprovalRole(r);
  const stageLabel = roleKeyLabel(role)+' Approval';
  if(purchaserEl && purchaserEl.value){
    const staffRec = DB.staff.find(s=>s.email===purchaserEl.value);
    r.assignedPurchaserEmail = purchaserEl.value;
    r.assignedPurchaserName = staffRec ? staffRec.name : purchaserEl.value;
  }
  r.history.push({ stage: stageLabel, action: action==='approve'?'approved':'rejected', actorEmail: currentUserEmail, actorName: (myStaffRecord()||{}).name || currentUserEmail, remark, timestamp: new Date().toISOString() });
  if(action==='reject'){
    r.status = 'rejected';
  } else {
    if(r.approvalIndex < r.approvalChain.length - 1){
      r.approvalIndex += 1;
    } else {
      r.status = 'purchase_pending';
      if(!r.assignedPurchaserEmail){ r.assignedPurchaserEmail = r.requestedByEmail; r.assignedPurchaserName = r.requestedByName; }
    }
  }
  if(!skipSave){ await saveDb(); toast(action==='approve'?'Approved':'Rejected', action==='approve'?'success':'error'); renderProcurementPage(); }
}

/* ============================================================
   Item Detail Modal — spec + permanent timeline + contextual actions
   ============================================================ */
function openItemDetailModal(id){
  const r = DB.requestItems.find(x=>x.id===id);
  if(!r){ toast('Item not found','error'); return; }
  renderItemDetailModalBody(r);
}
function renderItemDetailModalBody(r){
  const pattern = itemPattern(r);
  let body =
    '<div class="card-badge-row" style="margin-bottom:10px;">'+itemStatusBadge(r.status)+valueClassBadge(r.valueClass)+priorityBadge(r.priority)+(r.accountantClosed?'<span class="badge badge-approved">Accountant Closed</span>':'')+'</div>'
    + '<div class="spec-grid" style="margin-bottom:16px;">'
    +   '<div class="spec-item"><label>Request Number</label><div class="val">'+escapeHtml(r.requestNumber)+'</div></div>'
    +   '<div class="spec-item"><label>Category</label><div class="val">'+escapeHtml(catName(r.categoryId))+'</div></div>'
    +   '<div class="spec-item"><label>Item Type</label><div class="val">'+escapeHtml(itemTypeName(r.itemTypeId))+'</div></div>'
    +   '<div class="spec-item"><label>Building / Room</label><div class="val">'+escapeHtml(buildingName(r.buildingId))+(r.roomId?' / '+escapeHtml(roomName(r.roomId)):'')+'</div></div>'
    +   '<div class="spec-item"><label>Requested By</label><div class="val">'+escapeHtml(r.requestedByName||r.requestedByEmail)+'</div></div>'
    +   '<div class="spec-item"><label>Quantity Requested</label><div class="val">'+r.quantityRequested+'</div></div>'
    +   '<div class="spec-item"><label>Procurement Policy</label><div class="val">'+(r.procurementPolicy==='required'?'Requires Approval':'No Approval Required')+'</div></div>'
    +   '<div class="spec-item"><label>Assigned Purchaser</label><div class="val">'+(r.assignedPurchaserName||'—')+'</div></div>'
    + '</div>'
    + (r.reason ? '<div class="field"><label>Reason</label><div class="val">'+escapeHtml(r.reason)+'</div></div>' : '')
    + (r.description ? '<div class="field"><label>Description</label><div class="val">'+escapeHtml(r.description)+'</div></div>' : '');

  if(r.purchase){
    body += '<div class="section-heading">Purchase Record</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Supplier / Shop</label><div class="val">'+escapeHtml(r.purchase.supplier||'—')+'</div></div>'
      + '<div class="spec-item"><label>Invoice No.</label><div class="val">'+escapeHtml(r.purchase.invoiceNumber||'—')+'</div></div>'
      + '<div class="spec-item"><label>Purchase Date</label><div class="val">'+formatDate(r.purchase.purchaseDate)+'</div></div>'
      + '<div class="spec-item"><label>Qty Purchased</label><div class="val">'+r.purchase.quantityPurchased+' (requested '+r.quantityRequested+')</div></div>'
      + '<div class="spec-item"><label>Unit Price</label><div class="val">'+formatMoney(r.purchase.unitPrice)+'</div></div>'
      + '<div class="spec-item"><label>Total Amount</label><div class="val">'+formatMoney(r.purchase.totalAmount)+'</div></div>'
      + '</div>'
      + (r.purchase.billFileId ? '<div class="field-hint" style="margin-bottom:12px;">📎 <a href="'+driveDownloadUrl(r.purchase.billFileId)+'" target="_blank" rel="noopener">'+escapeHtml(r.purchase.billFileName||'View bill')+'</a></div>' : '');
  }
  if(r.receipt){
    body += '<div class="section-heading">Receipt</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Received Date</label><div class="val">'+formatDate(r.receipt.receivedDate)+'</div></div>'
      + '<div class="spec-item"><label>Received By</label><div class="val">'+escapeHtml(r.receipt.receivedByName||'—')+'</div></div>'
      + '</div>';
  }
  if(r.assignments && r.assignments.length){
    const cur = r.assignments[r.assignments.length-1];
    body += '<div class="section-heading">Current Responsible Person</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Responsible Person</label><div class="val">'+escapeHtml(cur.responsiblePersonName)+'</div></div>'
      + '<div class="spec-item"><label>Location</label><div class="val">'+escapeHtml(buildingName(cur.buildingId))+(cur.roomId?' / '+escapeHtml(roomName(cur.roomId)):'')+'</div></div>'
      + '</div>'
      + (r.assignments.length>1 ? '<div class="field-hint" style="margin-bottom:12px;">'+r.assignments.length+' assignment(s) on record — full history below in timeline.</div>' : '');
  }
  if(r.maintenanceEvents && r.maintenanceEvents.length){
    body += '<div class="section-heading">Maintenance / Repair Events</div><ul class="timeline" style="margin-bottom:12px;">'
      + r.maintenanceEvents.map(m=>'<li><div class="t-title">'+formatDate(m.date)+'</div><div class="t-meta">'+escapeHtml(m.recordedByName||'')+'</div><div class="t-remark">'+escapeHtml(m.description)+'</div></li>').join('')
      + '</ul>';
  }
  if(r.disposal){
    body += '<div class="section-heading">Disposal Record</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Type</label><div class="val">'+escapeHtml(r.disposal.type)+'</div></div>'
      + '<div class="spec-item"><label>Date</label><div class="val">'+formatDate(r.disposal.date)+'</div></div>'
      + '<div class="spec-item"><label>Approved By</label><div class="val">'+escapeHtml(r.disposal.approvedByName||'—')+'</div></div>'
      + '<div class="spec-item"><label>Reason</label><div class="val">'+escapeHtml(r.disposal.reason||'—')+'</div></div>'
      + '</div>'
      + (r.disposal.documentFileId ? '<div class="field-hint" style="margin-bottom:12px;">📎 <a href="'+driveDownloadUrl(r.disposal.documentFileId)+'" target="_blank" rel="noopener">'+escapeHtml(r.disposal.documentFileName||'View document')+'</a></div>' : '');
  }

  body += '<div class="plain-divider"></div><h3 style="margin-bottom:10px;">Permanent Timeline</h3><ul class="timeline">'
    + r.history.map(h=>'<li><div class="t-title">'+escapeHtml(h.stage)+' — '+escapeHtml(h.action)+'</div><div class="t-meta">'+escapeHtml(h.actorName||h.actorEmail||'—')+' · '+formatDateTime(h.timestamp)+'</div>'+(h.remark?'<div class="t-remark">'+escapeHtml(h.remark)+'</div>':'')+'</li>').join('')
    + '</ul>';

  if(r.deleted){
    body = '<div class="form-error">This request was deleted'+(r.deletedByEmail?' by '+escapeHtml(r.deletedByEmail):'')+(r.deletedAt?' on '+formatDateTime(r.deletedAt):'')+'. It has been archived, not erased, and can be restored from Archive.</div>' + body;
  }
  body += '<div id="item-action-box"></div>';

  const footerBtns = '<button class="btn btn-outline" id="modal-done-btn">Close</button>'
    + '<button class="btn btn-outline" id="modal-print-btn">Print / Export Report</button>'
    + (isAdmin() && !r.deleted ? '<button class="btn btn-danger" id="modal-delete-item-btn">Delete Request</button>' : '');
  openModal(escapeHtml(r.itemName), body, footerBtns);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  document.getElementById('modal-print-btn').addEventListener('click', ()=>openRequestItemReportModal(r));
  const delBtn = document.getElementById('modal-delete-item-btn');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(!promptAndArchive('requestItem', r, r.itemName+' ('+r.requestNumber+')')) return;
    await saveDb(); toast('Request deleted (archived)','success'); closeModal(); renderProcurementPage();
  });
  if(!r.deleted) renderItemActionBox(r);
}
function renderItemActionBox(r){
  const box = document.getElementById('item-action-box');
  if(!box) return;
  box.innerHTML = '';
  const pattern = itemPattern(r);

  if(r.status==='pending_approval' && canActOnApproval(r)){
    const staffOptions = DB.staff.filter(s=>s.active!==false).map(s=>'<option value="'+s.email+'" '+(r.assignedPurchaserEmail===s.email?'selected':'')+'>'+escapeHtml(s.name)+'</option>').join('');
    box.innerHTML = '<div class="plain-divider"></div>'
      + '<h4>Approval — '+roleKeyLabel(currentApprovalRole(r))+'</h4>'
      + '<div class="field"><label>Delegate Purchaser</label><select id="modal-purchaser"><option value="">— Not yet decided —</option>'+staffOptions+'</select></div>'
      + '<div class="field"><label>Remarks</label><textarea id="modal-remark"></textarea></div>'
      + '<div style="display:flex; gap:10px;"><button class="btn btn-primary" id="modal-approve-btn">Approve</button><button class="btn btn-danger" id="modal-reject-btn">Reject</button></div>';
    document.getElementById('modal-approve-btn').addEventListener('click', async ()=>{
      const sel = document.getElementById('modal-purchaser').value;
      if(sel){ const s = DB.staff.find(x=>x.email===sel); r.assignedPurchaserEmail = sel; r.assignedPurchaserName = s?s.name:sel; }
      await actOnApprovalModal(r, 'approve');
    });
    document.getElementById('modal-reject-btn').addEventListener('click', ()=>actOnApprovalModal(r, 'reject'));
    return;
  }

  if(r.status==='purchase_pending' && isMyPurchaseTask(r)){
    box.innerHTML = '<div class="plain-divider"></div><h4>Purchase Entry</h4>'
      + '<div class="field"><label>Purchaser Name</label><input type="text" value="'+escapeHtml(r.assignedPurchaserName||currentUserEmail)+'" disabled></div>'
      + '<div class="field-row"><div class="field"><label>Supplier / Shop</label><input type="text" id="pe-supplier"></div><div class="field"><label>Invoice Number (optional)</label><input type="text" id="pe-invoice"></div></div>'
      + '<div class="field-row"><div class="field"><label>Invoice Date</label><input type="date" id="pe-invoice-date"></div><div class="field"><label>Purchase Date</label><input type="date" id="pe-purchase-date" value="'+new Date().toISOString().slice(0,10)+'"></div></div>'
      + '<div class="field-row"><div class="field"><label>Quantity Purchased</label><input type="number" id="pe-qty" value="'+r.quantityRequested+'"></div><div class="field"><label>Unit Price (₹)</label><input type="number" id="pe-unit-price" value="0"></div></div>'
      + '<div class="field"><label>Total Amount (₹, auto)</label><input type="number" id="pe-total" value="0" readonly></div>'
      + '<div class="field"><label>Bill / Receipt Photo or PDF (optional)</label><input type="file" id="pe-bill-file" accept="image/*,.pdf"></div>'
      + '<div class="field"><label>Remarks</label><textarea id="pe-remarks"></textarea></div>'
      + '<button class="btn btn-primary" id="pe-submit-btn">Record Purchase</button>';
    const qtyEl = document.getElementById('pe-qty'), priceEl = document.getElementById('pe-unit-price'), totalEl = document.getElementById('pe-total');
    function recalc(){ totalEl.value = ((Number(qtyEl.value)||0)*(Number(priceEl.value)||0)).toFixed(2); }
    qtyEl.addEventListener('input', recalc); priceEl.addEventListener('input', recalc);
    document.getElementById('pe-submit-btn').addEventListener('click', async ()=>{
      const submitBtn = document.getElementById('pe-submit-btn');
      const fileInput = document.getElementById('pe-bill-file');
      const file = fileInput.files && fileInput.files[0];
      let billFileId = null, billFileName = null;
      if(file){
        submitBtn.disabled = true; submitBtn.textContent = 'Uploading bill…';
        try{ billFileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID); billFileName = file.name; }
        catch(e){ toast('Bill upload failed: '+e.message, 'error'); submitBtn.disabled = false; submitBtn.textContent = 'Record Purchase'; return; }
      }
      r.purchase = {
        purchaserEmail: currentUserEmail, purchaserName: r.assignedPurchaserName||currentUserEmail,
        supplier: document.getElementById('pe-supplier').value.trim(),
        invoiceNumber: document.getElementById('pe-invoice').value.trim(),
        invoiceDate: document.getElementById('pe-invoice-date').value,
        purchaseDate: document.getElementById('pe-purchase-date').value,
        quantityPurchased: Number(qtyEl.value)||0,
        unitPrice: Number(priceEl.value)||0,
        totalAmount: Number(totalEl.value)||0,
        billFileId, billFileName,
        remarks: document.getElementById('pe-remarks').value.trim(),
        recordedAt: new Date().toISOString()
      };
      r.history.push({ stage:'Purchase Recorded', action:'recorded', actorEmail: currentUserEmail, actorName: r.assignedPurchaserName||currentUserEmail, remark: r.purchase.remarks, timestamp:new Date().toISOString() });
      r.status = (pattern==='service') ? 'purchased' : 'purchased';
      await saveDb(); toast('Purchase recorded','success'); openItemDetailModal(r.id);
    });
    return;
  }

  if(r.status==='purchased' && pattern==='service' && isMyPurchaseTask(r)){
    box.innerHTML = '<div class="plain-divider"></div><h4>Mark Service as Rendered / Performed</h4>'
      + '<div class="field"><label>Date</label><input type="date" id="svc-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
      + '<div class="field"><label>Remarks</label><textarea id="svc-remarks"></textarea></div>'
      + '<button class="btn btn-primary" id="svc-submit-btn">Mark Completed</button>';
    document.getElementById('svc-submit-btn').addEventListener('click', async ()=>{
      const remark = document.getElementById('svc-remarks').value.trim();
      r.history.push({ stage:'Rendered / Performed', action:'completed', actorEmail: currentUserEmail, actorName: r.assignedPurchaserName||currentUserEmail, remark, timestamp:new Date().toISOString() });
      r.status = 'completed';
      await saveDb(); toast('Service marked completed','success'); openItemDetailModal(r.id);
    });
    return;
  }

  if(r.status==='purchased' && pattern!=='service' && isMyPurchaseTask(r)){
    box.innerHTML = '<div class="plain-divider"></div><h4>Confirm Item Received</h4>'
      + '<div class="field"><label>Received Date</label><input type="date" id="rc-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
      + '<div class="field"><label>Received By</label><input type="text" value="'+escapeHtml(r.assignedPurchaserName||currentUserEmail)+'" disabled></div>'
      + '<div class="field"><label>Remarks</label><textarea id="rc-remarks"></textarea></div>'
      + '<button class="btn btn-primary" id="rc-submit-btn">Confirm Received</button>';
    document.getElementById('rc-submit-btn').addEventListener('click', async ()=>{
      const remark = document.getElementById('rc-remarks').value.trim();
      r.receipt = { receivedDate: document.getElementById('rc-date').value, receivedByEmail: currentUserEmail, receivedByName: r.assignedPurchaserName||currentUserEmail, remarks: remark, recordedAt: new Date().toISOString() };
      r.history.push({ stage:'Item Received', action:'received', actorEmail: currentUserEmail, actorName: r.assignedPurchaserName||currentUserEmail, remark, timestamp:new Date().toISOString() });
      r.status = 'received';
      if(pattern==='consumable') syncConsumableStock(r);
      await saveDb(); toast('Marked as received','success'); openItemDetailModal(r.id);
    });
    return;
  }

  if(r.status==='received' && (isMyPurchaseTask(r) || isApproverRole() || isAdmin())){
    if(pattern==='consumable'){
      box.innerHTML = '<div class="plain-divider"></div><h4>Mark as Consumed</h4>'
        + '<div class="field"><label>Date</label><input type="date" id="cons-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
        + '<div class="field"><label>Remarks</label><textarea id="cons-remarks"></textarea></div>'
        + '<button class="btn btn-primary" id="cons-submit-btn">Mark Consumed &amp; Complete</button>';
      document.getElementById('cons-submit-btn').addEventListener('click', async ()=>{
        const remark = document.getElementById('cons-remarks').value.trim();
        r.history.push({ stage:'Consumed', action:'completed', actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark, timestamp:new Date().toISOString() });
        r.status = 'completed';
        await saveDb(); toast('Marked consumed','success'); openItemDetailModal(r.id);
      });
    } else {
      const staffOptions = DB.staff.filter(s=>s.active!==false).map(s=>'<option value="'+s.email+'">'+escapeHtml(s.name)+'</option>').join('');
      const buildings = DB.buildings.filter(b=>!b.deleted).sort((a,b)=>a.sortOrder-b.sortOrder);
      box.innerHTML = '<div class="plain-divider"></div><h4>Assign to Responsible Person</h4>'
        + '<div class="field"><label>Responsible Person</label><select id="as-person"><option value="'+r.receipt.receivedByEmail+'">'+escapeHtml(r.receipt.receivedByName)+' (Receiver)</option>'+staffOptions+'</select></div>'
        + '<div class="field-row"><div class="field"><label>Building</label><select id="as-building">'+buildings.map(b=>'<option value="'+b.id+'" '+(b.id===r.buildingId?'selected':'')+'>'+escapeHtml(b.name)+'</option>').join('')+'</select></div><div class="field"><label>Room (optional)</label><select id="as-room"><option value="">— None —</option></select></div></div>'
        + '<div class="field"><label>Remarks</label><textarea id="as-remarks"></textarea></div>'
        + '<button class="btn btn-primary" id="as-submit-btn">Assign &amp; Activate</button>';
      const bSel = document.getElementById('as-building');
      function refreshAsRooms(){ const rs = DB.rooms.filter(x=>x.buildingId===bSel.value); document.getElementById('as-room').innerHTML = '<option value="">— None —</option>'+rs.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join(''); }
      bSel.addEventListener('change', refreshAsRooms); refreshAsRooms();
      document.getElementById('as-submit-btn').addEventListener('click', async ()=>{
        const personEmail = document.getElementById('as-person').value;
        const staffRec = DB.staff.find(s=>s.email===personEmail);
        const personName = staffRec ? staffRec.name : (personEmail===r.receipt.receivedByEmail ? r.receipt.receivedByName : personEmail);
        const buildingId = bSel.value, roomId = document.getElementById('as-room').value||null;
        const remark = document.getElementById('as-remarks').value.trim();
        r.assignments.push({ responsiblePersonEmail:personEmail, responsiblePersonName:personName, buildingId, roomId, categoryId:r.categoryId, remarks:remark, assignedAt:new Date().toISOString(), assignedByEmail:currentUserEmail });
        r.buildingId = buildingId; r.roomId = roomId;
        r.history.push({ stage:'Assigned', action:'assigned to '+personName, actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark, timestamp:new Date().toISOString() });
        r.history.push({ stage:'Active', action:'activated', actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark:'', timestamp:new Date().toISOString() });
        r.status = 'active';
        syncAssetToInventory(r, personEmail, personName, buildingId, roomId);
        await saveDb(); toast('Assigned, activated, and added to Stock Overview','success'); openItemDetailModal(r.id);
      });
    }
    return;
  }

  if(r.status==='active' && pattern==='asset'){
    const isResponsible = r.assignments.length && r.assignments[r.assignments.length-1].responsiblePersonEmail===currentUserEmail;
    if(isResponsible || isApproverRole() || isAdmin()){
      box.innerHTML = '<div class="plain-divider"></div>'
        + '<h4>Log Maintenance / Repair Event</h4>'
        + '<div class="field"><label>Date</label><input type="date" id="mnt-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
        + '<div class="field"><label>Description</label><textarea id="mnt-desc"></textarea></div>'
        + '<button class="btn btn-outline btn-sm" id="mnt-submit-btn">Add Event</button>';
    }
    if(isApproverRole() || isAdmin()){
      box.innerHTML += '<div class="plain-divider"></div>'
        + '<h4>Dispose</h4>'
        + '<div class="field"><label>Disposal Type</label><select id="disp-type"><option>Disposed</option><option>Scrapped</option><option>Sold</option><option>Donated</option><option>Lost</option><option>Written Off</option><option>Future Transfer</option></select></div>'
        + '<div class="field"><label>Date</label><input type="date" id="disp-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
        + '<div class="field"><label>Reason</label><textarea id="disp-reason"></textarea></div>'
        + '<div class="field"><label>Supporting Document (optional)</label><input type="file" id="disp-doc-file" accept="image/*,.pdf"></div>'
        + '<button class="btn btn-danger btn-sm" id="disp-submit-btn">Dispose &amp; Archive</button>';
    }
    const mntBtn = document.getElementById('mnt-submit-btn');
    if(mntBtn) mntBtn.addEventListener('click', async ()=>{
      const date = document.getElementById('mnt-date').value, desc = document.getElementById('mnt-desc').value.trim();
      if(!desc){ toast('Description required','error'); return; }
      r.maintenanceEvents.push({ date, description: desc, recordedByEmail: currentUserEmail, recordedByName:(myStaffRecord()||{}).name||currentUserEmail, recordedAt:new Date().toISOString() });
      r.history.push({ stage:'Maintenance Event', action:'logged', actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark: desc, timestamp:new Date().toISOString() });
      await saveDb(); toast('Maintenance event logged','success'); openItemDetailModal(r.id);
    });
    const dispBtn = document.getElementById('disp-submit-btn');
    if(dispBtn) dispBtn.addEventListener('click', async ()=>{
      const type = document.getElementById('disp-type').value, date = document.getElementById('disp-date').value, reason = document.getElementById('disp-reason').value.trim();
      const fileInput = document.getElementById('disp-doc-file');
      const file = fileInput.files && fileInput.files[0];
      let documentFileId = null, documentFileName = null;
      if(file){
        dispBtn.disabled = true; dispBtn.textContent = 'Uploading…';
        try{ documentFileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID); documentFileName = file.name; }
        catch(e){ toast('Document upload failed: '+e.message, 'error'); dispBtn.disabled = false; dispBtn.textContent = 'Dispose & Archive'; return; }
      }
      r.disposal = { type, date, reason, approvedByEmail: currentUserEmail, approvedByName:(myStaffRecord()||{}).name||currentUserEmail, remarks:'', documentFileId, documentFileName, recordedAt:new Date().toISOString() };
      r.history.push({ stage:'Disposed', action:type, actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark: reason, timestamp:new Date().toISOString() });
      r.status = 'archived';
      const linkedStock = DB.inventoryItems.find(i=>i.linkedRequestItemId===r.id && !i.deleted);
      if(linkedStock){ linkedStock.status = type; archiveRecord('inventoryItem', linkedStock, linkedStock.name, 'Disposed via Procurement: '+type); }
      await saveDb(); toast('Item disposed and archived','success'); openItemDetailModal(r.id);
    });
    return;
  }

  if(isTerminal(r) && !r.accountantClosed && isAccountant()){
    box.innerHTML = '<div class="plain-divider"></div><h4>Accountant Reconciliation</h4>'
      + '<div class="field"><label>Remarks</label><textarea id="acc-remarks"></textarea></div>'
      + '<button class="btn btn-primary" id="acc-submit-btn">Mark Fully Closed</button>';
    document.getElementById('acc-submit-btn').addEventListener('click', async ()=>{
      const remark = document.getElementById('acc-remarks').value.trim();
      r.accountantClosed = true; r.accountantClosedByEmail = currentUserEmail; r.accountantClosedAt = new Date().toISOString(); r.accountantRemark = remark;
      r.history.push({ stage:'Accountant Reconciliation', action:'closed', actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark, timestamp:new Date().toISOString() });
      await saveDb(); toast('Fully closed','success'); openItemDetailModal(r.id);
    });
    return;
  }
}
async function actOnApprovalModal(r, action){
  const remark = document.getElementById('modal-remark').value.trim();
  await actOnApprovalById(r, action, remark);
}
async function actOnApprovalById(r, action, remark){
  const role = currentApprovalRole(r);
  const stageLabel = roleKeyLabel(role)+' Approval';
  r.history.push({ stage: stageLabel, action: action==='approve'?'approved':'rejected', actorEmail: currentUserEmail, actorName: (myStaffRecord()||{}).name || currentUserEmail, remark, timestamp: new Date().toISOString() });
  if(action==='reject'){
    r.status = 'rejected';
  } else {
    if(r.approvalIndex < r.approvalChain.length - 1){
      r.approvalIndex += 1;
    } else {
      r.status = 'purchase_pending';
      if(!r.assignedPurchaserEmail){ r.assignedPurchaserEmail = r.requestedByEmail; r.assignedPurchaserName = r.requestedByName; }
    }
  }
  await saveDb();
  toast(action==='approve' ? 'Approved' : 'Rejected', action==='approve'?'success':'error');
  openItemDetailModal(r.id);
}

      const email = prompt('Gmail address:', s.email||''); if(email===null) return;
      s.name = name.trim() || s.name; s.email = email.trim();
      await saveDb(); toast('Updated','success'); renderManageStaffModalBody(); renderTopbar();
    });
  });
  document.querySelectorAll('[data-toggle-staff]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const s = DB.staff.find(x=>x.id===btn.getAttribute('data-toggle-staff'));
