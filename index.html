      const totalPages = doc.internal.getNumberOfPages();
      statusEl.textContent = 'Page 1 / '+totalPages;
      previewEl.innerHTML = '<iframe src="'+currentBlobUrl+'" style="width:100%; height:60vh; border:1px solid var(--color-border); border-radius:6px;"></iframe>';
      downloadBtn.disabled = false;
      downloadBtn.onclick = ()=>{
        const a = document.createElement('a');
        a.href = currentBlobUrl; a.download = fileNameBase+'.pdf';
        document.body.appendChild(a); a.click(); a.remove();
      };
    }catch(e){ statusEl.textContent = 'Could not generate report: '+e.message; }
  };
  document.getElementById('pdf-report-regenerate-btn').addEventListener('click', render);
  render();
}

/* Mirrors buildRequestItemReportPdf / openRequestItemReportModal exactly —
   same letterhead, same preview-before-download modal — just for Service
   Procurement's own record shape. Available to any authorised user who can
   already view the service request, not just Admin. */
async function buildServiceRequestReportPdf(sr){
  await ensureJsPDFLoaded();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;

  const ensureSpace = (needed)=>{ if(y + needed > pageH - margin){ doc.addPage(); y = margin; } };
  const section = (label, value)=>{
    const maxWidth = pageW-margin*2;
    ensureSpace(pdfFieldHeight(doc, maxWidth, value));
    y = pdfField(doc, margin, y, maxWidth, label, value);
  };
  const heading = (text)=>{
    ensureSpace(24);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(text, margin, y);
    y += 16;
  };

  try { doc.addImage(LOGO_DATA_URI, 'PNG', margin, y, 90, 45); } catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Taqwa Islamic School', margin+100, y+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Service Request Report — '+sr.serviceRequestNumber, margin+100, y+36);
  y += 62;
  doc.setDrawColor(74,125,151); doc.setLineWidth(1.5);
  doc.line(margin, y, pageW-margin, y);
  y += 20;

  const tiedToLabel = sr.tiedTo==='assets' ? (sr.assetIds||[]).map(describeServiceAssetRef).join(', ') : 'General';
  heading('Request Details');
  section('Service Request No.:', sr.serviceRequestNumber);
  section('Request Date:', formatDateDMY(sr.requestDate));
  section('Requested By:', sr.requestedByName || sr.requestedByEmail);
  section('Service tied to:', tiedToLabel);
  section('Category:', svcCategoryName(sr.categoryId)+' / '+svcSubcategoryName(sr.categoryId, sr.subcategoryId));
  section('Priority:', sr.priority);
  section('Expected Completion Date:', sr.expectedCompletionDate ? formatDateDMY(sr.expectedCompletionDate) : '—');
  if(sr.remarks) section('Request Remarks:', sr.remarks);
  section('Current Status:', serviceStatusLabel(sr.status));

  if(sr.checkedByName){
    heading('Service Receipt');
    section('Checked By:', sr.checkedByName);
    section('Actual Date:', sr.serviceDate ? formatDateDMY(sr.serviceDate) : '—');
    section('Service Charges:', formatMoney(sr.serviceCharges));
    section('Taxes:', formatMoney(sr.taxes));
    section('Total Amount:', formatMoney(sr.totalAmount));
    section('Service Status:', sr.serviceStatus || '—');
    if(sr.receiptRemarks) section('Receipt Remarks:', sr.receiptRemarks);
  }

  heading('Permanent Timeline');
  (sr.history||[]).forEach(h=>{
    section(h.stage+' — '+h.action+'  ('+(h.actorName||h.actorEmail||'—')+', '+formatDateDMY(h.timestamp)+')', h.remark||'');
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
    doc.text('Page '+p+' / '+totalPages, pageW-margin-60, pageH-20);
    doc.setTextColor(0,0,0);
  }
  return doc;
}
async function openServiceRequestReportModal(sr){
  const fileNameBase = 'Service_Report_'+sr.serviceRequestNumber.replace(/[^a-z0-9]+/gi,'_');
  openModal(
    'Service Request Report',
    '<div id="pdf-report-status" class="field-hint">Generating report…</div><div id="pdf-report-preview" style="margin-top:10px;"></div>',
    '<button class="btn btn-outline" id="pdf-report-close-btn">Close</button>'
    + '<button class="btn btn-outline" id="pdf-report-regenerate-btn">Regenerate</button>'
    + '<button class="btn btn-primary" id="pdf-report-download-btn" disabled>Download</button>',
    'module-service-procurement'
  );
  const modalEl = document.querySelector('#modal-overlay .modal');
  if(modalEl) modalEl.style.maxWidth = '820px';
  document.getElementById('pdf-report-close-btn').addEventListener('click', closeModal);

  let currentBlobUrl = null;
  const render = async ()=>{
    const statusEl = document.getElementById('pdf-report-status');
    const previewEl = document.getElementById('pdf-report-preview');
    const downloadBtn = document.getElementById('pdf-report-download-btn');
    if(!statusEl || !previewEl) return;
    statusEl.textContent = 'Generating report…';
    downloadBtn.disabled = true;
    try{
      const doc = await buildServiceRequestReportPdf(sr);
      const blob = doc.output('blob');
      if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(blob);
      const totalPages = doc.internal.getNumberOfPages();
      statusEl.textContent = 'Page 1 / '+totalPages;
      previewEl.innerHTML = '<iframe src="'+currentBlobUrl+'" style="width:100%; height:60vh; border:1px solid var(--color-border); border-radius:6px;"></iframe>';
      downloadBtn.disabled = false;
      downloadBtn.onclick = ()=>{
        const a = document.createElement('a');
        a.href = currentBlobUrl; a.download = fileNameBase+'.pdf';
        document.body.appendChild(a); a.click(); a.remove();
      };
    }catch(e){ statusEl.textContent = 'Could not generate report: '+e.message; }
  };
  document.getElementById('pdf-report-regenerate-btn').addEventListener('click', render);
  render();
}

function openArchiveModal(){ renderArchiveModalBody(); }
function renderArchiveModalBody(){
  const entries = DB.archiveLog.slice().filter(e=>!e.restored).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  if(!entries.length){
    openModal('Archive', '<div class="empty-state"><div class="icon">🗄️</div><h3>Nothing deleted yet</h3></div>', '<button class="btn btn-outline" id="modal-done-btn">Close</button>', 'module-admin');
    document.getElementById('modal-done-btn').addEventListener('click', closeModal);
    return;
  }
  const body = entries.map(e=>
    '<div class="cat-policy-row"><div class="cat-policy-name">'
      + '<span class="badge badge-status">'+entityTypeLabel(e.entityType)+'</span> '+escapeHtml(e.label)
      + '<br><small style="color:var(--color-ink-faint);">Deleted by '+escapeHtml(e.deletedByName||e.deletedByEmail||'—')+' · '+formatDateTime(e.deletedAt)+(e.reason?' · "'+escapeHtml(e.reason)+'"':'')+'</small>'
      + '</div><div class="cat-policy-controls"><button class="btn btn-outline btn-sm" data-restore="'+e.id+'">Restore</button></div></div>'
  ).join('');
  openModal('Archive', body, '<button class="btn btn-outline" id="modal-done-btn">Close</button>', 'module-admin');
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  document.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = DB.archiveLog.find(x=>x.id===btn.getAttribute('data-restore'));
      const record = entry ? findEntityRecord(entry.entityType, entry.entityId) : null;
      if(!record){ toast('Could not find the original record','error'); return; }
      const ok = await runSaveAction(btn, 'Restoring…', async ()=>{
        restoreRecord(entry.entityType, record);
        await saveDb();
      });
      if(!ok) return;
      toast('Restored','success'); renderArchiveModalBody(); renderRoute();
    });
  });
}

function renderManageBuildingsModalBody(){
  const buildings = DB.buildings.filter(b=>!b.deleted).sort((a,b)=>a.sortOrder-b.sortOrder);
  const rows = buildings.map(b=>{
    const rooms = DB.rooms.filter(r=>r.buildingId===b.id && !r.deleted);
    return '<div style="border:1px solid var(--color-border); border-radius:10px; padding:12px; margin-bottom:10px;">'
      + '<div style="display:flex; justify-content:space-between; align-items:center;"><strong>'+escapeHtml(b.name)+'</strong>'
      +   (isAdmin() ? '<button class="btn btn-danger btn-sm" data-del-bldg="'+b.id+'">Delete</button>' : '')
      + '</div>'
      + '<div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">'
      +   rooms.map(rm=>'<span class="badge badge-status">'+escapeHtml(rm.name)+' <button data-del-room="'+rm.id+'" style="border:none;background:none;cursor:pointer;color:var(--color-danger);font-weight:700;margin-left:4px;">&times;</button></span>').join('')
      + '</div>'
      + '<div style="margin-top:8px; display:flex; gap:6px;"><input type="text" placeholder="New room name" data-newroom-input="'+b.id+'" style="flex:1; padding:6px 9px; border:1.5px solid var(--color-border); border-radius:7px; font-size:12.5px;"><button class="btn btn-outline btn-sm" data-add-room="'+b.id+'">+ Add Room</button></div>'
      + '</div>';
  }).join('');
  const body = rows
    + '<div class="plain-divider"></div>'
    + '<div class="field"><label>New Building Name</label><input type="text" id="new-bldg-name"></div>'
    + '<button class="btn btn-primary btn-sm" id="add-bldg-btn">+ Add Building</button>';
  openModal('Manage Buildings &amp; Rooms', body, '<button class="btn btn-outline" id="modal-done-btn">Done</button>', 'module-admin', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  document.getElementById('add-bldg-btn').addEventListener('click', async function(){
    const btn = this;
    const name = document.getElementById('new-bldg-name').value.trim();
    if(!name) return;
    const ok = await runSaveAction(btn, 'Adding…', async ()=>{
      await pushAndSave(DB.buildings, { id:nextId('bldg'), name, sortOrder: DB.buildings.length });
    });
    if(!ok) return;
    toast('Building added','success'); renderManageBuildingsModalBody();
  });
  document.querySelectorAll('[data-add-room]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const buildingId = btn.getAttribute('data-add-room');
      const input = document.querySelector('[data-newroom-input="'+buildingId+'"]');
      const name = input.value.trim(); if(!name) return;
      const ok = await runSaveAction(btn, '…', async ()=>{
        await pushAndSave(DB.rooms, { id:nextId('room'), buildingId, name });
      });
      if(!ok) return;
      toast('Room added','success'); renderManageBuildingsModalBody();
    });
  });
  document.querySelectorAll('[data-del-bldg]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-bldg');
      const b = DB.buildings.find(x=>x.id===id);
      if(!promptAndArchive('building', b, b.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{
        DB.rooms.filter(r=>r.buildingId===id && !r.deleted).forEach(r=>archiveRecord('room', r, r.name, 'Parent building deleted'));
        await saveDb();
      });
      if(!ok) return;
      toast('Building deleted (archived)','success'); renderManageBuildingsModalBody();
    });
  });
  document.querySelectorAll('[data-del-room]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const room = DB.rooms.find(x=>x.id===btn.getAttribute('data-del-room'));
      if(!promptAndArchive('room', room, room.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{ await saveDb(); });
      if(!ok) return;
      toast('Room deleted (archived)','success'); renderManageBuildingsModalBody();
    });
  });
}

/* ============================================================
   One-time setup screen (shown until CONFIG.DB_FILE_ID is set)
   ============================================================ */
function renderSetupScreen(){
  document.getElementById('app').innerHTML =
    '<div class="content wrap">'
    + '<div class="page-title"><h2>One-time Portal Setup</h2></div>'
    + '<p class="page-subtitle">Sign in with the Google account that should own the portal data, then initialize storage.</p>'
    + '<button class="btn btn-gold" id="setup-signin-btn">Sign in with Google</button>'
    + '<div id="setup-status" style="margin-top:16px;"></div>'
    + '<button class="btn btn-primary" id="setup-init-btn" style="margin-top:12px;" disabled>Initialize Portal Data</button>'
    + '</div>';

  document.getElementById('setup-signin-btn').addEventListener('click', ()=>{
    if(!tokenClient){ toast('Set OAUTH_CLIENT_ID and DRIVE_API_KEY in CONFIG first, then reload.', 'error'); return; }
    tokenClient.requestAccessToken({ prompt:'consent' });
  });
  const statusBox = document.getElementById('setup-status');
  const initBtn = document.getElementById('setup-init-btn');
  const poll = setInterval(()=>{
    if(accessToken){
      clearInterval(poll);
      initBtn.disabled = false;
      statusBox.innerHTML = '<p style="color:var(--color-success);">Signed in as '+escapeHtml(currentUserEmail||'')+'. Ready to initialize.</p>';
    }
  }, 400);
  initBtn.addEventListener('click', async ()=>{
    initBtn.disabled = true; initBtn.textContent = 'Creating…';
    try{
      const folderId = await driveCreateFolder('Taqwa Islamic School Portal Files');
      const seedData = emptyDb();
      const dbFileId = await driveCreateJsonFile('taqwa-portal-db.json', folderId, seedData);
      await driveSetPublicReadable(dbFileId);
      await driveSetPublicReadable(folderId);
      statusBox.innerHTML = '<p style="color:var(--color-success); font-weight:600;">Done! Copy these values into CONFIG at the top of this file\u2019s &lt;script&gt; block, save, and reload:</p>'
        + '<pre>DB_FILE_ID: "'+dbFileId+'",\nUPLOADS_FOLDER_ID: "'+folderId+'"</pre>';
    }catch(e){
      statusBox.innerHTML = '<div class="form-error">Setup failed: '+escapeHtml(e.message)+'</div>';
      initBtn.disabled = false; initBtn.textContent = 'Initialize Portal Data';
    }
  });
}

/* ============================================================
   Boot
   ============================================================ */
async function boot(){
  restoreSession();
  renderTopbar();
  renderFooter();
  initAuth();
  if(!CONFIG.DB_FILE_ID){ renderSetupScreen(); return; }
  try{
    await loadDb();
    if(accessToken && currentUserEmail){
      const allowed = allStaffEmails();
      if(allowed.size && !allowed.has(currentUserEmail.toLowerCase())){
        accessToken = null; currentUserEmail = null;
        try{ sessionStorage.removeItem('taqwa_session'); }catch(e){}
      }
    }
    renderTopbar();
    renderRoute();
    startAutoRefresh();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="content wrap"><div class="empty-state"><h3>Could not load portal data</h3><p>'+escapeHtml(e.message)+'</p>'
      + '<p class="field-hint" style="margin-top:6px;">This is almost always a temporary connection issue (weak wifi, VPN, or a browser extension blocking the request) rather than a problem with the portal itself.</p>'
      + '<button class="btn btn-primary" id="retry-boot-btn" style="margin-top:14px;">Retry</button>'
      + '</div></div>';
    const retryBtn = document.getElementById('retry-boot-btn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{ document.getElementById('app').innerHTML = ''; boot(); });
  }
}
/* ============================================================
   Background auto-refresh — keeps everyone's screen current
   without a manual reload, while never disturbing someone
   actively filling a form or with a modal open.
   ============================================================ */
const AUTO_REFRESH_MS = 30000;
let autoRefreshTimer = null;
function isSafeToAutoRefresh(){
  const overlay = document.getElementById('modal-overlay');
  if(overlay && overlay.style.display === 'flex') return false; // a modal (often mid-form) is open
  const hash = location.hash || '#/';
  if(hash.startsWith('#/procurement') && typeof procTab !== 'undefined' && procTab === 'new') return false; // composing a new request
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return false; // actively typing somewhere
  return true;
}
async function autoRefreshTick(){
  if(!isSafeToAutoRefresh()) return;
  try{
    const before = JSON.stringify(DB);
    const beforeCounts = isSignedIn() ? { approvals:myApprovalQueue().length, tasks:myPurchaseQueue().length, receipt:myReceiptQueue().length, issue:myItemIssueQueue().length } : null;
    await loadDb(false); // no internal retry here — the next tick in 30s IS the retry; tripling requests on every failed tick is what helped trip the throttling in the first place
    const after = JSON.stringify(DB);
    if(before !== after){
      if(beforeCounts){
        const afterCounts = { approvals:myApprovalQueue().length, tasks:myPurchaseQueue().length, receipt:myReceiptQueue().length, issue:myItemIssueQueue().length };
        // Same real-state-change principle as the same-user case — just
        // discovered on the next poll instead of instantly, since there's
        // no push/websocket layer to notify across users immediately.
        Object.keys(afterCounts).forEach(k=>{ if(afterCounts[k] > beforeCounts[k]) flagTabAttention(k); });
      }
      renderTopbar(); renderRoute();
    }
  }catch(e){ /* silent — keep showing existing data, try again next tick */ }
}
function startAutoRefresh(){
  if(autoRefreshTimer) return;
  autoRefreshTimer = setInterval(autoRefreshTick, AUTO_REFRESH_MS);
}

/* ============================================================
   PWA install — "Add to Home Screen" / desktop install
   ============================================================ */
let deferredInstallPrompt = null;
function isIOSInstallCandidate(){
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const alreadyInstalled = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  return isIOS && !alreadyInstalled;
}
function showInstallButton(){
  return !!deferredInstallPrompt || isIOSInstallCandidate();
}
// Chrome/Edge/Android fire this instead of showing their own install UI
// automatically — capturing it lets our own "Install App" button trigger
// the native prompt on demand.
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderTopbar();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  renderTopbar();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Service worker registration failed:', err));
  });
}

boot();
