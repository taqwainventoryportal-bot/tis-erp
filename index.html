/* ============================================================
   Asset install/dispose — one shared mechanism used from both Item Issue /
   Return (request-linked, for freshly-received stock) and Spare Assets
   (item-linked, for stock already sitting spare). Each install is its own
   immutable event (own location/date), so one item can be installed across
   several locations over time without losing that history; disposal
   reduces an installation's *remaining* qty rather than editing it away.
   ============================================================ */
function itemPatternOf(item){
  if(item.catalogItemId){
    const ci = DB.itemCatalog.find(c=>c.id===item.catalogItemId);
    if(ci) return itemPattern({ itemTypeId: ci.itemTypeId });
  }
  return 'consumable';
}
function installedQtyForItem(item){
  return (item.installations||[]).reduce((s,ins)=>s+(Number(ins.qty)||0)-(Number(ins.disposedQty)||0), 0);
}
function disposedQtyForItem(item){
  return (item.disposals||[]).reduce((s,d)=>s+(Number(d.qty)||0), 0);
}
function activeInstallationsForItem(item){
  return (item.installations||[]).filter(ins => (Number(ins.qty)||0)-(Number(ins.disposedQty)||0) > 0);
}
function performAssetInstall(item, qty, buildingId, roomId, remarks, requestNumber){
  if(!Array.isArray(item.installations)) item.installations = [];
  if(!Array.isArray(item.disposals)) item.disposals = [];
  const destLabel = buildingName(buildingId)+(roomId?' → '+roomName(roomId):'');
  const actorName = (myStaffRecord()||{}).name || currentUserEmail;
  const remark = 'Installed '+qty+' at '+destLabel+(remarks?' — '+remarks:'');
  // 'Install' is a distinct ledger type from 'Issue' — installing an asset
  // is not consumption, and must never be counted by the Consumption totals
  // (which specifically filter type==='Issue').
  const balance = pushLedgerEntry(item.id, 'Install', requestNumber||'', 0, qty, remark);
  item.quantity = balance;
  item.updatedAt = new Date().toISOString();
  item.status = 'Assets Installed';
  item.installations.push({
    id: nextId('inst'), qty, disposedQty: 0, buildingId, roomId: roomId||null,
    installedDate: new Date().toISOString().slice(0,10), requestNumber: requestNumber||'',
    installedByEmail: currentUserEmail, installedByName: actorName, remarks: remarks||'',
    timestamp: new Date().toISOString()
  });
  itemHistoryPush(item, 'Installed', remark);
}
function performAssetDispose(item, installationId, qty, disposedByEmail, disposedByName, date, reason, remarks){
  const inst = (item.installations||[]).find(i=>i.id===installationId);
  if(!inst) throw new Error('Installation record not found');
  const remaining = (Number(inst.qty)||0) - (Number(inst.disposedQty)||0);
  if(qty<=0 || qty>remaining) throw new Error('Quantity must be between 1 and '+remaining+' (currently installed at that location)');
  inst.disposedQty = (Number(inst.disposedQty)||0) + qty;
  const destLabel = buildingName(inst.buildingId)+(inst.roomId?' → '+roomName(inst.roomId):'');
  const remark = 'Disposed '+qty+' from '+destLabel+' — '+reason+(remarks?' — '+remarks:'');
  if(!Array.isArray(item.disposals)) item.disposals = [];
  item.disposals.push({
    id: nextId('disp'), installationId, qty, disposedByEmail, disposedByName,
    date: date || new Date().toISOString().slice(0,10), reason, remarks: remarks||'',
    buildingId: inst.buildingId, roomId: inst.roomId, timestamp: new Date().toISOString()
  });
  // Recorded on the ledger for audit visibility (type 'Dispose', distinct
  // from both 'Install' and 'Issue') but deliberately does NOT reduce
  // item.quantity — disposal removes installed stock, not available/spare
  // stock, and must never be read as a consumption transaction.
  pushLedgerEntry(item.id, 'Dispose', '', 0, 0, remark);
  item.updatedAt = new Date().toISOString();
  if(installedQtyForItem(item)<=0) item.status = 'Disposed (fully)';
  itemHistoryPush(item, 'Disposed', remark);
}

function myPurchaseQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='purchase_pending' && canPurchaseAction()); }
// Item Receipt: purchased, physically arrived stock not yet confirmed.
function myReceiptQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='purchased' && canReceiveAction()); }
// Item Issue / Return: receipt confirmed, stock sitting as "available" until
// someone decides what happens to it (installed / consumed / kept spare).
// A request can sit here across multiple visits if only part of the
// received quantity is processed at a time.
function myItemIssueQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='received' && canReceiveAction()); }
/* Where the "Awaiting My Action" dashboard card should send someone —
   whichever of their queues actually has something in it. */
function myActionTargetHash(){
  if(!isSignedIn()) return '#/procurement';
  if(myApprovalQueue().length) return '#/procurement/approvals';
  if(myPurchaseQueue().length) return '#/procurement/tasks';
  if(myReceiptQueue().length) return '#/procurement/receipt';
  if(myItemIssueQueue().length) return '#/procurement/issue';
  if(myServiceApprovalQueue().length) return '#/service-procurement/approvals';
  if(myServiceReceiptQueue().length) return '#/service-procurement/receipts';
  return '#/procurement/approvals';
}
/* The inventory record a request item is tied to, and by extension its live
   available quantity — the SAME record used by Inventory Management → Stock
   Consumption. Item Issue always reads/writes through here, never a separate
   procurement-side count, so there is exactly one source of truth. */
function linkedInventoryItem(r){ return DB.inventoryItems.find(i=>i.linkedRequestItemId===r.id && !i.deleted) || null; }

/* Live "something just changed here" highlight — tied to real state
   transitions (both same-user actions and, on the next background poll,
   changes another user made), not a bare timer. A tab only gets flagged
   when its own queue actually grew. */
let tabAttentionFlags = {};
function flagTabAttention(tabKey){ tabAttentionFlags[tabKey] = Date.now(); }
function tabHasAttention(tabKey){ return !!tabAttentionFlags[tabKey] && (Date.now()-tabAttentionFlags[tabKey] < 4000); }

function renderProcurementPage(initialTab){
  const app = document.getElementById('app');
  if(initialTab) procTab = initialTab;
  if(!procTab) procTab = 'new';
  const canApproveAny = isSignedIn() && isApproverRole();
  const canPurchaseAny = isSignedIn() && canPurchaseAction();
  const canReceiveAny = isSignedIn() && canReceiveAction();

  const tabs = [];
  if(isSignedIn()) tabs.push(['new','New Request', 0]);
  if(canApproveAny) tabs.push(['approvals','Approvals', myApprovalQueue().length]);
  if(canPurchaseAny) tabs.push(['tasks','Purchase Assignment', myPurchaseQueue().length]);
  if(canReceiveAny) tabs.push(['receipt','Item Receipt', myReceiptQueue().length]);
  if(canReceiveAny) tabs.push(['issue','Item Issue / Return', myItemIssueQueue().length]);
  tabs.push(['pos','Purchase Orders', 0]);
  tabs.push(['all','All Requests', 0]);

  app.innerHTML =
    '<div class="content wrap module-procurement">'
    + '<div class="page-title"><h2>Item Procurement</h2></div>'
    + '<div class="page-subtitle-inline">Purchase requests, approvals, purchasing, receipt and issue — permanently tracked.</div>'
    + '<div class="tab-strip proc-tab-strip">' + tabs.map(t=>
        '<button class="tab-btn '+(procTab===t[0]?'active':'')+(tabHasAttention(t[0])?' tab-attention':'')+'" data-proc-tab="'+t[0]+'">'
          + '<span>'+t[1]+'</span>' + (t[2] ? '<span class="tab-count-badge">'+t[2]+'</span>' : '')
        + '</button>'
      ).join('') + '</div>'
    + '<div class="tab-panel" id="proc-panel"></div>'
    + '</div>';

  document.querySelectorAll('[data-proc-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ procTab = btn.getAttribute('data-proc-tab'); delete tabAttentionFlags[procTab]; renderProcurementPage(); });
  });

  if(!isSignedIn() && procTab!=='all'){ procTab = 'all'; }
  if(procTab==='new') renderNewRequestTab();
  else if(procTab==='approvals') renderApprovalsTab();
  else if(procTab==='tasks') renderTasksTab();
  else if(procTab==='receipt') renderReceiptTab();
  else if(procTab==='issue') renderItemIssueTab();
  else if(procTab==='pos') renderPurchaseOrdersTab();
  else renderAllRequestsTab();
}

/* ---------------- New Request ---------------- */
let newRequestLines = [];
let newReqExpandedId = null;
let newReqDraftBannerDismissed = false;
const REQ_DRAFT_KEY = 'taqwa_req_draft';
const REASON_OPTIONS = ['Classroom Requirements','Refreshments','Events / Annual Functions','Sanitation & Hygiene','First-Aid','Office','Furniture','Any Other'];
// Freely selectable, not locked to the logged-in person — the operator is
// often digitizing a paper register entry on behalf of whoever asked,
// defaulting to their own name only as a starting point.
function requestedByOptions(){
  const mine = myStaffRecord();
  const staffList = DB.staff.filter(s=>!s.deleted && s.active!==false).slice().sort((a,b)=>a.name.localeCompare(b.name));
  return staffList.map(s=>'<option value="'+s.id+'" '+(mine && mine.id===s.id?'selected':'')+'>'+escapeHtml(s.name)+'</option>').join('');
}
function renderNewRequestTab(){
  const panel = document.getElementById('proc-panel');
  if(!newRequestLines.length) newRequestLines = [{ localId: nextId('line') }];
  if(!newReqExpandedId || !newRequestLines.some(l=>l.localId===newReqExpandedId)) newReqExpandedId = newRequestLines[0].localId;

  let draftRaw = null;
  try{ draftRaw = sessionStorage.getItem(REQ_DRAFT_KEY); }catch(e){ /* storage unavailable — just skip the draft feature */ }
  const isFreshForm = newRequestLines.length===1 && !newRequestLines[0].categoryId && !newRequestLines[0].catalogItemId;
  const showDraftBanner = !!draftRaw && !newReqDraftBannerDismissed && isFreshForm;

  panel.innerHTML = '<div class="new-req-compact">'
    + (showDraftBanner
      ? '<div class="draft-banner"><span><strong>Saved draft found</strong> from earlier on this device.</span>'
        + '<button class="btn btn-outline btn-sm" id="restore-draft-btn">Restore draft</button>'
        + '<button class="btn btn-ghost-dark btn-sm" id="discard-draft-btn">Discard</button></div>'
      : '')
    + '<div class="field-row">'
    +   '<div class="field"><label>Request Date</label><input type="date" id="req-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +   '<div class="field"><label>Requested By</label><select id="req-requested-by">'+requestedByOptions()+'</select></div>'
    + '</div>'
    + '<div class="req-items-header"><h3>Items</h3><button class="btn btn-outline btn-sm" id="add-line-btn">+ Add Another Item</button></div>'
    + '<div id="req-lines"></div>'
    + '<div class="req-action-bar">'
    +   '<button class="btn btn-ghost-dark" id="cancel-request-btn">Cancel</button>'
    +   '<button class="btn btn-outline" id="save-draft-btn">Save Draft</button>'
    +   '<button class="btn btn-primary" id="submit-request-btn">Submit Purchase Request</button>'
    + '</div>'
    + '</div>';

  function captureLineValues(){
    const wrap = document.getElementById('req-lines');
    if(!wrap) return;
    newRequestLines.forEach(line=>{
      ['categoryId','catalogItemId','quantityRequested','priority','reason','description'].forEach(field=>{
        const el = wrap.querySelector('[data-line-id="'+line.localId+'"][data-line-field="'+field+'"]');
        if(el) line[field] = el.value;
      });
    });
  }
  // Datalist-backed search: the visible text input lets people type to filter
  // instead of scrolling a long <select>; a hidden input carries the real id.
  function itemDatalistOptions(categoryId){
    return DB.itemCatalog.filter(i=>!i.deleted && i.categoryId===categoryId).sort((a,b)=>a.code.localeCompare(b.code))
      .map(i=>({ id:i.id, label: i.code+' — '+i.name }));
  }
  function lineSummaryText(line){
    const item = DB.itemCatalog.find(i=>i.id===line.catalogItemId);
    if(!item) return 'No item selected yet';
    return escapeHtml(item.name)+' · Qty '+escapeHtml(line.quantityRequested||'1')+' · '+escapeHtml(line.priority||'Medium');
  }
  function liveSummaryText(lineId){
    const wrap = document.getElementById('req-lines');
    const get = f=>{ const el = wrap.querySelector('[data-line-id="'+lineId+'"][data-line-field="'+f+'"]'); return el ? el.value : ''; };
    const item = DB.itemCatalog.find(i=>i.id===get('catalogItemId'));
    if(!item) return 'No item selected yet';
    return escapeHtml(item.name)+' · Qty '+escapeHtml(get('quantityRequested')||'1')+' · '+escapeHtml(get('priority')||'Medium');
  }
  function refreshSummaryEl(lineId){
    const el = document.querySelector('.req-line-summary[data-summary-for="'+lineId+'"]');
    if(el) el.innerHTML = liveSummaryText(lineId);
  }
  function autoGrowTextarea(ta){
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, 38) + 'px';
  }
  function renderLines(){
    const wrap = document.getElementById('req-lines');
    wrap.innerHTML = newRequestLines.map((line, idx)=>{
      const catOptions = DB.categories.filter(c=>!c.deleted).map(c=>'<option value="'+c.id+'" '+(line.categoryId===c.id?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('');
      const priorities = ['Low','Medium','High','Urgent'];
      const priorityOptions = priorities.map(p=>'<option '+((line.priority||'Medium')===p?'selected':'')+'>'+p+'</option>').join('');
      const catId = line.categoryId || (DB.categories.find(c=>!c.deleted)||{}).id;
      const items = itemDatalistOptions(catId);
      const selectedItem = items.find(x=>x.id===line.catalogItemId);
      const collapsed = line.localId !== newReqExpandedId;
      return '<div class="req-line-card'+(collapsed?' collapsed':'')+'" data-line="'+line.localId+'">'
        + '<div class="req-line-head">'
        +   '<div class="req-line-head-left"><span class="req-line-chevron">▼</span><strong>Item '+(idx+1)+'</strong>'
        +     '<span class="req-line-summary" data-summary-for="'+line.localId+'">'+lineSummaryText(line)+'</span></div>'
        +   (newRequestLines.length>1?'<button class="btn btn-danger btn-sm" data-remove-line="'+line.localId+'">Remove</button>':'')
        + '</div>'
        + '<div class="req-line-body">'
        + '<div class="field-row">'
        +   '<div class="field"><label>Category</label><select data-line-field="categoryId" data-line-id="'+line.localId+'" data-cat-select="'+line.localId+'">'+catOptions+'</select></div>'
        +   '<div class="field"><label>Item</label>'
        +     '<input type="text" list="dl-item-'+line.localId+'" data-item-search="'+line.localId+'" placeholder="Type to search item…" autocomplete="off" value="'+(selectedItem?escapeHtml(selectedItem.label):'')+'">'
        +     '<datalist id="dl-item-'+line.localId+'">'+items.map(x=>'<option value="'+escapeHtml(x.label)+'"></option>').join('')+'</datalist>'
        +     '<input type="hidden" data-line-field="catalogItemId" data-line-id="'+line.localId+'" value="'+(line.catalogItemId||'')+'">'
        +   '</div>'
        + '</div>'
        + '<div class="field-row">'
        +   '<div class="field"><label>Quantity Requested</label><input type="number" min="1" value="'+escapeHtml(line.quantityRequested||'1')+'" data-line-field="quantityRequested" data-line-id="'+line.localId+'"></div>'
        +   '<div class="field"><label>Priority</label><select data-line-field="priority" data-line-id="'+line.localId+'">'+priorityOptions+'</select></div>'
        + '</div>'
        + '<div class="field"><label>Reason</label><select data-line-field="reason" data-line-id="'+line.localId+'" data-reason-select="'+line.localId+'">'
        +   '<option value="">— Select a reason —</option>'
        +   REASON_OPTIONS.map(opt=>'<option value="'+opt+'" '+(line.reason===opt?'selected':'')+'>'+opt+'</option>').join('')
        + '</select></div>'
        + '<div class="field" data-desc-wrap="'+line.localId+'" style="'+(line.reason==='Any Other'?'':'display:none;')+'"><label>Description '+(line.reason==='Any Other'?'(required)':'(optional)')+'</label><textarea rows="2" data-line-field="description" data-line-id="'+line.localId+'">'+escapeHtml(line.description||'')+'</textarea></div>'
        + '</div>'
        + '</div>';
    }).join('');
    document.getElementById('add-line-btn').style.display = newRequestLines.length>=1 ? '' : 'none';

    wrap.querySelectorAll('textarea[data-line-field="description"]').forEach(ta=>{
      autoGrowTextarea(ta);
      ta.addEventListener('input', ()=>autoGrowTextarea(ta));
    });
    wrap.querySelectorAll('[data-reason-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const lineId = sel.getAttribute('data-reason-select');
        const line = newRequestLines.find(l=>l.localId===lineId);
        if(line) line.reason = sel.value;
        const isOther = sel.value === 'Any Other';
        const descWrap = wrap.querySelector('[data-desc-wrap="'+lineId+'"]');
        if(descWrap){
          descWrap.style.display = isOther ? '' : 'none';
          descWrap.querySelector('label').textContent = 'Description ' + (isOther ? '(required)' : '(optional)');
        }
      });
    });
    wrap.querySelectorAll('[data-cat-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const lineId = sel.getAttribute('data-cat-select');
        const line = newRequestLines.find(l=>l.localId===lineId);
        if(line){ line.categoryId = sel.value; line.catalogItemId = ''; }
        const items = itemDatalistOptions(sel.value);
        const dl = wrap.querySelector('#dl-item-'+lineId);
        if(dl) dl.innerHTML = items.map(x=>'<option value="'+escapeHtml(x.label)+'"></option>').join('');
        const searchInp = wrap.querySelector('[data-item-search="'+lineId+'"]');
        if(searchInp) searchInp.value = '';
        const hidden = wrap.querySelector('[data-line-field="catalogItemId"][data-line-id="'+lineId+'"]');
        if(hidden) hidden.value = '';
        refreshSummaryEl(lineId);
      });
    });
    wrap.querySelectorAll('[data-item-search]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const lineId = inp.getAttribute('data-item-search');
        const catSel = wrap.querySelector('[data-cat-select="'+lineId+'"]');
        const items = itemDatalistOptions(catSel ? catSel.value : '');
        const match = items.find(x=>x.label===inp.value);
        const hidden = wrap.querySelector('[data-line-field="catalogItemId"][data-line-id="'+lineId+'"]');
        if(hidden) hidden.value = match ? match.id : '';
        refreshSummaryEl(lineId);
      });
    });
    wrap.querySelectorAll('[data-line-field="quantityRequested"], [data-line-field="priority"]').forEach(el=>{
      el.addEventListener('input', ()=>refreshSummaryEl(el.getAttribute('data-line-id')));
      el.addEventListener('change', ()=>refreshSummaryEl(el.getAttribute('data-line-id')));
    });
    wrap.querySelectorAll('[data-remove-line]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        captureLineValues();
        const removedId = btn.getAttribute('data-remove-line');
        newRequestLines = newRequestLines.filter(l=>l.localId!==removedId);
        if(newReqExpandedId===removedId) newReqExpandedId = newRequestLines[0].localId;
        renderLines();
      });
    });
    // Only the clicked card stays expanded — clicking a collapsed card's
    // header expands it and quietly collapses whichever one was open.
    wrap.querySelectorAll('.req-line-head').forEach(head=>{
      head.addEventListener('click', (e)=>{
        if(e.target.closest('[data-remove-line]')) return;
        const card = head.closest('.req-line-card');
        const lineId = card.getAttribute('data-line');
        if(lineId === newReqExpandedId) return;
        const prevCard = wrap.querySelector('.req-line-card[data-line="'+newReqExpandedId+'"]');
        if(prevCard){ refreshSummaryEl(newReqExpandedId); prevCard.classList.add('collapsed'); }
        card.classList.remove('collapsed');
        newReqExpandedId = lineId;
      });
    });
  }
  renderLines();

  document.getElementById('add-line-btn').addEventListener('click', ()=>{
    captureLineValues();
    const newLine = { localId: nextId('line') };
    newRequestLines.push(newLine);
    newReqExpandedId = newLine.localId;
    renderLines();
  });

  if(showDraftBanner){
    document.getElementById('restore-draft-btn').addEventListener('click', ()=>{
      try{
        const d = JSON.parse(draftRaw);
        newRequestLines = (d && d.lines && d.lines.length) ? d.lines : [{ localId: nextId('line') }];
        newReqExpandedId = newRequestLines[0].localId;
        newReqDraftBannerDismissed = true;
        renderNewRequestTab();
        toast('Draft restored','success');
      }catch(e){ toast('Could not read the saved draft','error'); }
    });
    document.getElementById('discard-draft-btn').addEventListener('click', ()=>{
      try{ sessionStorage.removeItem(REQ_DRAFT_KEY); }catch(e){}
      newReqDraftBannerDismissed = true;
      renderNewRequestTab();
    });
  }

  document.getElementById('cancel-request-btn').addEventListener('click', ()=>{
    newRequestLines = [];
    newReqExpandedId = null;
    renderNewRequestTab();
    toast('Request cleared','success');
  });

  document.getElementById('save-draft-btn').addEventListener('click', ()=>{
    captureLineValues();
    try{
      sessionStorage.setItem(REQ_DRAFT_KEY, JSON.stringify({ lines: newRequestLines }));
      toast('Draft saved on this device','success');
    }catch(e){ toast('Could not save draft — storage unavailable','error'); }
  });

  document.getElementById('submit-request-btn').addEventListener('click', async function(){
    const btn = this;
    captureLineValues();
    const wrap = document.getElementById('req-lines');
    const lineData = newRequestLines.map(line=>{
      const get = (field)=>{ const el = wrap.querySelector('[data-line-id="'+line.localId+'"][data-line-field="'+field+'"]'); return el ? el.value.trim() : ''; };
      const catalogItemId = get('catalogItemId');
      const catalogItem = DB.itemCatalog.find(i=>i.id===catalogItemId);
      const categoryId = get('categoryId');
      const cat = DB.categories.find(c=>c.id===categoryId);
      return {
        categoryId,
        catalogItemId,
        itemName: catalogItem ? catalogItem.name : '',
        itemCode: catalogItem ? catalogItem.code : '',
        quantityRequested: Number(get('quantityRequested'))||0,
        priority: get('priority'),
        reason: get('reason'),
        description: get('description'),
        // Catalog item is the source of truth (it can override the category's
        // defaults per-item, e.g. one expensive item in an otherwise cheap
        // category) — only fall back to the category default if the catalog
        // item is somehow missing a value.
        itemTypeId: catalogItem ? (catalogItem.itemTypeId || (cat?cat.itemTypeId:'type_consumable')) : (cat?cat.itemTypeId:'type_consumable'),
        procurementPolicy: catalogItem ? (catalogItem.procurementPolicy || (cat?cat.procurementPolicy:'required')) : (cat?cat.procurementPolicy:'required'),
        valueClass: catalogItem ? (catalogItem.valueClass || (cat?cat.valueClass:'low')) : (cat?cat.valueClass:'low')
      };
    });
    if(lineData.some(l=>!l.itemName || !l.quantityRequested)){ toast('Every item needs a selected catalog item and quantity','error'); return; }
    if(lineData.some(l=>!l.reason)){ toast('Every item needs a Reason selected','error'); return; }
    if(lineData.some(l=>l.reason==='Any Other' && !l.description)){ toast('Description is required when Reason is "Any Other"','error'); return; }
    const requestDate = document.getElementById('req-date').value;
    const requestedByStaffId = document.getElementById('req-requested-by').value;
    const requestedByStaff = staffById(requestedByStaffId);
    if(!requestedByStaff){ toast('Choose who this request is for','error'); return; }
    const requestedByEmail = requestedByStaff.email || currentUserEmail;
    const requestedByName = requestedByStaff.name;

    let createdNumbers = [];
    const ok = await runSaveAction(btn, 'Submitting…', async ()=>{
      // Auto-split: a request can only contain one Value Classification.
      // Items of a different tier silently become their own separate request.
      const groups = {};
      lineData.forEach(l=>{ (groups[l.valueClass] = groups[l.valueClass] || []).push(l); });
      const groupKeys = Object.keys(groups);
      const newItemRecords = [], newRequestRecords = [];
      groupKeys.forEach(tierKey=>{
        const items = groups[tierKey];
        const requestNumber = requestNumberNext();
        const requestId = nextId('req');
        const itemIds = [];
        items.forEach(l=>{
          const id = nextId('ri');
          itemIds.push(id);
          const record = {
            id, requestId, requestNumber, requestDate,
            requestedByStaffId, requestedByEmail, requestedByName,
            categoryId: l.categoryId, itemTypeId: l.itemTypeId, itemName: l.itemName, itemCode: l.itemCode, catalogItemId: l.catalogItemId, quantityRequested: l.quantityRequested,
            priority: l.priority, reason: l.reason, description: l.description,
            valueClass: l.valueClass, procurementPolicy: l.procurementPolicy,
            linkedAssetId: null,
            approvalStatus: null, status: null,
            escalatedByEmail: null, escalatedByName: null, escalatedAt: null, escalationComment: null,
            assignedPurchaserEmail: null, assignedPurchaserName: null,
            purchase: null, receipt: null, assignments: [], maintenanceEvents: [], disposal: null,
            notes: [],
            history: [{ stage:'Requested', action:'created', actorEmail: currentUserEmail, actorName:(myStaffRecord()||{}).name||currentUserEmail, remark:'', timestamp:new Date().toISOString() }],
            createdAt: new Date().toISOString()
          };
          initApproval(record);
          newItemRecords.push(record);
        });
        newRequestRecords.push({ id: requestId, requestNumber, requestDate, requestedByEmail, createdAt: new Date().toISOString(), itemIds });
        createdNumbers.push(requestNumber);
      });
      DB.requestItems.push(...newItemRecords);
      DB.requests.push(...newRequestRecords);
      try{
        await saveDb();
      }catch(e){
        // Save failed — undo the in-memory push so a retry (or the next
        // unrelated save) doesn't silently create duplicate requests.
        newItemRecords.forEach(r=>{ const i=DB.requestItems.indexOf(r); if(i>-1) DB.requestItems.splice(i,1); });
        newRequestRecords.forEach(r=>{ const i=DB.requests.indexOf(r); if(i>-1) DB.requests.splice(i,1); });
        createdNumbers = [];
        throw e;
      }
    });
    if(!ok) return;
    newRequestLines = [];
    newReqExpandedId = null;
    newReqDraftBannerDismissed = false;
    try{ sessionStorage.removeItem(REQ_DRAFT_KEY); }catch(e){}
    const requestNumber = createdNumbers[0];
    if(createdNumbers.length > 1){ toast('Submitted as '+createdNumbers.length+' separate requests (mixed value tiers): '+createdNumbers.join(', '), 'success'); }
    else { toast('Purchase request '+requestNumber+' submitted', 'success'); }
    procTab = 'all';
    renderProcurementPage();
  });
}

/* ---------------- Approvals ---------------- */
function renderApprovalsTab(){
  const panel = document.getElementById('proc-panel');
  const items = myApprovalQueue();
  if(!items.length){ panel.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>Nothing awaiting your action</h3></div>'; return; }
  panel.innerHTML = '<div class="approval-card-grid">' + items.map(r=>renderApprovalCard(r)).join('') + '</div>';

  items.forEach(r=>{
    const card = panel.querySelector('[data-approval-card="'+r.id+'"]');
    const approveBtn = card.querySelector('[data-approve-one]');
    if(approveBtn) approveBtn.addEventListener('click', ()=>submitApprovalAction(r, 'approve', approveBtn));
    // Decline/Escalate share one reveal panel — a low-weight button until
    // clicked, then the card smoothly opens a mandatory-comment field.
    card.querySelectorAll('[data-action-toggle]').forEach(toggleBtn=>{
      toggleBtn.addEventListener('click', ()=>{
        const which = toggleBtn.getAttribute('data-action-toggle');
        card.querySelector('.approval-action-panel').setAttribute('data-pending-action', which);
        card.querySelector('.approval-action-panel-label').textContent = which==='escalate' ? 'Escalation reason (required)' : 'Decline reason (required)';
        card.querySelector('.approval-action-confirm').textContent = which==='escalate' ? 'Confirm Escalate' : 'Confirm Decline';
        card.querySelector('.approval-action-confirm').className = 'btn btn-sm approval-action-confirm ' + (which==='escalate' ? 'btn-primary' : 'btn-danger');
        card.classList.add('declining');
        setTimeout(()=>{ const t = document.getElementById('comment-'+r.id); if(t) t.focus(); }, 200);
      });
    });
    const cancelBtn = card.querySelector('[data-decline-cancel]');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
      card.classList.remove('declining');
      const t = document.getElementById('comment-'+r.id); if(t) t.value = '';
    });
    const confirmBtn = card.querySelector('.approval-action-confirm');
    if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
      const which = card.querySelector('.approval-action-panel').getAttribute('data-pending-action');
      submitApprovalAction(r, which, confirmBtn);
    });
  });
}
function renderApprovalCard(r){
  const siblingCount = requestItemSiblings(r).length;
  const canEscalate = r.approvalStatus === 'pending_coordinator' && hasRole('coordinator');
  // Decision-support info, sourced from the actual Inventory record this
  // item is tied to by catalog identity — not a text-name guess. For
  // assets, "stock" means spare/available quantity, never installed units,
  // so an approver isn't misled into thinking installed assets are up for grabs.
  const linkedInv = r.catalogItemId ? DB.inventoryItems.find(i=>!i.deleted && i.catalogItemId===r.catalogItemId) : null;
  const lastProcDate = linkedInv ? itemLastPurchaseDate(linkedInv.id) : null;
  const currentStock = linkedInv ? linkedInv.quantity : null;

  return '<div class="approval-card" data-approval-card="'+r.id+'">'
    + '<div class="approval-card-top"><span class="approval-card-name">'+escapeHtml(r.itemName)+'</span>'
    +   '<span class="approval-card-tags">'+valueClassBadge(r.valueClass)+priorityChip(r.priority)+'</span></div>'
    + '<div class="approval-card-rows">'
    +   '<div class="approval-card-row"><label>Request No:</label><span>'+escapeHtml(r.requestNumber)+'</span></div>'
    +   '<div class="approval-card-row"><label>Category:</label><span>'+escapeHtml(catName(r.categoryId))+'</span></div>'
    +   '<div class="approval-card-row"><label>Quantity:</label><span>'+r.quantityRequested+'</span></div>'
    +   '<div class="approval-card-row"><label>Requisitioner:</label><span>'+escapeHtml(r.requestedByName||r.requestedByEmail)+'</span></div>'
    +   '<div class="approval-card-row"><label>Last Procurement:</label><span>'+(lastProcDate?formatDateDMY(lastProcDate):'—')+'</span></div>'
    +   '<div class="approval-card-row"><label>Current Stock:</label><span>'+(currentStock!==null?currentStock+' '+escapeHtml(linkedInv.unit||''):'Nil')+'</span></div>'
    + '</div>'
    + (r.reason ? '<div class="approval-card-reason">'+escapeHtml(r.reason)+(r.description?': "'+escapeHtml(r.description)+'"':'')+'</div>' : '')

async function submitApprovalAction(r, action, btn){
  const commentEl = document.getElementById('comment-'+r.id);
  const comment = commentEl ? commentEl.value.trim() : '';
  if((action === 'decline' || action === 'escalate') && !comment){ toast('A comment is required for this action','error'); return; }
  const busyLabel = action==='approve' ? 'Approving…' : action==='decline' ? 'Declining…' : 'Escalating…';
  const ok = await runSaveAction(btn, busyLabel, async ()=>{
    await applyApprovalAction(r, action, comment);
  });
  if(!ok) return;
  toast(action==='approve'?'Approved':action==='decline'?'Declined':'Escalated to Principal', action==='decline'?'error':'success');
  if(action==='approve') flagTabAttention('tasks');
  renderProcurementPage();
}

async function buildPurchaseOrderPdf(po){
  await ensureJsPDFLoaded();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = margin;
  try { doc.addImage(LOGO_DATA_URI, 'PNG', margin, y, 90, 45); } catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Taqwa Islamic School', margin+100, y+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Purchase Order — '+po.poNumber, margin+100, y+36);
  y += 62;
  doc.setDrawColor(74,125,151); doc.setLineWidth(1.5);
  doc.line(margin, y, pageW-margin, y);
  y += 20;
  const section = (label, value)=>{ y = pdfField(doc, margin, y, pageW-margin*2, label, value); };
  section('PO Number:', po.poNumber);
  section('Date:', formatDateDMY(po.dateGenerated));
  section('Supplier:', po.supplier || '(to be filled at purchase)');
  section('Item:', po.itemName + (po.itemCode?' ('+po.itemCode+')':''));
  section('Quantity:', String(po.quantity));
  section('Unit Rate:', formatMoney(po.unitRate));
  section('Tax:', formatMoney(po.taxAmount));
  section('Total Amount:', formatMoney(po.totalAmount));
  section('Purchase Officer:', po.purchaseOfficerName || '—');
  section('Status:', po.status==='issued' ? 'Issued (purchase completed)' : 'Draft (awaiting purchase)');
  return doc;
}
async function openPurchaseOrderReportModal(po){
  if(!po){ toast('Purchase order not found','error'); return; }
  openModal('Purchase Order — '+po.poNumber,
    '<div id="pdf-report-status" class="field-hint">Generating…</div><div id="pdf-report-preview" style="margin-top:10px;"></div>',
    '<button class="btn btn-outline" id="pdf-report-close-btn">Close</button><button class="btn btn-primary" id="pdf-report-download-btn" disabled>Download</button>',
    'module-procurement'
  );

  if(modalEl) modalEl.style.maxWidth = '820px';
  document.getElementById('pdf-report-close-btn').addEventListener('click', closeModal);
  try{
    const doc = await buildPurchaseOrderPdf(po);

    const url = URL.createObjectURL(blob);
    document.getElementById('pdf-report-status').textContent = po.poNumber;
    document.getElementById('pdf-report-preview').innerHTML = '<iframe src="'+url+'" style="width:100%; height:60vh; border:1px solid var(--color-border); border-radius:6px;"></iframe>';

}

/* Small, reusable "here's roughly what will be uploaded" hint — shows
   original vs. compressed size as soon as a photo is picked, so the
   automatic compression never happens silently. */
function wirePhotoPreviewHint(inputId, hintId){
  const input = document.getElementById(inputId);
  const hint = document.getElementById(hintId);
  if(!input || !hint) return;
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    if(!file){ hint.textContent = ''; return; }
    hint.textContent = 'Compressing…';
    const compressed = await compressImageFile(file);
    hint.textContent = 'Will upload as ~'+Math.round(compressed.size/1024)+'KB (original '+Math.round(file.size/1024)+'KB)';
  });
}
/* Shows/hides a "Preview" button beside a file input as soon as a photo is
   selected, and opens it in the image lightbox on click — purely for
   viewing the not-yet-uploaded selection before submission. Does not touch
   compression or upload behaviour at all. */
function wirePhotoPreviewButton(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if(!input || !btn) return;
  let objectUrl = null;
  input.addEventListener('change', ()=>{
    const file = input.files && input.files[0];
    if(objectUrl){ URL.revokeObjectURL(objectUrl); objectUrl = null; }
    btn.style.display = file ? 'inline-block' : 'none';
  });
  btn.addEventListener('click', ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    openImageLightbox(objectUrl, file.name);
  });
}

function wireServiceAssetPicker(){
  const L = newServiceLines;
  if(!L || L.tiedTo!=='assets') return;
  document.querySelectorAll('[data-svc-asset-src]').forEach(btn=>{
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-svc-asset-src]').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      const src = this.getAttribute('data-svc-asset-src');
      document.getElementById('svcr-asset-installed').style.display = src==='installed' ? '' : 'none';
      document.getElementById('svcr-asset-spare').style.display = src==='spare' ? '' : 'none';
    });
  });
  const bSel = document.getElementById('svcr-asset-building');
  const rSel = document.getElementById('svcr-asset-room');
  function refreshRoomOptions(){
    if(!bSel) return;
    const rs = DB.rooms.filter(x=>x.buildingId===bSel.value);
    rSel.innerHTML = '<option value="">— All Rooms —</option>' + rs.map(r=>'<option value="'+r.id+'">'+escapeHtml(r.name)+'</option>').join('');
    refreshInstalledList();
  }
  function refreshInstalledList(){
    const listEl = document.getElementById('svcr-asset-installed-list');
    if(!bSel.value){ listEl.innerHTML = '<div class="field-hint">Choose a building to see installed assets.</div>'; return; }
    const rows = [];
    assetItems().forEach(item=>{
      activeInstallationsForItem(item).forEach(ins=>{
        if(ins.buildingId!==bSel.value) return;
        if(rSel.value && ins.roomId!==rSel.value) return;
        rows.push({ item, ins });
      });
    });
    if(!rows.length){ listEl.innerHTML = '<div class="field-hint">No installed assets found there.</div>'; return; }
    listEl.innerHTML = rows.map(({item,ins})=>{
      const key = item.id+'|'+ins.id;
      const checked = L.assetIds.includes(key);
      return '<label class="chk-row" style="margin-bottom:6px;"><input type="checkbox" data-svc-asset-check="'+key+'" '+(checked?'checked':'')+'> '+escapeHtml(item.name)+' ('+escapeHtml(item.itemCode||'—')+') — '+buildingName(ins.buildingId)+(ins.roomId?' → '+roomName(ins.roomId):'')+'</label>';
    }).join('<br>');
    listEl.querySelectorAll('[data-svc-asset-check]').forEach(chk=>{
      chk.addEventListener('change', function(){
        const key = this.getAttribute('data-svc-asset-check');
        if(this.checked){ if(!L.assetIds.includes(key)) L.assetIds.push(key); }
        else{ L.assetIds = L.assetIds.filter(k=>k!==key); }
      });
    });
  }
  if(bSel){ bSel.addEventListener('change', refreshRoomOptions); rSel.addEventListener('change', refreshInstalledList); }
  const spareListEl = document.getElementById('svcr-asset-spare-list');
  if(spareListEl){
    const spares = assetItems().filter(i=>Number(i.quantity)>0);
    spareListEl.innerHTML = spares.length ? spares.map(item=>{
      const key = item.id;
      const checked = L.assetIds.includes(key);
      return '<label class="chk-row" style="margin-bottom:6px;"><input type="checkbox" data-svc-asset-check-spare="'+key+'" '+(checked?'checked':'')+'> '+escapeHtml(item.name)+' ('+escapeHtml(item.itemCode||'—')+') — '+item.quantity+' spare</label>';
    }).join('<br>') : '<div class="field-hint">No spare assets right now.</div>';
    spareListEl.querySelectorAll('[data-svc-asset-check-spare]').forEach(chk=>{
      chk.addEventListener('change', function(){
        const key = this.getAttribute('data-svc-asset-check-spare');
        if(this.checked){ if(!L.assetIds.includes(key)) L.assetIds.push(key); }
        else{ L.assetIds = L.assetIds.filter(k=>k!==key); }
      });
    });
  }
}
/* An assetIds entry is either "itemId|installationId" (a specific installed
   instance, so the exact location travels with it) or bare "itemId" (a
   spare asset, no location to pin). Resolve both forms for display. */
function describeServiceAssetRef(ref){
  const [itemId, installationId] = ref.split('|');
  const item = DB.inventoryItems.find(i=>i.id===itemId);
  if(!item) return '—';
  if(installationId){
    const ins = (item.installations||[]).find(x=>x.id===installationId);
    return item.name + (ins ? ' — ' + buildingName(ins.buildingId)+(ins.roomId?' → '+roomName(ins.roomId):'') : '');
  }
  return item.name + ' (spare)';
}

/* ---------------- Service Approvals ---------------- */
function renderServiceApprovalsTab(){
  const panel = document.getElementById('svc-panel');
  const items = myServiceApprovalQueue();
  if(!items.length){ panel.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>Nothing awaiting your action</h3></div>'; return; }
  panel.innerHTML = '<div class="approval-card-grid">' + items.map(sr=>renderServiceApprovalCard(sr)).join('') + '</div>';
  items.forEach(sr=>{
    const card = panel.querySelector('[data-svc-approval-card="'+sr.id+'"]');
    const approveBtn = card.querySelector('[data-svc-approve-one]');
    if(approveBtn) approveBtn.addEventListener('click', ()=>submitServiceApprovalAction(sr, 'approve', approveBtn));
    const viewPhotoBtn = card.querySelector('[data-svc-view-photo]');
    if(viewPhotoBtn) viewPhotoBtn.addEventListener('click', ()=>openImageLightbox(driveDownloadUrl(sr.photoFileId), sr.photoFileName||'Request photo'));
    const canEscalate = sr.approvalStatus==='pending_coordinator' && hasRole('coordinator');
    card.querySelectorAll('[data-action-toggle]').forEach(toggleBtn=>{
      toggleBtn.addEventListener('click', ()=>{
        const which = toggleBtn.getAttribute('data-action-toggle');
        card.querySelector('.approval-action-panel').setAttribute('data-pending-action', which);
        card.querySelector('.approval-action-panel-label').textContent = which==='escalate' ? 'Escalation reason (required)' : 'Decline reason (required)';
        card.querySelector('.approval-action-confirm').textContent = which==='escalate' ? 'Confirm Escalate' : 'Confirm Decline';
        card.querySelector('.approval-action-confirm').className = 'btn btn-sm approval-action-confirm ' + (which==='escalate' ? 'btn-primary' : 'btn-danger');
        card.classList.add('declining');
        setTimeout(()=>{ const t = document.getElementById('svc-comment-'+sr.id); if(t) t.focus(); }, 200);
      });
    });
    const cancelBtn = card.querySelector('[data-decline-cancel]');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ card.classList.remove('declining'); const t = document.getElementById('svc-comment-'+sr.id); if(t) t.value=''; });
    const confirmBtn = card.querySelector('.approval-action-confirm');
    if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
      const which = card.querySelector('.approval-action-panel').getAttribute('data-pending-action');
      submitServiceApprovalAction(sr, which, confirmBtn);
    });
  });
}

    +   '<button class="btn btn-danger btn-sm" data-action-toggle="decline">Decline</button>'

async function submitServiceApprovalAction(sr, action, btn){
  const commentEl = document.getElementById('svc-comment-'+sr.id);
  const comment = commentEl ? commentEl.value.trim() : '';
  if((action==='decline'||action==='escalate') && !comment){ toast('A comment is required for this action','error'); return; }
  const busyLabel = action==='approve' ? 'Approving…' : action==='decline' ? 'Declining…' : 'Escalating…';
  const ok = await runSaveAction(btn, busyLabel, async ()=>{ await applyServiceApprovalAction(sr, action, comment); });
  if(!ok) return;
  toast(action==='approve'?'Approved':action==='decline'?'Declined':'Escalated to Principal', action==='decline'?'error':'success');
  if(action==='approve') flagTabAttention('svc_receipts');
  renderServiceProcurementPage();
}

function openServiceReceiptModal(serviceRequestId){

    +   '<div class="spec-item"><label>Requested By</label><div class="val">'+escapeHtml(sr.requestedByName)+'</div></div>'
    +   '<div class="spec-item"><label>Service tied to</label><div class="val">'+escapeHtml(tiedToLabel)+'</div></div>'
    +   '<div class="spec-item"><label>Category</label><div class="val">'+escapeHtml(svcCategoryName(sr.categoryId))+' / '+escapeHtml(svcSubcategoryName(sr.categoryId,sr.subcategoryId))+'</div></div>'
    +   '<div class="spec-item"><label>Priority</label><div class="val">'+escapeHtml(sr.priority)+'</div></div>'
    +   '<div class="spec-item"><label>Expected Completion</label><div class="val">'+(sr.expectedCompletionDate?formatDateDMY(sr.expectedCompletionDate):'—')+'</div></div>'
    +   '<div class="spec-item"><label>Current Status</label><div class="val">'+serviceStatusLabel(sr.status)+'</div></div>'
    + '</div>'
    + (sr.remarks ? '<div class="field-hint" style="margin-bottom:10px;"><strong>Requested:</strong> '+escapeHtml(sr.remarks)+'</div>' : '')
    + (sr.photoFileId ? '<div style="margin-bottom:14px;">'+renderPhotoThumbHtml(sr.photoFileId, 'Request photo')+'</div>' : '')
    + '<div class="plain-divider"></div>'
    + '<div class="field"><label>Checked By</label><select id="svcrc-checkedby">'+staffOptions+'</select></div>'
    + '<div class="field"><label>Date</label><input type="date" id="svcrc-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    + '<div class="field-row"><div class="field"><label>Service Charges (₹)</label><input type="number" id="svcrc-charges" value="'+(sr.serviceCharges||0)+'"></div>'
    +   '<div class="field"><label>Taxes (₹)</label><input type="number" id="svcrc-taxes" value="'+(sr.taxes||0)+'"></div></div>'
    + '<div class="field"><label>Total Amount (₹, auto)</label><input type="number" id="svcrc-total" value="'+(sr.totalAmount||0)+'" readonly></div>'
    + '<div class="field"><label>Service Status</label>'
    +   '<div class="radio-row"><label><input type="radio" name="svcrc-status" value="Satisfactory"> Satisfactory</label>'
    +     '<label><input type="radio" name="svcrc-status" value="Not Satisfactory"> Not Satisfactory</label>'
    +     '<label><input type="radio" name="svcrc-status" value="Under Observation"> Under Observation</label></div>'
    + '</div>'
    + '<div class="field"><label>Remarks (required) — what was actually found/done</label><textarea id="svcrc-remarks" rows="3" placeholder="e.g. \'Printer roller replaced and paper-feed mechanism cleaned.\'">'+escapeHtml(sr.receiptRemarks||'')+'</textarea></div>'
    + '<div class="field"><label>Photo (optional)</label><input type="file" id="svcrc-photo" accept="image/*"><div class="field-hint" id="svcrc-photo-hint"></div></div>';
  openModal('Confirm Service Receipt — '+escapeHtml(sr.serviceRequestNumber), body,
    '<button class="btn btn-outline" id="svcrc-close-plain-btn">Close</button>'
    + '<button class="btn btn-outline" id="svcrc-print-btn">Print</button>'
    + '<button class="btn btn-outline" id="svcrc-observation-btn">Mark for Observation</button>'
    + '<button class="btn btn-primary" id="svcrc-close-service-btn">Close Service</button>',
    'module-service-procurement', true);
  const svcrcPrintBtn = document.getElementById('svcrc-print-btn');
  if(svcrcPrintBtn) svcrcPrintBtn.addEventListener('click', ()=>openServiceRequestReportModal(sr));
  const mine = myStaffRecord();
  if(mine){ const sel=document.getElementById('svcrc-checkedby'); if([...sel.options].some(o=>o.value===mine.id)) sel.value = mine.id; }
  const chargesEl = document.getElementById('svcrc-charges'), taxEl = document.getElementById('svcrc-taxes'), totalEl = document.getElementById('svcrc-total');
  function recalc(){ totalEl.value = ((Number(chargesEl.value)||0)+(Number(taxEl.value)||0)).toFixed(2); }
  chargesEl.addEventListener('input', recalc); taxEl.addEventListener('input', recalc); recalc();
  document.getElementById('svcrc-close-plain-btn').addEventListener('click', closeModal);
  wirePhotoPreviewHint('svcrc-photo', 'svcrc-photo-hint');

  async function uploadReceiptPhotoIfAny(btn, busyLabel){
    const fileInput = document.getElementById('svcrc-photo');
    const file = fileInput.files && fileInput.files[0];
    if(!file) return { photoFileId: sr.receiptPhotoFileId||null, photoFileName: sr.receiptPhotoFileName||null, ok:true };
    btn.disabled = true; btn.textContent = 'Compressing photo…';
    const compressed = await compressImageFile(file);
    btn.textContent = 'Uploading photo…';
    try{
      const photoFileId = await driveUploadBinary(compressed, CONFIG.UPLOADS_FOLDER_ID);
      return { photoFileId, photoFileName: compressed.name, ok:true };
    }catch(e){
      toast('Photo upload failed: '+e.message, 'error');
      btn.disabled = false; btn.textContent = busyLabel;
      return { ok:false };
    }
  }
  function collectReceiptFields(){
    const staffRec = staffById(document.getElementById('svcrc-checkedby').value);
    const statusRadio = document.querySelector('input[name="svcrc-status"]:checked');
    return {
      checkedByEmail: staffRec ? staffRec.email : null, checkedByName: staffRec ? staffRec.name : null,
      serviceDate: document.getElementById('svcrc-date').value,
      serviceCharges: Number(chargesEl.value)||0, taxes: Number(taxEl.value)||0, totalAmount: Number(totalEl.value)||0,

    };

    if(!f.receiptRemarks){ toast('Remarks are required','error'); return; }
    const photoResult = await uploadReceiptPhotoIfAny(btn, 'Mark for Observation');
    if(!photoResult.ok) return;
    const actorName = (myStaffRecord()||{}).name || currentUserEmail;
    const ok = await runSaveAction(btn, 'Saving…', async ()=>{
      Object.assign(sr, f);
      sr.receiptPhotoFileId = photoResult.photoFileId; sr.receiptPhotoFileName = photoResult.photoFileName;
      sr.status = 'under_observation';
      sr.history.push({ stage:'Under Observation', action:'marked for observation', actorEmail:currentUserEmail, actorName, remark:f.receiptRemarks+' (Charges: ₹'+f.totalAmount+')', timestamp:new Date().toISOString() });
      await saveDb();
    });
    if(!ok) return;
    toast('Marked for observation — stays active in Service Details & Receipts','success');
    closeModal();
    flagTabAttention('svc_receipts');
    renderServiceProcurementPage();
  });
  document.getElementById('svcrc-close-service-btn').addEventListener('click', async function(){
    const btn = this;
    const f = collectReceiptFields();
    if(!f.serviceStatus || f.serviceStatus==='Under Observation'){ toast('Select Satisfactory or Not Satisfactory to use Close Service (use "Mark for Observation" for that status instead)','error'); return; }
    if(!f.checkedByEmail){ toast('Choose who checked this','error'); return; }
    if(!f.receiptRemarks){ toast('Remarks are required'+(f.serviceStatus==='Not Satisfactory'?' — explain why the service was not satisfactory':''),'error'); return; }
    const photoResult = await uploadReceiptPhotoIfAny(btn, 'Close Service');
    if(!photoResult.ok) return;
    const actorName = (myStaffRecord()||{}).name || currentUserEmail;
    const ok = await runSaveAction(btn, 'Saving…', async ()=>{
      Object.assign(sr, f);
      sr.receiptPhotoFileId = photoResult.photoFileId; sr.receiptPhotoFileName = photoResult.photoFileName;
      if(f.serviceStatus === 'Satisfactory'){
        sr.status = 'closed';
        sr.closedAt = new Date().toISOString();
        sr.history.push({ stage:'Closed', action:'closed (satisfactory)', actorEmail:currentUserEmail, actorName, remark:f.receiptRemarks+' (Charges: ₹'+f.totalAmount+')', timestamp:new Date().toISOString() });
      } else {
        // Not Satisfactory — recorded, but deliberately NOT closed: stays
        // active in Service Details & Receipts until it's actually resolved.
        sr.status = 'not_satisfactory';
        sr.history.push({ stage:'Service Checked', action:'recorded as not satisfactory', actorEmail:currentUserEmail, actorName, remark:f.receiptRemarks+' (Charges: ₹'+f.totalAmount+')', timestamp:new Date().toISOString() });
      }
      await saveDb();
    });
    if(!ok) return;
    toast(f.serviceStatus==='Satisfactory' ? 'Service closed' : 'Recorded as not satisfactory — remains active for follow-up', f.serviceStatus==='Satisfactory'?'success':'error');
    closeModal();
    renderServiceProcurementPage();
  });
}
function renderPhotoThumbHtml(fileId, label){

   an image, never for data entry. `url` can be a blob: URL (unsaved local
   file) or a Drive download URL (already-uploaded photo). */

}

/* Service history for a specific asset, used on the Inventory item detail
   page — matched by real asset identity (item.id inside assetIds refs),
   never by name, so two similarly-named assets never get mixed up. */
function serviceHistoryForAsset(item){
  return DB.serviceRequests.filter(sr=>!sr.deleted && sr.tiedTo==='assets' && (sr.assetIds||[]).some(ref=>ref.split('|')[0]===item.id))
    .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

/* ============================================================

   big item-detail view. Confirming receipt only answers "did the goods
   arrive and in what condition" — it does not decide what happens to the
   stock next (that's Item Issue / Return).
   ============================================================ */
function openConfirmReceiptModal(reqItemId){
  const r = DB.requestItems.find(x=>x.id===reqItemId);

  const staffOptions = DB.staff.filter(s=>!s.deleted && s.active!==false).map(s=>'<option value="'+s.id+'">'+escapeHtml(s.name)+'</option>').join('');
  const mine = myStaffRecord();
  const body = '<div class="field"><label>Received By</label><select id="cr-received-by">'+staffOptions+'</select></div>'
    + '<div class="field"><label>Date</label><input type="date" id="cr-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    + '<div class="field"><label>Condition</label>'
    +   '<div class="radio-row"><label><input type="radio" name="cr-condition" value="OK" checked> Item OK</label><label><input type="radio" name="cr-condition" value="Not OK"> Not OK</label></div>'
    + '</div>'
    + '<div class="field"><label id="cr-remarks-label">Remarks (optional)</label><textarea id="cr-remarks"></textarea></div>'
    + '<div class="field"><label>Photo (optional)</label><input type="file" id="cr-photo" accept="image/*"><div class="field-hint" id="cr-photo-hint"></div></div>';
  openModal(escapeHtml(r.itemName), body,
    '<button class="btn btn-outline" id="cr-close-btn">Close</button>'
    + '<button class="btn btn-outline" id="cr-print-btn">Print</button>'
    + '<button class="btn btn-primary" id="cr-confirm-btn">Confirm Receipt</button>',
    'module-procurement', true);
  const bySel = document.getElementById('cr-received-by');
  if(mine) bySel.value = mine.id;
  wirePhotoPreviewHint('cr-photo', 'cr-photo-hint');
  document.querySelectorAll('input[name="cr-condition"]').forEach(radio=>{
    radio.addEventListener('change', ()=>{
      const notOk = document.querySelector('input[name="cr-condition"]:checked').value === 'Not OK';
      document.getElementById('cr-remarks-label').textContent = 'Remarks ' + (notOk ? '(required)' : '(optional)');
    });
  });
  document.getElementById('cr-close-btn').addEventListener('click', closeModal);
  const linkedPo = poForRequestItem(r.id);
  document.getElementById('cr-print-btn').addEventListener('click', ()=>{ if(linkedPo) openPurchaseOrderReportModal(linkedPo); else toast('No Purchase Order to print yet','error'); });
  document.getElementById('cr-confirm-btn').addEventListener('click', async function(){
    const btn = this;
    const condition = document.querySelector('input[name="cr-condition"]:checked').value;
    const remarks = document.getElementById('cr-remarks').value.trim();
    if(condition==='Not OK' && !remarks){ toast('Remarks are required when condition is Not OK','error'); return; }
    const receivedDate = document.getElementById('cr-date').value;
    const staffRec = staffById(bySel.value);
    const receivedByName = staffRec ? staffRec.name : currentUserEmail;
    const receivedByEmail = staffRec ? staffRec.email : currentUserEmail;
    const pattern = itemPattern(r);
    const fileInput = document.getElementById('cr-photo');
    const file = fileInput.files && fileInput.files[0];
    let photoFileId = null, photoFileName = null;
    if(file){
      btn.disabled = true; btn.textContent = 'Compressing photo…';
      const compressed = await compressImageFile(file);
      btn.textContent = 'Uploading photo…';
      try{ photoFileId = await driveUploadBinary(compressed, CONFIG.UPLOADS_FOLDER_ID); photoFileName = compressed.name; }
      catch(e){ toast('Photo upload failed: '+e.message, 'error'); btn.disabled = false; btn.textContent = 'Confirm Receipt'; return; }
    }
    const ok = await runSaveAction(btn, 'Saving…', async ()=>{
      r.receipt = { receivedDate, receivedByEmail, receivedByName, condition, remarks, photoFileId, photoFileName, recordedAt: new Date().toISOString() };
      r.history.push({ stage:'Item Received', action:'received ('+condition+')', actorEmail: currentUserEmail, actorName: receivedByName, remark: remarks, timestamp:new Date().toISOString() });
      // Confirming receipt only records that stock arrived — it becomes
      // "available" inventory. What happens to it next is a separate
      // decision made in Item Issue / Return, never assumed here.
      if(pattern==='consumable') syncConsumableStock(r);
      else syncAssetToInventory(r, receivedByEmail, receivedByName);
      r.status = 'received';

/* ============================================================
   Item Issue / Return — the one-time triage decision for newly-received
   stock: installed, consumed, or kept as spare. Always reads/writes the
   linked inventory item's live quantity via the SAME pushLedgerEntry()
   used by Inventory Management → Stock Consumption, so there is exactly
   one source of truth for how much stock actually exists.
   ============================================================ */
function openItemIssueModal(reqItemId){
  const r = DB.requestItems.find(x=>x.id===reqItemId);
  if(!r){ toast('Item not found','error'); return; }
  const inv = linkedInventoryItem(r);
  const available = inv ? Number(inv.quantity)||0 : 0;
  if(available<=0){ toast('Nothing available to issue for this item','error'); return; }
  const pattern = itemPattern(r);
  const isAsset = pattern!=='consumable';
  const buildings = DB.buildings.filter(b=>!b.deleted).sort((a,b)=>a.sortOrder-b.sortOrder);
  const primaryLabel = isAsset ? 'Install' : 'Mark as Consumed';

  const body = '<div class="field-hint" style="margin-bottom:10px;">Available: <strong>'+available+'</strong></div>'
    + '<div class="field"><label>Action</label>'
    +   '<div class="radio-row"><label><input type="radio" name="ii-action" value="issue" checked> '+primaryLabel+'</label><label><input type="radio" name="ii-action" value="spare"> Spare Inventory</label></div>'
    + '</div>'
    + '<div class="field"><label>Quantity</label><input type="number" id="ii-qty" min="1" max="'+available+'" value="'+available+'"></div>'
    + '<div id="ii-issue-fields">'
    +   '<div class="field-row"><div class="field"><label>Building'+(isAsset?'':' (optional)')+'</label><select id="ii-building"><option value="">— Select —</option>'+buildings.map(b=>'<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('')+'</select></div>'
    +   '<div class="field"><label>Room (optional)</label><select id="ii-room"><option value="">— None —</option></select></div></div>'
    +   (isAsset ? '' : '<div class="field"><label>Purpose</label><select id="ii-purpose"><option value="">— Select a purpose —</option>'+REASON_OPTIONS.map(opt=>'<option value="'+opt+'">'+opt+'</option>').join('')+'</select></div>')
    + '</div>'
    + '<div class="field"><label>Remarks (optional)</label><textarea id="ii-remarks"></textarea></div>';

  openModal(escapeHtml(r.itemName), body,
    '<button class="btn btn-outline" id="ii-close-btn">Close</button><button class="btn btn-primary" id="ii-submit-btn">Save</button>',
    'module-procurement', true);
  const bSel = document.getElementById('ii-building');
  function refreshRooms(){ const rs = DB.rooms.filter(x=>x.buildingId===bSel.value); document.getElementById('ii-room').innerHTML = '<option value="">— None —</option>'+rs.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join(''); }
  bSel.addEventListener('change', refreshRooms); refreshRooms();
  document.querySelectorAll('input[name="ii-action"]').forEach(radio=>{
    radio.addEventListener('change', ()=>{
      const isSpare = document.querySelector('input[name="ii-action"]:checked').value === 'spare';
      document.getElementById('ii-issue-fields').style.display = isSpare ? 'none' : '';
    });
  });
  document.getElementById('ii-close-btn').addEventListener('click', closeModal);
  document.getElementById('ii-submit-btn').addEventListener('click', async function(){
    const btn = this;
    const action = document.querySelector('input[name="ii-action"]:checked').value;
    const qty = Number(document.getElementById('ii-qty').value)||0;
    // Re-check live availability at save time, not just the render-time cap
    // — the authoritative check happens here, not merely by disabling a field.
    const liveInv = linkedInventoryItem(r);
    const liveAvailable = liveInv ? Number(liveInv.quantity)||0 : 0;
    if(qty<=0 || qty>liveAvailable){ toast('Quantity must be between 1 and '+liveAvailable+' (currently available)','error'); return; }
    const buildingId = document.getElementById('ii-building') ? document.getElementById('ii-building').value : '';
    const roomId = document.getElementById('ii-room') ? document.getElementById('ii-room').value : '';
    const purposeSel = document.getElementById('ii-purpose');
    const purpose = purposeSel ? purposeSel.value : '';
    if(action==='issue' && isAsset && !buildingId){ toast('Choose a building for Install','error'); return; }
    if(action==='issue' && !isAsset && !purpose){ toast('Choose a purpose for Mark as Consumed','error'); return; }
    const remarks = document.getElementById('ii-remarks').value.trim();
    const actorName = (myStaffRecord()||{}).name || currentUserEmail;

    const ok = await runSaveAction(btn, 'Saving…', async ()=>{
      if(action==='issue'){
        if(isAsset){
          performAssetInstall(liveInv, qty, buildingId, roomId, remarks, r.requestNumber);
          r.assignments.push({ responsiblePersonEmail: currentUserEmail, responsiblePersonName: actorName, buildingId, roomId, categoryId:r.categoryId, quantity: qty, remarks, assignedAt:new Date().toISOString(), assignedByEmail:currentUserEmail });
          r.history.push({ stage:'Item Issue', action:'installed '+qty, actorEmail: currentUserEmail, actorName, remark:'Installed at '+buildingName(buildingId)+(roomId?' → '+roomName(roomId):''), timestamp:new Date().toISOString() });
        } else {
          const remark = 'Consumed'+(buildingId?' at '+buildingName(buildingId)+(roomId?' / '+roomName(roomId):''):'')+(purpose?' — '+purpose:'')+(remarks?' — '+remarks:'');
          const balance = pushLedgerEntry(liveInv.id, 'Issue', r.requestNumber, 0, qty, remark);
          liveInv.quantity = balance;
          liveInv.updatedAt = new Date().toISOString();
          itemHistoryPush(liveInv, 'Consumed', qty+' — '+remark);
          r.history.push({ stage:'Item Issue', action:'consumed '+qty, actorEmail: currentUserEmail, actorName, remark, timestamp:new Date().toISOString() });
        }
      } else {
        r.history.push({ stage:'Item Issue', action:'kept as spare inventory '+qty, actorEmail: currentUserEmail, actorName, remark: remarks, timestamp:new Date().toISOString() });
      }
      // The Item Issue decision is procurement's one-time triage — whatever
      // isn't installed/consumed right now simply remains as ordinary
      // available inventory stock, manageable from then on through
      // Inventory Management → Stock Consumption like any other item.
      r.status = 'completed';
      await saveDb();
    });
    if(!ok) return;
    toast('Recorded','success');
    closeModal();
    renderProcurementPage();
  });
}

/* ============================================================
   Procurement stepper — shows where a request currently stands.
   The full blow-by-blow (who approved/declined/escalated, with
   comments) lives in the Permanent Timeline below; this widget is
   just the at-a-glance status, built only from real state — never
   a fabricated "approved" step for a request that bypassed approval.
   ============================================================ */
function renderProcurementStepper(r){
  if(r.status==='rejected'){
    return '<div class="circ-status circ-status-declined">⊘ Declined</div>';
  }
  if(r.status==='pending_approval'){
    const withWhom = r.approvalStatus==='pending_principal' ? 'Principal' : 'Coordinator';
    return '<div class="circ-status circ-status-current">● Pending — currently with <strong>'+withWhom+'</strong></div>';
  }
  // Post-approval lifecycle: Purchase → Item Receipt → Item Issue → Closed.
  // "Assignment" is deliberately not a stage name here — Item Issue covers
  // install/consume/spare for both consumables and assets alike now.
  const pattern = itemPattern(r);
  const steps = [{ key:'purchase', label:'Purchase' }];
  if(pattern!=='service'){ steps.push({ key:'receive', label:'Item Receipt' }); steps.push({ key:'issue', label:'Item Issue' }); }
  steps.push({ key:'closed', label:'Closed' });
  let curIdx = 0;
  if(r.status==='purchase_pending') curIdx = 0;
  else if(r.status==='purchased') curIdx = 1;
  else if(r.status==='received') curIdx = 2;
  else if(r.status==='completed' || r.status==='archived') curIdx = steps.length;
  return '<div class="proc-stepper">' + steps.map((s,i)=>{
    const state = i<curIdx ? 'done' : (i===curIdx ? 'current' : 'todo');
    const icon = state==='done' ? '✓' : (state==='current' ? '●' : '○');
    return '<div class="proc-step '+state+'"><span class="proc-step-icon">'+icon+'</span><span class="proc-step-label">'+escapeHtml(s.label)+'</span></div>';
  }).join('<div class="proc-step-connector"></div>') + '</div>';
}
function renderItemDetailModalBody(r){

  let body =
    renderProcurementStepper(r)
    + '<div class="card-badge-row" style="margin-bottom:10px;">'+itemStatusBadge(r.status, itemPattern(r))+valueClassBadge(r.valueClass)+priorityBadge(r.priority)+'</div>'

  }
  if(r.receipt){
    body += '<div class="section-heading">Receipt</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Received Date</label><div class="val">'+formatDate(r.receipt.receivedDate)+'</div></div>'
      + '<div class="spec-item"><label>Received By</label><div class="val">'+escapeHtml(r.receipt.receivedByName||'—')+'</div></div>'

  }
  if(r.assignments && r.assignments.length){
    const cur = r.assignments[r.assignments.length-1];

      + '<div class="spec-item"><label>Responsible Person</label><div class="val">'+escapeHtml(cur.responsiblePersonName)+'</div></div>'

      + '</ul>';
  }
  if(r.disposal){
    body += '<div class="section-heading">Disposal Record</div><div class="spec-grid" style="margin-bottom:12px;">'
      + '<div class="spec-item"><label>Type</label><div class="val">'+escapeHtml(r.disposal.type)+'</div></div>'

      + '<div class="spec-item"><label>Reason</label><div class="val">'+escapeHtml(r.disposal.reason||'—')+'</div></div>'
      + '</div>'
      + (r.disposal.documentFileId ? '<div class="field-hint" style="margin-bottom:12px;">📎 <a href="'+driveDownloadUrl(r.disposal.documentFileId)+'" target="_blank" rel="noopener">'+escapeHtml(r.disposal.documentFileName||'View document')+'</a></div>' : '');
  }

  body += '<div class="plain-divider"></div><h3 style="margin-bottom:10px;">Permanent Timeline</h3><ul class="timeline">'
    + r.history.map(h=>'<li><div class="t-title">'+escapeHtml(h.stage)+' — '+escapeHtml(h.action)+'</div><div class="t-meta">'+escapeHtml(h.actorName||h.actorEmail||'—')+' · '+formatDateTime(h.timestamp)+'</div>'+(h.remark?'<div class="t-remark">'+escapeHtml(h.remark)+'</div>':'')+'</li>').join('')
    + '</ul>';

  if(r.deleted){
    body = '<div class="form-error">This request was deleted'+(r.deletedByEmail?' by '+escapeHtml(r.deletedByEmail):'')+(r.deletedAt?' on '+formatDateTime(r.deletedAt):'')+'. It has been archived, not erased, and can be restored from Archive.</div>' + body;
  }
  body += '<div id="item-action-box"></div>';

  // Print/PO options don't exist before a purchase is actually recorded —
  // enforced by real state (r.purchase), not just hidden in the UI, so
  // there's nothing to print prematurely for a still-pending request.
  // No Delete/Archive here by design — once a request is in the controlled
  // workflow, that's Admin-only from All Requests, never from an
  // operational screen.
  const linkedPo = poForRequestItem(r.id);
  const footerBtns = '<button class="btn btn-outline" id="modal-done-btn">Close</button>'
    + (r.purchase ? '<button class="btn btn-outline" id="modal-print-btn">Print / Export Report</button>' : '')
    + (r.purchase && linkedPo ? '<button class="btn btn-outline" id="modal-print-po-btn">Print PO ('+escapeHtml(linkedPo.poNumber)+')</button>' : '');
  openModal(escapeHtml(r.itemName), body, footerBtns, 'module-procurement', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  const printBtn = document.getElementById('modal-print-btn');
  if(printBtn) printBtn.addEventListener('click', ()=>openRequestItemReportModal(r));
  const poBtn = document.getElementById('modal-print-po-btn');
  if(poBtn) poBtn.addEventListener('click', ()=>openPurchaseOrderReportModal(linkedPo));
  if(!r.deleted) renderItemActionBox(r);
}

/* ============================================================
   Manage Item Catalog (Admin only) — locks item terminology
   ============================================================ */
function categoryCodePrefix(cat){
  const stop = ['and','of','the','for','&'];
  const words = (cat.name||'').replace(/[^a-zA-Z\s]/g,'').split(/\s+/).filter(w=>w && !stop.includes(w.toLowerCase()));
  let letters = words.map(w=>w[0]).join('').toUpperCase();
  if(letters.length < 3) letters = (words[0]||'ITM').slice(0,3).toUpperCase();
  return letters.slice(0,3);
}
function nextItemCode(categoryId){
  const cat = DB.categories.find(c=>c.id===categoryId);
  const prefix = cat ? categoryCodePrefix(cat) : 'ITM';
  const existing = DB.itemCatalog.filter(i=>i.categoryId===categoryId && i.code && i.code.startsWith(prefix+'-'));
  let maxNum = 0;
  existing.forEach(i=>{ const n = parseInt((i.code.split('-')[1]||'0'),10); if(n>maxNum) maxNum = n; });
  return prefix+'-'+String(maxNum+1).padStart(3,'0');
}

/* ============================================================
   Printable PDF documents — Taqwa letterhead, preview before download
   ============================================================ */
function ensureJsPDFLoaded(){
  return new Promise((resolve, reject)=>{
    if(window.jspdf && window.jspdf.jsPDF){ resolve(); return; }
    let settled = false;
    const succeed = ()=>{ if(!settled && window.jspdf && window.jspdf.jsPDF){ settled = true; resolve(); } };
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
    s.onload = succeed;
    s.onerror = ()=>{ if(!settled){ settled = true; reject(new Error('Could not load the PDF library. Check your internet connection and try again.')); } };
    document.head.appendChild(s);
    setTimeout(()=>{ if(!settled){ settled = true; reject(new Error('PDF library took too long to load. Try again.')); } }, 8000);
  });
}
function pdfFieldHeight(doc, maxWidth, value){
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const lines = doc.splitTextToSize(value||'—', maxWidth);
  return 13 + 12*lines.length + 8;
}
function pdfField(doc, x, y, maxWidth, label, value){
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text(label, x, y);
  y += 13;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const lines = doc.splitTextToSize(value||'—', maxWidth);
  doc.text(lines, x, y);
  return y + 12*lines.length + 8;
}
async function buildRequestItemReportPdf(r){
  await ensureJsPDFLoaded();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;

  const ensureSpace = (needed)=>{ if(y + needed > pageH - margin){ doc.addPage(); y = margin; } };
  const section = (label, value)=>{
    const maxWidth = pageW-margin*2;
    ensureSpace(pdfFieldHeight(doc, maxWidth, value));
    y = pdfField(doc, margin, y, maxWidth, label, value);
  };
  const heading = (text)=>{
    ensureSpace(24);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(text, margin, y);
    y += 16;
  };

  try { doc.addImage(LOGO_DATA_URI, 'PNG', margin, y, 90, 45); } catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Taqwa Islamic School', margin+100, y+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Purchase Request Report — '+r.requestNumber, margin+100, y+36);
  y += 62;
  doc.setDrawColor(74,125,151); doc.setLineWidth(1.5);
  doc.line(margin, y, pageW-margin, y);
  y += 20;

  section('Item:', r.itemName);
  section('Request Number:', r.requestNumber);
  section('Request Date:', formatDateDMY(r.requestDate));
  section('Requested By:', r.requestedByName || r.requestedByEmail);
  section('Category:', catName(r.categoryId));
  section('Item Type:', itemTypeName(r.itemTypeId));
  section('Quantity Requested:', String(r.quantityRequested));
  section('Priority:', r.priority);
  section('Value Classification:', valueClassLabel(r.valueClass));
  section('Procurement Policy:', r.procurementPolicy==='required'?'Requires Approval':'No Approval Required');
  section('Reason:', r.reason);
  if(r.description) section('Description:', r.description);
  section('Current Status:', itemStatusLabel(r.status));

  if(r.purchase){
    heading('Purchase Record');
    section('Supplier / Shop:', r.purchase.supplier);
    section('Invoice Number:', r.purchase.invoiceNumber);
    section('Purchase Date:', formatDateDMY(r.purchase.purchaseDate));
    section('Quantity Purchased:', String(r.purchase.quantityPurchased)+' (requested '+r.quantityRequested+')');
    section('Unit Price:', formatMoney(r.purchase.unitPrice));
    section('Total Amount:', formatMoney(r.purchase.totalAmount));
  }
  if(r.receipt){
    heading('Receipt');
    section('Received Date:', formatDateDMY(r.receipt.receivedDate));
    section('Received By:', r.receipt.receivedByName);
  }
  if(r.assignments && r.assignments.length){
    const cur = r.assignments[r.assignments.length-1];
    heading('Current Responsible Person');
    section('Responsible Person:', cur.responsiblePersonName);
    section('Location:', buildingName(cur.buildingId)+(cur.roomId?' / '+roomName(cur.roomId):''));
  }
  if(r.disposal){
    heading('Disposal Record');
    section('Type:', r.disposal.type);
    section('Date:', formatDateDMY(r.disposal.date));
    section('Approved By:', r.disposal.approvedByName);
    section('Reason:', r.disposal.reason);
  }

  heading('Permanent Timeline');
  r.history.forEach(h=>{
    section(h.stage+' — '+h.action+'  ('+(h.actorName||h.actorEmail||'—')+', '+formatDateDMY(h.timestamp)+')', h.remark||'');
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
    doc.text('Page '+p+' / '+totalPages, pageW-margin-60, pageH-20);
    doc.setTextColor(0,0,0);
  }
  return doc;
}
