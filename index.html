function renderConsumptionTab(){
  const panel = document.getElementById('inv-page-panel');
  // Consumables only — items whose catalog Item Type is Consumable. Assets
  // (even ones sitting spare with quantity > 0) never appear here; they
  // live under the Assets tab instead.
  const allItems = DB.inventoryItems.filter(i=>!i.deleted && itemPatternOf(i)==='consumable');
  const addBtnHtml = '<div style="display:flex; justify-content:flex-end; margin-bottom:10px;"><button class="btn btn-outline btn-sm" id="add-existing-consumable-btn">+ Add Existing Stock</button></div>';
  if(!allItems.length){ panel.innerHTML = addBtnHtml + '<div class="empty-state"><div class="icon">📉</div><h3>No consumable stock yet</h3></div>'; wireAddExistingStockBtn('consumable'); return; }
  const cats = DB.categories.filter(c=>!c.deleted);
  const items = allItems.filter(i=>!consumptionCategoryFilter || i.categoryId===consumptionCategoryFilter).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const filterHtml = '<div class="field" style="max-width:280px; margin-bottom:12px;"><label>Filter by Category</label>'
    + '<select id="consumption-cat-filter"><option value="">— All Categories —</option>'
    + cats.map(c=>'<option value="'+c.id+'" '+(consumptionCategoryFilter===c.id?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('')
    + '</select></div>';
  panel.innerHTML = addBtnHtml
    + '<div class="page-subtitle-inline">Record consumption directly against any consumable\'s stock, including where it actually went — independent of any specific purchase.</div>'
    + filterHtml
    + (items.length
      ? '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Current Stock</th><th></th></tr></thead><tbody>'
        + items.map(i=>{
            const zero = Number(i.quantity)<=0;
            return '<tr><td>'+escapeHtml(i.name)+'</td><td>'+escapeHtml(catName(i.categoryId))+'</td><td><strong>'+escapeHtml(i.quantity)+'</strong> '+escapeHtml(i.unit||'')+'</td><td><button class="btn btn-outline btn-sm" data-consume-item="'+i.id+'" '+(zero?'disabled title="No stock available to consume"':'')+'>Consume</button></td></tr>';
          }).join('')
        + '</tbody></table></div>'
      : '<div class="empty-state"><div class="icon">📉</div><h3>No items in this category</h3></div>');
  wireAddExistingStockBtn('consumable');
  document.getElementById('consumption-cat-filter').addEventListener('change', (e)=>{
    consumptionCategoryFilter = e.target.value;
    renderConsumptionTab();
  });
  panel.querySelectorAll('[data-consume-item]:not([disabled])').forEach(btn=>{
    btn.addEventListener('click', ()=>openConsumeModal(btn.getAttribute('data-consume-item')));
  });
}
function openConsumeModal(itemId){
  const item = DB.inventoryItems.find(x=>x.id===itemId);
  if(!item) return;
  const buildings = DB.buildings.filter(b=>!b.deleted).sort((a,b)=>a.sortOrder-b.sortOrder);
  const body = '<div class="field-hint" style="margin-bottom:10px;">Current stock: <strong>'+escapeHtml(item.quantity)+' '+escapeHtml(item.unit||'')+'</strong></div>'
    + '<div class="field"><label>Quantity Consumed</label><input type="number" id="consume-qty" min="1" max="'+item.quantity+'" value="1"></div>'
    + '<div class="field"><label>Date</label><input type="date" id="consume-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    + '<div class="field-row"><div class="field"><label>Building (where it went)</label><select id="consume-building"><option value="">— Not specified —</option>'+buildings.map(b=>'<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('')+'</select></div><div class="field"><label>Room (optional)</label><select id="consume-room"><option value="">— None —</option></select></div></div>'
    + '<div class="field"><label>Remarks / Purpose</label><textarea id="consume-remarks" placeholder="e.g. Used for Class 5 art project"></textarea></div>';
  openModal('Record Consumption — '+escapeHtml(item.name), body, '<button class="btn btn-outline" id="modal-done-btn">Cancel</button><button class="btn btn-primary" id="consume-submit-btn">Record</button>', 'module-inventory', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  const cbSel = document.getElementById('consume-building');
  function refreshConsumeRooms(){ const rs = DB.rooms.filter(x=>x.buildingId===cbSel.value); document.getElementById('consume-room').innerHTML = '<option value="">— None —</option>'+rs.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join(''); }
  cbSel.addEventListener('change', refreshConsumeRooms); refreshConsumeRooms();
  document.getElementById('consume-submit-btn').addEventListener('click', async function(){
    const btn = this;
    const qty = Number(document.getElementById('consume-qty').value)||0;
    const date = document.getElementById('consume-date').value;
    const buildingId = cbSel.value, roomId = document.getElementById('consume-room').value;
    const location = buildingId ? (buildingName(buildingId)+(roomId?' / '+roomName(roomId):'')) : '';
    const remark = document.getElementById('consume-remarks').value.trim();
    if(qty<=0){ toast('Enter a quantity greater than zero','error'); return; }
    if(qty > Number(item.quantity)){ toast('Cannot consume more than current stock','error'); return; }
    const fullRemark = (location ? '['+location+'] ' : '') + (remark || 'Stock consumption');
    const ok = await runSaveAction(btn, 'Recording…', async ()=>{
      const balance = pushLedgerEntry(item.id, 'Issue', '', 0, qty, fullRemark, date);
      item.quantity = balance; item.updatedAt = new Date().toISOString();
      itemHistoryPush(item, 'Consumed', qty+' consumed'+(location?' at '+location:'')+(remark?' — '+remark:''));
      await saveDb();
    });
    if(!ok) return;
    toast('Consumption recorded','success'); closeModal(); renderInventoryPage();
  });
}

// Item-linked Install — same fields/validation as the request-linked Install
// inside Item Issue / Return, just triggered from already-spare stock with
// no specific procurement request behind this particular action.
function openInstallAssetModalForItem(itemId){
  const item = DB.inventoryItems.find(i=>i.id===itemId);
  if(!item){ toast('Item not found','error'); return; }
  const available = Number(item.quantity)||0;
  if(available<=0){ toast('No spare stock available to install','error'); return; }
  const buildings = DB.buildings.filter(b=>!b.deleted).sort((a,b)=>a.sortOrder-b.sortOrder);
  const body = '<div class="field-hint" style="margin-bottom:10px;">Spare available: <strong>'+available+'</strong></div>'
    + '<div class="field"><label>Quantity</label><input type="number" id="ia-qty" min="1" max="'+available+'" value="'+available+'"></div>'
    + '<div class="field-row"><div class="field"><label>Building</label><select id="ia-building"><option value="">— Select —</option>'+buildings.map(b=>'<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('')+'</select></div>'
    + '<div class="field"><label>Room (optional)</label><select id="ia-room"><option value="">— None —</option></select></div></div>'
    + '<div class="field"><label>Remarks (optional)</label><textarea id="ia-remarks"></textarea></div>';
  openModal('Install Asset — '+escapeHtml(item.name), body,
    '<button class="btn btn-outline" id="modal-done-btn">Cancel</button><button class="btn btn-primary" id="ia-submit-btn">Install</button>', 'module-inventory', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  const bSel = document.getElementById('ia-building');
  function refreshRooms(){ const rs = DB.rooms.filter(x=>x.buildingId===bSel.value); document.getElementById('ia-room').innerHTML = '<option value="">— None —</option>'+rs.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join(''); }
  bSel.addEventListener('change', refreshRooms); refreshRooms();
  document.getElementById('ia-submit-btn').addEventListener('click', async function(){
    const btn = this;
    const qty = Number(document.getElementById('ia-qty').value)||0;
    const liveItem = DB.inventoryItems.find(i=>i.id===itemId);
    const liveAvailable = liveItem ? Number(liveItem.quantity)||0 : 0;
    if(qty<=0 || qty>liveAvailable){ toast('Quantity must be between 1 and '+liveAvailable+' (currently spare)','error'); return; }
    const buildingId = bSel.value;
    if(!buildingId){ toast('Choose a building','error'); return; }
    const roomId = document.getElementById('ia-room').value;
    const remarks = document.getElementById('ia-remarks').value.trim();
    const ok = await runSaveAction(btn, 'Installing…', async ()=>{
      performAssetInstall(liveItem, qty, buildingId, roomId, remarks, '');
      await saveDb();
    });
    if(!ok) return;
    toast('Asset installed','success'); closeModal(); renderInventoryPage();
  });
}
function openDisposeAssetModal(itemId){
  const item = DB.inventoryItems.find(i=>i.id===itemId);
  if(!item){ toast('Item not found','error'); return; }
  const active = activeInstallationsForItem(item);
  if(!active.length){ toast('Nothing currently installed to dispose','error'); return; }
  const staffOptions = DB.staff.filter(s=>!s.deleted && s.active!==false).map(s=>'<option value="'+s.id+'">'+escapeHtml(s.name)+'</option>').join('');
  const locationOptions = active.map(ins=>{
    const remaining = (Number(ins.qty)||0)-(Number(ins.disposedQty)||0);
    return '<option value="'+ins.id+'" data-remaining="'+remaining+'">'+escapeHtml(buildingName(ins.buildingId)+(ins.roomId?' → '+roomName(ins.roomId):''))+' ('+remaining+' remaining)</option>';
  }).join('');
  const mine = myStaffRecord();
  const body = '<div class="field"><label>Location</label><select id="da-location">'+locationOptions+'</select></div>'
    + '<div class="field"><label>Quantity</label><input type="number" id="da-qty" min="1" value="1"></div>'
    + '<div class="field"><label>Disposed Off By</label><select id="da-by">'+staffOptions+'</select></div>'
    + '<div class="field"><label>Date</label><input type="date" id="da-date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    + '<div class="field"><label>Reason</label><select id="da-reason"><option>Asset faulty</option><option>Asset poor performance</option><option>Technological upgrade</option><option>Other</option></select></div>'
    + '<div class="field" id="da-other-wrap" style="display:none;"><label>Reason (specify)</label><input type="text" id="da-other-text"></div>'
    + '<div class="field"><label>Remarks (optional)</label><textarea id="da-remarks"></textarea></div>';
  openModal('Dispose — '+escapeHtml(item.name), body,
    '<button class="btn btn-outline" id="modal-done-btn">Cancel</button><button class="btn btn-danger" id="da-submit-btn">Submit Disposal</button>', 'module-inventory', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  if(mine){ const byS=document.getElementById('da-by'); if([...byS.options].some(o=>o.value===mine.id)) byS.value=mine.id; }
  const locSel = document.getElementById('da-location');
  const qtyEl = document.getElementById('da-qty');
  function refreshQtyCap(){ const opt = locSel.selectedOptions[0]; const rem = opt?Number(opt.getAttribute('data-remaining'))||1:1; qtyEl.max = rem; qtyEl.value = Math.min(Number(qtyEl.value)||1, rem); }
  locSel.addEventListener('change', refreshQtyCap); refreshQtyCap();
  const reasonSel = document.getElementById('da-reason');
  reasonSel.addEventListener('change', ()=>{ document.getElementById('da-other-wrap').style.display = reasonSel.value==='Other' ? '' : 'none'; });
  document.getElementById('da-submit-btn').addEventListener('click', async function(){
    const btn = this;
    const installationId = locSel.value;
    const opt = locSel.selectedOptions[0];
    const remaining = opt ? Number(opt.getAttribute('data-remaining'))||0 : 0;
    const qty = Number(qtyEl.value)||0;
    if(qty<=0 || qty>remaining){ toast('Quantity must be between 1 and '+remaining+' at that location','error'); return; }
    const staffRec = staffById(document.getElementById('da-by').value);
    if(!staffRec){ toast('Choose who is disposing this','error'); return; }
    let reason = reasonSel.value;
    if(reason==='Other'){
      const otherText = document.getElementById('da-other-text').value.trim();
      if(!otherText){ toast('Specify the reason','error'); return; }
      reason = otherText;
    }
    const date = document.getElementById('da-date').value;
    const remarks = document.getElementById('da-remarks').value.trim();
    const ok = await runSaveAction(btn, 'Saving…', async ()=>{
      const liveItem = DB.inventoryItems.find(i=>i.id===itemId);
      performAssetDispose(liveItem, installationId, qty, staffRec.email, staffRec.name, date, reason, remarks);
      await saveDb();
    });
    if(!ok) return;
    toast('Disposed','success'); closeModal(); renderInventoryPage();
  });
}

      await pushAndSave(DB.serviceCategories, { id:nextId('svccat'), name, requiresApproval:true, subcategories:[] });
    });
    if(!ok) return;
    toast('Category added','success'); renderManageServiceCategoriesModalBody();
  });
  document.querySelectorAll('[data-rename-svccat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = DB.serviceCategories.find(x=>x.id===btn.getAttribute('data-rename-svccat'));
      const name = prompt('Rename category:', c.name); if(!name || !name.trim()) return;
      const ok = await runSaveAction(btn, '…', async ()=>{ c.name = name.trim(); await saveDb(); });
      if(!ok) return;
      toast('Renamed','success'); renderManageServiceCategoriesModalBody();
    });
  });
  document.querySelectorAll('[data-toggle-svccat-policy]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = DB.serviceCategories.find(x=>x.id===btn.getAttribute('data-toggle-svccat-policy'));
      const ok = await runSaveAction(btn, '…', async ()=>{ c.requiresApproval = !c.requiresApproval; await saveDb(); });
      if(!ok) return;
      toast('Updated','success'); renderManageServiceCategoriesModalBody();
    });
  });
  document.querySelectorAll('[data-del-svccat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = DB.serviceCategories.find(x=>x.id===btn.getAttribute('data-del-svccat'));
      if(!promptAndArchive('serviceCategory', c, c.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{ await saveDb(); });
      if(!ok) return;
      toast('Category deleted','success'); renderManageServiceCategoriesModalBody();
    });
  });
  document.querySelectorAll('[data-add-svcsub]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const catId = btn.getAttribute('data-add-svcsub');
      const input = document.querySelector('[data-newsub-name="'+catId+'"]');
      const name = input.value.trim(); if(!name) return;
      const c = DB.serviceCategories.find(x=>x.id===catId);
      if((c.subcategories||[]).some(s=>!s.deleted && s.name.toLowerCase()===name.toLowerCase())){ toast('That sub-category already exists','error'); return; }
      const ok = await runSaveAction(btn, '…', async ()=>{
        if(!Array.isArray(c.subcategories)) c.subcategories = [];
        c.subcategories.push({ id:nextId('svcsub'), name });
        await saveDb();
      });
      if(!ok) return;
      toast('Sub-category added','success'); renderManageServiceCategoriesModalBody();
    });
  });
  document.querySelectorAll('[data-del-svcsub]').forEach(a=>{
    a.addEventListener('click', async ()=>{
      const [catId, subId] = a.getAttribute('data-del-svcsub').split('|');
      const c = DB.serviceCategories.find(x=>x.id===catId);
      const sub = (c.subcategories||[]).find(s=>s.id===subId);
      if(!confirm('Remove sub-category "'+sub.name+'"?')) return;
      const ok = await runSaveAction(a, '…', async ()=>{ sub.deleted = true; await saveDb(); });
      if(!ok) return;
      toast('Removed','success'); renderManageServiceCategoriesModalBody();
    });
  });
}

          +   '<select data-item-valueclass="'+i.id+'" title="Value Classification">'+valueClassOptions.replace('value="'+i.valueClass+'"','value="'+i.valueClass+'" selected')+'</select>'
          +   '<button class="policy-toggle '+(i.procurementPolicy==='required'?'on':'off')+'" data-item-policy-toggle="'+i.id+'" title="Toggle whether this item requires approval">'
          +     (i.procurementPolicy==='required' ? 'Requires Approval' : 'No Approval Required')
          +   '</button>'
          + '</div>'

      + '</div>'
      + '<div style="margin-top:8px; display:flex; gap:6px;"><input type="text" placeholder="New item name" data-newitem-name="'+c.id+'" style="flex:1; padding:6px 9px; border:1.5px solid var(--color-border); border-radius:7px; font-size:12.5px;"><button class="btn btn-outline btn-sm" data-add-item="'+c.id+'">+ Add</button></div>'
      + '</div>';

        + '<div class="field-hint" style="margin-bottom:8px; color:var(--color-danger);">One-time cleanup: permanently remove everything above and replace it with the standard 9-category structure. This cannot be undone — old categories/items will not appear in Archive.</div>'
        + '<button class="btn btn-outline btn-sm" id="reset-cats-btn" style="border-color:var(--color-danger); color:var(--color-danger);">Permanently Remove Old Categories &amp; Reset</button>') : '');

  openModal('Manage Categories &amp; Items', body, '<button class="btn btn-outline" id="modal-done-btn">Done</button>', 'module-inventory', true);
  document.getElementById('modal-done-btn').addEventListener('click', closeModal);
  const resetBtn = document.getElementById('reset-cats-btn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(!confirm('This will PERMANENTLY delete all current categories and catalog items — not archived, not recoverable — then replace them with the standard 9-category structure. Existing inventory items/requests keep their old category name as plain text for history, but the category record itself will be gone. Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    const ok = await runSaveAction(resetBtn, 'Resetting…', async ()=>{
      DB.categories = [];
      DB.itemCatalog = [];
      const seedCats = seedCategories();
      const catIdMap = {};
      const newCats = seedCats.map(c=>{ const newId = nextId('cat'); catIdMap[c.id] = newId; return Object.assign({}, c, { id:newId }); });
      const newItems = seedItemCatalog().map(i=> Object.assign({}, i, { id: nextId('ic'), categoryId: catIdMap[i.categoryId] }));
      DB.categories.push(...newCats);
      DB.itemCatalog.push(...newItems);
      await saveDb();
    });
    if(!ok) return;
    toast('Old categories permanently removed, reset to new structure','success'); renderManageDeptsModalBody(); renderRoute();
  });
  document.getElementById('add-cat-btn').addEventListener('click', async function(){
    const btn = this;
    const input = document.getElementById('new-cat-name');
    const name = input.value.trim();
    if(!name) return;
    const ok = await runSaveAction(btn, 'Adding…', async ()=>{
      await pushAndSave(DB.categories, { id:nextId('cat'), name, itemTypeId:'type_consumable', procurementPolicy:'required', valueClass:'low' });
    });
    if(!ok) return;
    toast('Category added','success'); renderManageDeptsModalBody(); renderRoute();

      const name = input.value.trim();
      if(!name) return;
      // Checked globally across ALL categories, not just this one — the
      // same item existing under two categories (e.g. Fevicol in both Art
      // & Craft and Stationery) is exactly the duplicate this must catch.
      // Exact name match only (case-insensitive); anything short of that
      // is left alone rather than guessing at "close enough" duplicates.
      const dupe = DB.itemCatalog.find(i=>!i.deleted && (i.name||'').trim().toLowerCase()===name.toLowerCase());
      if(dupe){
        const dupeCat = DB.categories.find(c=>c.id===dupe.categoryId);
        toast('"'+name+'" already exists as '+dupe.code+' under '+(dupeCat?dupeCat.name:'another category')+' — items can\'t be duplicated across categories','error');
        return;
      }
      const ok = await runSaveAction(btn, 'Adding…', async ()=>{

          id:nextId('ic'), categoryId, code: nextItemCode(categoryId), name, description:'',
          itemTypeId: cat ? cat.itemTypeId : 'type_consumable',
          procurementPolicy: cat ? cat.procurementPolicy : 'required',
          valueClass: cat ? cat.valueClass : 'low'
        });
      });
      if(!ok) return;
      toast('Item added','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
  document.querySelectorAll('[data-item-type]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const i = DB.itemCatalog.find(x=>x.id===sel.getAttribute('data-item-type'));

      const ok = await runSaveAction(sel, '…', async ()=>{ i.itemTypeId = sel.value; await saveDb(); });
      if(ok) toast('Item Type updated','success');
    });
  });
  document.querySelectorAll('[data-item-valueclass]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const i = DB.itemCatalog.find(x=>x.id===sel.getAttribute('data-item-valueclass'));
      if(!i) return;
      const ok = await runSaveAction(sel, '…', async ()=>{ i.valueClass = sel.value; await saveDb(); });
      if(ok) toast('Value Classification updated','success');
    });
  });
  document.querySelectorAll('[data-item-policy-toggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = DB.itemCatalog.find(x=>x.id===btn.getAttribute('data-item-policy-toggle'));
      if(!i) return;
      const ok = await runSaveAction(btn, '…', async ()=>{
        i.procurementPolicy = i.procurementPolicy==='required' ? 'not_required' : 'required';
        await saveDb();
      });
      if(!ok) return;
      toast('Procurement Policy updated','success'); renderManageDeptsModalBody();
    });
  });
  document.querySelectorAll('[data-rename-cat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-rename-cat');
      const c = DB.categories.find(x=>x.id===id);
      const name = prompt('Rename category:', c.name);
      if(!name || !name.trim()) return;
      const ok = await runSaveAction(btn, '…', async ()=>{ c.name = name.trim(); await saveDb(); });
      if(!ok) return;
      toast('Renamed','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
  document.querySelectorAll('[data-del-cat]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-cat');
      const c = DB.categories.find(x=>x.id===id);
      if(!promptAndArchive('category', c, c.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{
        DB.itemCatalog.filter(i=>i.categoryId===id && !i.deleted).forEach(i=>archiveRecord('itemCatalog', i, i.name, 'Parent category deleted'));
        await saveDb();
      });
      if(!ok) return;
      toast('Category deleted (archived)','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
  document.querySelectorAll('[data-del-item]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del-item');
      const i = DB.itemCatalog.find(x=>x.id===id);
      if(!promptAndArchive('itemCatalog', i, i.code+' '+i.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{ await saveDb(); });
      if(!ok) return;
      toast('Item deleted (archived)','success'); renderManageDeptsModalBody(); renderRoute();
    });
  });
}

/* ============================================================
   Inventory — category detail (flat, no department layer)
   ============================================================ */
function renderCategoryPage(catId){
  const app = document.getElementById('app');
  const cat = DB.categories.find(c=>c.id===catId);
  if(!cat){ app.innerHTML = '<div class="content wrap"><div class="empty-state"><h3>Category not found</h3></div></div>'; return; }
  const style = categoryStyle(catId);

  app.innerHTML =
    '<div class="content wrap module-inventory" style="'+categoryScopeStyle(catId)+'">'
    + '<div class="breadcrumb"><a href="#/inventory">Inventory</a> / '+escapeHtml(cat.name)+'</div>'
    + '<div class="page-title"><h2><span class="page-title-icon" style="background:'+style.soft+'; color:'+style.accent+';">'+style.icon(16, style.accent)+'</span>'+escapeHtml(cat.name)+'</h2>'
    + (isAdmin() ? '<button class="btn btn-primary btn-sm" id="add-item-btn">+ Add Item</button>' : '')
    + '</div>'
    + '<div class="tab-panel" id="cat-panel"></div>'
    + '</div>';

  renderItemsTable(catId);
  const addBtn = document.getElementById('add-item-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>openItemModal(catId, null));
}
function renderItemsTable(catId){
  const panel = document.getElementById('cat-panel');
  const items = DB.inventoryItems.filter(i=>i.categoryId===catId && !i.deleted).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!items.length){
    panel.innerHTML = '<div class="empty-state"><div class="icon">📦</div><h3>No items in this category yet</h3><p>'+(isAdmin()?'Use \u201c+ Add Item\u201d above to add the first one.':'Check back later.')+'</p></div>';
    return;
  }
  panel.innerHTML = '<div class="table-wrap"><table><thead><tr>'
    + '<th>Item</th><th>Qty</th><th>Unit</th><th>Cost/Value</th><th>Purchase Date</th><th>Status</th><th>Location</th><th>Remarks</th>'
    + (isAdmin() ? '<th></th>' : '')
    + '</tr></thead><tbody>'
    + items.map(i=>{
        const low = Number(i.reorderThreshold)>0 && Number(i.quantity) <= Number(i.reorderThreshold);
        // Location is derived live from the item's own installation records
        // — never hardcoded — so it only ever shows what actually happened.
        // A single active location shows directly; more than one (installed
        // across several rooms over time) is summarized rather than picking
        // one arbitrarily — full breakdown lives on the item detail page.
        const activeInst = activeInstallationsForItem(i);
        const installedTotal = installedQtyForItem(i);
        const statusLabel = (i.status==='Assets Installed' && installedTotal>0)
          ? 'Assets Installed: '+installedTotal
          : (i.status||'—');
        const locationLabel = activeInst.length===0 ? '—'
          : activeInst.length===1 ? (buildingName(activeInst[0].buildingId)+(activeInst[0].roomId?' → '+roomName(activeInst[0].roomId):''))
          : activeInst.length+' locations';
        return '<tr class="row-clickable" data-open-item="'+i.id+'">'
          + '<td>'+escapeHtml(i.name)+(low?' <span class="badge badge-high">low</span>':'')+'</td>'
          + '<td>'+escapeHtml(i.quantity)+'</td>'
          + '<td>'+escapeHtml(i.unit||'—')+'</td>'
          + '<td>'+formatMoney(i.cost)+'</td>'
          + '<td>'+formatDate(i.purchaseDate)+'</td>'
          + '<td>'+escapeHtml(statusLabel)+'</td>'
          + '<td>'+escapeHtml(locationLabel)+'</td>'
          + '<td>'+escapeHtml(i.remarks||'—')+'</td>'
          + (isAdmin() ? '<td style="white-space:nowrap;"><button class="btn btn-outline btn-sm" data-edit-item="'+i.id+'">Edit</button> <button class="btn btn-danger btn-sm" data-del-item="'+i.id+'">Delete</button></td>' : '')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
  panel.querySelectorAll('[data-open-item]').forEach(row=>{
    row.addEventListener('click', ()=>{ location.hash = '#/inventory/item/'+row.getAttribute('data-open-item'); });
  });
  panel.querySelectorAll('[data-edit-item]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const item = DB.inventoryItems.find(x=>x.id===btn.getAttribute('data-edit-item'));
      openItemModal(catId, item);
    });
  });
  panel.querySelectorAll('[data-del-item]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const it = DB.inventoryItems.find(x=>x.id===btn.getAttribute('data-del-item'));
      if(!promptAndArchive('inventoryItem', it, it.name)) return;
      const ok = await runSaveAction(btn, 'Deleting…', async ()=>{ await saveDb(); });
      if(!ok) return;
      toast('Item deleted (archived)','success'); renderCategoryPage(catId);
    });
  });
}
/* ============================================================
   Item Details Page — the hub: ledger, history, requests, docs
   ============================================================ */
function pendingRequestsForItem(item){
  return DB.requestItems.filter(r=> !r.deleted && r.categoryId===item.categoryId && (r.itemName||'').toLowerCase()===(item.name||'').toLowerCase() && !['completed','archived','rejected'].includes(r.status));
}
function renderPurchaseHistoryHtml(item){
  // Filtered by actual item identity (catalogItemId), not name text-matching
  // — two differently-catalogued items that happen to share a name never
  // get mixed into the same history.
  if(!item.catalogItemId) return '<div class="empty-state" style="padding:20px;"><div class="icon">🧾</div><h3>No linked catalog item, so no purchase history to show</h3></div>';
  const records = DB.requestItems.filter(r=>!r.deleted && r.catalogItemId===item.catalogItemId && r.purchase)
    .sort((a,b)=>(b.purchase.purchaseDate||'').localeCompare(a.purchase.purchaseDate||''));
  if(!records.length) return '<div class="empty-state" style="padding:20px;"><div class="icon">🧾</div><h3>No recorded purchases yet</h3></div>';
  return '<div class="install-card-grid">' + records.map(r=>{
    const po = poForRequestItem(r.id);
    return '<div class="install-card row-clickable" data-open-purchase="'+r.id+'">'
      + (po ? '<div class="install-card-qty">'+escapeHtml(po.poNumber)+'</div>' : '')
      + '<div class="install-card-row"><label>Request:</label><span>'+escapeHtml(r.requestNumber)+'</span></div>'
      + '<div class="install-card-row"><label>Date:</label><span>'+formatDateDMY(r.purchase.purchaseDate)+' · Qty '+r.purchase.quantityPurchased+'</span></div>'
      + '<div class="install-card-row"><label>Price:</label><span>'+formatMoney(r.purchase.unitPrice)+'/unit · '+formatMoney(r.purchase.totalAmount)+' total</span></div>'
      + (r.purchase.supplier ? '<div class="install-card-row"><label>Supplier:</label><span>'+escapeHtml(r.purchase.supplier)+'</span></div>' : '')
      + '<div class="install-card-row"><label>Status:</label><span>'+itemStatusLabel(r.status)+'</span></div>'
      + '</div>';
  }).join('') + '</div>';
}

    +   '<div class="spec-item"><label>Current Stock</label><div class="val">'+escapeHtml(item.quantity)+' '+escapeHtml(item.unit||'')+'</div></div>'
    +   '<div class="spec-item"><label>Minimum Stock</label><div class="val">'+escapeHtml(item.minStock||0)+'</div></div>'
    +   '<div class="spec-item"><label>Reorder Level</label><div class="val">'+escapeHtml(item.reorderThreshold||0)+'</div></div>'
    +   '<div class="spec-item"><label>Average Purchase Cost</label><div class="val">'+formatMoney(avgCost)+'</div></div>'
    +   '<div class="spec-item"><label>Last Purchase Date</label><div class="val">'+formatDate(lastPurchase)+'</div></div>'
    +   '<div class="spec-item"><label>Preferred Supplier</label><div class="val">'+escapeHtml(item.preferredSupplier||'—')+'</div></div>'
    +   '<div class="spec-item"><label>Status</label><div class="val">'+escapeHtml((item.status==='Assets Installed' && installedQtyForItem(item)>0) ? 'Assets Installed: '+installedQtyForItem(item) : (item.status||'—'))+'</div></div>'
    + '</div>'
    + (item.remarks ? '<div class="field"><label>Remarks</label><div class="val">'+escapeHtml(item.remarks)+'</div></div>' : '')

    + '<div id="item-photo-box" style="margin-bottom:8px;">'+renderItemPhotoHtml(item)+'</div>'
    + (isAdmin() ? '<div class="field-row"><div class="field"><input type="file" id="item-photo-input" accept="image/*"></div><div class="field"><button class="btn btn-outline btn-sm" id="item-photo-upload-btn">Upload Photo</button></div></div>' : '')

    + renderDisposalHistoryHtml(item)

    + renderLedgerTableHtml(ledger)
    + (isAdmin() ? renderAdjustmentFormHtml() : '')

    + '<div class="section-heading">Pending Purchase Requests</div>'
    + (pending.length ? '<div class="table-wrap"><table><thead><tr><th>Request</th><th>Qty</th><th>Status</th></tr></thead><tbody>'
        + pending.map(r=>'<tr class="row-clickable" data-open-req="'+r.id+'"><td>'+escapeHtml(r.requestNumber)+'</td><td>'+r.quantityRequested+'</td><td>'+itemStatusBadge(r.status, itemPattern(r))+'</td></tr>').join('')

    + '</ul>'

  document.querySelectorAll('[data-open-req]').forEach(row=>{

    try{
      const fileId = await driveUploadBinary(file, CONFIG.UPLOADS_FOLDER_ID);
      item.photoFileId = fileId; item.photoFileName = file.name;
      itemHistoryPush(item, 'Photo updated', file.name);
      await saveDb(); toast('Photo uploaded','success'); renderInventoryItemDetailPage(item.id);

/* Per-location cards — an asset can be installed across several locations
   over time (2 here, 1 there), each install its own immutable event.
   Fully-disposed installs still show, muted, so the history stays complete. */
function renderInstallationHistoryHtml(item){
  if(itemPatternOf(item)!=='asset') return '';
  const list = item.installations||[];
  if(!list.length) return '';
  return '<div class="section-heading">Installation History</div>'
    + '<div class="install-card-grid">'
    + list.slice().reverse().map(ins=>{
        const remaining = (Number(ins.qty)||0)-(Number(ins.disposedQty)||0);
        const fullyDisposed = remaining<=0;
        return '<div class="install-card'+(fullyDisposed?' fully-disposed':'')+'">'
          + '<div class="install-card-qty">Qty: '+(fullyDisposed?ins.qty+' <span class="badge badge-rejected">Fully Disposed</span>':remaining)+'</div>'
          + '<div class="install-card-row"><label>Location:</label><span>'+escapeHtml(buildingName(ins.buildingId)+(ins.roomId?' → '+roomName(ins.roomId):''))+'</span></div>'
          + '<div class="install-card-row"><label>Installed:</label><span>'+formatDateDMY(ins.installedDate)+' by '+escapeHtml(ins.installedByName||'—')+'</span></div>'
          + (ins.requestNumber ? '<div class="install-card-row"><label>Request:</label><span>'+escapeHtml(ins.requestNumber)+'</span></div>' : '')
          + (ins.remarks ? '<div class="install-card-row"><label>Remarks:</label><span>'+escapeHtml(ins.remarks)+'</span></div>' : '')
          + '</div>';
      }).join('')
    + '</div>';
}
function renderDisposalHistoryHtml(item){
  if(itemPatternOf(item)!=='asset') return '';
  const list = item.disposals||[];
  if(!list.length) return '';
  return '<div class="section-heading">Disposal History</div>'
    + '<div class="install-card-grid">'
    + list.slice().reverse().map(d=>{
        return '<div class="install-card fully-disposed">'
          + '<div class="install-card-qty">Qty: '+d.qty+'</div>'
          + '<div class="install-card-row"><label>From:</label><span>'+escapeHtml(buildingName(d.buildingId)+(d.roomId?' → '+roomName(d.roomId):''))+'</span></div>'
          + '<div class="install-card-row"><label>Disposed:</label><span>'+formatDateDMY(d.date)+' by '+escapeHtml(d.disposedByName||'—')+'</span></div>'
          + '<div class="install-card-row"><label>Reason:</label><span>'+escapeHtml(d.reason)+'</span></div>'

function renderItemPhotoHtml(item){
  if(!item.photoFileId) return '<div class="field-hint">No photo uploaded yet.</div>';
  return '<img src="'+driveDownloadUrl(item.photoFileId)+'" alt="'+escapeHtml(item.name)+'" style="max-width:220px; border-radius:8px; border:1px solid var(--color-border);">';

function renderLedgerTableHtml(ledger){
  if(!ledger.length) return '<div class="empty-state" style="padding:20px;"><div class="icon">📒</div><h3>No stock movements recorded yet</h3></div>';
  return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>In</th><th>Out</th><th>Balance</th><th>By</th></tr></thead><tbody>'
    + ledger.slice().reverse().map(e=>'<tr><td>'+formatDate(e.date)+'</td><td>'+escapeHtml(e.type)+'</td><td>'+escapeHtml(e.referenceNumber||'—')+'</td><td>'+(e.quantityIn>0?'+'+e.quantityIn:'—')+'</td><td>'+(e.quantityOut>0?'-'+e.quantityOut:'—')+'</td><td><strong>'+e.runningBalance+'</strong></td><td>'+escapeHtml(e.performedByName||'—')+'</td></tr>').join('')
    + '</tbody></table></div>';

function renderAdjustmentFormHtml(){
  return '<div style="margin-top:10px; border:1px solid var(--color-border); border-radius:10px; padding:12px; background:var(--color-surface-2);">'
    + '<div class="field-row">'
    +   '<div class="field"><label>Adjustment Type</label><select id="adj-type"><option>Adjustment</option><option>Return</option></select></div>'
    +   '<div class="field"><label>Quantity (+/-)</label><input type="number" id="adj-qty" placeholder="e.g. 5 or -3"></div>'
    + '</div>'
    + '<div class="field"><label>Reason</label><input type="text" id="adj-reason" placeholder="Why is this adjustment needed?"></div>'
    + '<button class="btn btn-outline btn-sm" id="adj-submit-btn">Record Adjustment</button>'
    + '</div>';
}
function wireAdjustmentForm(item){
  const btn = document.getElementById('adj-submit-btn');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const type = document.getElementById('adj-type').value;
    const delta = Number(document.getElementById('adj-qty').value)||0;
    const reason = document.getElementById('adj-reason').value.trim();
    if(!delta){ toast('Enter a non-zero quantity','error'); return; }
    if(!reason){ toast('A reason is required for stock adjustments','error'); return; }
    const ok = await runSaveAction(btn, 'Recording…', async ()=>{
      const qtyIn = delta>0 ? delta : 0, qtyOut = delta<0 ? Math.abs(delta) : 0;
      const balance = pushLedgerEntry(item.id, type, '', qtyIn, qtyOut, reason);
      item.quantity = balance; item.updatedAt = new Date().toISOString();
      itemHistoryPush(item, type, (delta>0?'+':'')+delta+' — '+reason);
      await saveDb();
    });
    if(!ok) return;
    toast('Adjustment recorded','success'); renderInventoryItemDetailPage(item.id);
  });
}
function renderItemAttachmentsHtml(item, linkedRequest){
  const rows = [];
  if(item.photoFileId) rows.push({ name: item.photoFileName||'Item photo', fileId: item.photoFileId, kind:'Photo' });
  if(linkedRequest && linkedRequest.purchase && linkedRequest.purchase.billFileId) rows.push({ name: linkedRequest.purchase.billFileName||'Bill', fileId: linkedRequest.purchase.billFileId, kind:'Bill / Invoice' });
  if(linkedRequest && linkedRequest.disposal && linkedRequest.disposal.documentFileId) rows.push({ name: linkedRequest.disposal.documentFileName||'Disposal document', fileId: linkedRequest.disposal.documentFileId, kind:'Disposal Document' });
  if(!rows.length) return '<div class="empty-state" style="padding:20px;"><div class="icon">📎</div><h3>No attachments yet</h3></div>';
  return '<div class="table-wrap"><table><thead><tr><th>Type</th><th>File</th></tr></thead><tbody>'
    + rows.map(r=>'<tr><td>'+escapeHtml(r.kind)+'</td><td><a href="'+driveDownloadUrl(r.fileId)+'" target="_blank" rel="noopener">'+escapeHtml(r.name)+'</a></td></tr>').join('')
    + '</tbody></table></div>';
}

/* Shared by New Request and Add Item — keeps every place that lets someone
   name stock tied to the locked catalog instead of free text, so quantities
   never fragment across near-duplicate names (e.g. two different "Scotch
   Brite" rows). */
function catalogItemOptionsForCategory(categoryId, selectedId){
  const items = DB.itemCatalog.filter(i=>!i.deleted && i.categoryId===categoryId).sort((a,b)=>a.code.localeCompare(b.code));
  if(!items.length) return '<option value="">— No items in catalog for this category, ask Admin to add one —</option>';
  return '<option value="">— Select an item —</option>' + items.map(i=>'<option value="'+i.id+'" '+(selectedId===i.id?'selected':'')+'>'+escapeHtml(i.code)+' — '+escapeHtml(i.name)+'</option>').join('');
}
function openItemModal(catId, item){
  const cats = DB.categories.filter(c=>!c.deleted);

    // Adding new stock: must come from the locked catalog, same as the

      + '<div class="field-row">'
      +   '<div class="field"><label>Category</label><select id="it-cat" data-add-cat-select>'+cats.map(c=>'<option value="'+c.id+'" '+(c.id===defaultCatId?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('')+'</select></div>'
      +   '<div class="field"><label>Catalog Item</label><select id="it-catalog-item" data-add-item-select>'+catalogItemOptionsForCategory(defaultCatId,'')+'</select></div>'
      + '</div>'
      + '<div class="field-row"><div class="field"><label>Quantity</label><input type="number" id="it-qty" value="0"></div>'
      +   '<div class="field"><label>Unit</label><input type="text" id="it-unit" placeholder="pcs, box, litre…" value=""></div></div>'
      + '<div class="field-row"><div class="field"><label>Cost / Value (₹)</label><input type="number" id="it-cost" value="0"></div>'
      +   '<div class="field"><label>Reorder Threshold</label><input type="number" id="it-reorder" value="0"></div></div>'

/* ============================================================
   Stock Ledger — chronological, append-only, one row per movement
   ============================================================ */
function itemLedgerEntries(itemId){
  return DB.stockLedger.filter(e=>e.inventoryItemId===itemId).sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));
}
function pushLedgerEntry(itemId, type, referenceNumber, qtyIn, qtyOut, remark, txnDate){
  const item = DB.inventoryItems.find(i=>i.id===itemId);
  const prevBalance = item ? (Number(item.quantity)||0) : 0; // item.quantity is always the authoritative current stock
  const runningBalance = prevBalance + (Number(qtyIn)||0) - (Number(qtyOut)||0);
  DB.stockLedger.push({
    id: nextId('ledg'), inventoryItemId: itemId, date: txnDate || new Date().toISOString().slice(0,10),
    type, referenceNumber: referenceNumber||'', quantityIn: Number(qtyIn)||0, quantityOut: Number(qtyOut)||0,
    runningBalance, performedByEmail: currentUserEmail, performedByName: (myStaffRecord()||{}).name || currentUserEmail,
    remark: remark||'', timestamp: new Date().toISOString()
  });
  return runningBalance;
}
function itemAveragePurchaseCost(itemId){
  const purchases = itemLedgerEntries(itemId).filter(e=>e.quantityIn>0 && (e.type==='Purchase'||e.type==='Goods Receipt'));
  if(!purchases.length) return 0;
  let totalQty=0, totalCost=0;
  purchases.forEach(e=>{ totalQty += e.quantityIn; totalCost += e.quantityIn * (Number(e.unitCostAtEntry)||0); });
  return totalQty>0 ? totalCost/totalQty : 0;
}
function itemLastPurchaseDate(itemId){
  const purchases = itemLedgerEntries(itemId).filter(e=>e.quantityIn>0 && (e.type==='Purchase'||e.type==='Goods Receipt'));
  return purchases.length ? purchases[purchases.length-1].date : null;
}
function itemHistoryPush(item, action, remark){
  if(!Array.isArray(item.history)) item.history = [];
  item.history.push({ action, actorEmail: currentUserEmail, actorName: (myStaffRecord()||{}).name || currentUserEmail, remark: remark||'', timestamp: new Date().toISOString() });
}

function syncConsumableStock(r){
  const qty = (r.purchase && r.purchase.quantityPurchased) || r.quantityRequested || 0;
  const unitCost = r.purchase ? (Number(r.purchase.unitPrice)||0) : 0;
  const cat = DB.categories.find(c=>c.id===r.categoryId);
  let item = DB.inventoryItems.find(i=> !i.deleted && i.categoryId===r.categoryId && (i.name||'').toLowerCase()===(r.itemName||'').toLowerCase());
  if(item){
    item.updatedAt = new Date().toISOString();
    itemHistoryPush(item, 'Stock received', qty+' received via '+r.requestNumber);
  } else {
    item = {
      id: nextId('item'), name: r.itemName, categoryId: r.categoryId,
      catalogItemId: r.catalogItemId||null, itemCode: r.itemCode||'',
      quantity: 0, unit: '', cost: unitCost, reorderThreshold: 0, minStock: 0, preferredSupplier: r.purchase ? (r.purchase.supplier||'') : '',
      purchaseDate: r.purchase ? r.purchase.purchaseDate : '', status:'Good',
      remarks: 'Auto-added from Procurement · '+r.requestNumber, linkedRequestItemId: r.id,
      history: [], updatedAt: new Date().toISOString()
    };
    DB.inventoryItems.push(item);
    itemHistoryPush(item, 'Created', 'Auto-created via '+r.requestNumber);
  }
  const balance = pushLedgerEntry(item.id, 'Goods Receipt', r.requestNumber, qty, 0, 'Received from '+(r.purchase?r.purchase.supplier:'')+' · '+r.itemName, r.purchase?r.purchase.purchaseDate:null);
  DB.stockLedger[DB.stockLedger.length-1].unitCostAtEntry = unitCost;
  item.quantity = balance;
  item.cost = itemAveragePurchaseCost(item.id);
  item.purchaseDate = itemLastPurchaseDate(item.id);
  if(r.purchase && r.purchase.supplier) item.preferredSupplier = r.purchase.supplier;
}
function syncAssetToInventory(r, personEmail, personName){
  const qty = (r.purchase && r.purchase.quantityPurchased) || 1;
  // Same merge-by-identity rule as syncConsumableStock: a new procurement
  // request for an asset that's already tracked must add to that item's
  // existing stock, never spawn a second row for the same item.
  let item = DB.inventoryItems.find(i=> !i.deleted && i.categoryId===r.categoryId
    && (i.name||'').toLowerCase()===(r.itemName||'').toLowerCase());
  if(item){
    item.updatedAt = new Date().toISOString();
    itemHistoryPush(item, 'Stock received', qty+' received via '+r.requestNumber);
  } else {
    item = {
      id: nextId('item'), name: r.itemName, categoryId: r.categoryId,
      catalogItemId: r.catalogItemId||null, itemCode: r.itemCode||'',
      quantity: 0, unit:'unit', cost: r.purchase ? r.purchase.totalAmount : 0, reorderThreshold: 0, minStock: 0,
      preferredSupplier: r.purchase ? (r.purchase.supplier||'') : '',
      purchaseDate: r.purchase ? r.purchase.purchaseDate : '', status:'Received — Awaiting Installation',
      remarks: 'Received by '+personName+' · Auto-added from Procurement · '+r.requestNumber,
      linkedRequestItemId: r.id, installations: [], disposals: [], history: [], updatedAt: new Date().toISOString()
    };
    DB.inventoryItems.push(item);
    itemHistoryPush(item, 'Created', 'Auto-created via '+r.requestNumber+', received by '+personName);
  }
  if(!Array.isArray(item.installations)) item.installations = [];
  if(!Array.isArray(item.disposals)) item.disposals = [];
  const bal = pushLedgerEntry(item.id, 'Goods Receipt', r.requestNumber, qty, 0, 'Asset received by '+personName, r.purchase?r.purchase.purchaseDate:null);
  DB.stockLedger[DB.stockLedger.length-1].unitCostAtEntry = qty>0 ? ((r.purchase?r.purchase.totalAmount:item.cost)/qty) : item.cost;
  item.quantity = bal;
  if(r.purchase && r.purchase.supplier) item.preferredSupplier = r.purchase.supplier;
}

/* Bringing pre-existing stock (never entered through Procurement) into the
   system — same merge-by-identity dedup as the procurement sync functions
   above, so an existing item and a later procurement purchase of the same
   thing land in the SAME row, not two. Deliberately doesn't say "Auto-added
   from Procurement" anywhere, since it wasn't. Used by both the Consumables
   and Spare Assets "+ Add Existing" entry points. */
function addExistingStock(catalogItem, categoryId, qty, refDate, reference, remarks, personEmail, personName, photoFileId, photoFileName){
  let item = DB.inventoryItems.find(i=> !i.deleted && i.categoryId===categoryId
    && (i.name||'').toLowerCase()===(catalogItem.name||'').toLowerCase());
  const noteBits = ['Existing stock added by '+personName];
  if(reference) noteBits.push('Ref: '+reference);
  if(remarks) noteBits.push(remarks);
  const fullRemark = noteBits.join(' · ');
  if(item){
    item.updatedAt = new Date().toISOString();
    if(photoFileId && !item.photoFileId){ item.photoFileId = photoFileId; item.photoFileName = photoFileName; }
    itemHistoryPush(item, 'Stock received', qty+' added as existing stock by '+personName+(reference?' · Ref: '+reference:''));
  } else {
    item = {
      id: nextId('item'), name: catalogItem.name, categoryId,
      catalogItemId: catalogItem.id, itemCode: catalogItem.code||'',
      quantity: 0, unit: itemPattern({itemTypeId:catalogItem.itemTypeId})==='asset' ? 'unit' : '', cost: 0, reorderThreshold: 0, minStock: 0,
      preferredSupplier: '', purchaseDate: refDate||'', status:'Good',
      remarks: fullRemark, photoFileId: photoFileId||null, photoFileName: photoFileName||null,
      linkedRequestItemId: null, installations: [], disposals: [], history: [], updatedAt: new Date().toISOString()
    };
    DB.inventoryItems.push(item);
    itemHistoryPush(item, 'Created', 'Added as existing stock by '+personName+(reference?' · Ref: '+reference:''));
  }
  if(!Array.isArray(item.installations)) item.installations = [];
  if(!Array.isArray(item.disposals)) item.disposals = [];
  const balance = pushLedgerEntry(item.id, 'Goods Receipt', reference||'', qty, 0, fullRemark, refDate);
  item.quantity = balance;
  item.updatedAt = new Date().toISOString();
  return item;
}
