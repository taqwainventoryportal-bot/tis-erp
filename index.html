<style>
/* ============================================================
   Taqwa Islamic School — Inventory & Notesheet Portal
   Design language: deep Islamic green + antique gold, an
   Design language: restrained enterprise palette with Inter throughout,
   Amiri (Naskh-style serif) for display headings paired with
   Inter for UI/body text.
   ============================================================ */
:root{
  /* Neutral base */
  --color-bg: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-surface-2: #F1F5F9;
  --color-ink: #1E293B;
  --color-ink-soft: #64748B;
  --color-ink-faint: #94A3B8;
  --color-border: #E2E8F0;

  /* Primary (Dashboard / global default) */
  --color-primary: #2563EB;
  --color-primary-dark: #1D4ED8;
  --color-primary-light: #DBEAFE;

  /* Secondary accent (dividers, misc — kept muted/neutral per "avoid decorative color") */
  --color-gold: #64748B;
  --color-gold-bright: #475569;
  --color-gold-soft: #F1F5F9;

  /* ============================================================
     MODULE COLOURS — identify *where* the user is (nav, active tab,
     underline, icons, small accents). Applied via .module-* wrapper
     classes further down, which override --color-primary locally.
     These must never be reached for on an *action* — see ACTION
     COLOURS below, which are deliberately separate tokens so an
     Approve button is never "Procurement orange" just because the
     page it's on is.
     ============================================================ */
  --module-dashboard: #2563EB;
  --module-dashboard-dark: #1D4ED8;
  --module-dashboard-soft: #DBEAFE;
  /* Home dashboard's own visual identity — deep navy card headers + a
     muted gold accent, per the supplied reference. Deliberately scoped to
     Home's cards only (not a site-wide recolor); every other module keeps
     its own module colour untouched. */
  --dashboard-navy: #0F2A47;
  --dashboard-navy-dark: #0A1E33;
  --dashboard-page-bg: #F4F6FA;
  --dashboard-gold: #C08A2E;
  --dashboard-gold-soft: #FBF1DD;
  --module-inventory: #059669;
  --module-inventory-dark: #047857;
  --module-inventory-soft: #D1FAE5;
  /* Item/Service Procurement — deliberately two distinct, muted colours
     (not the old saturated burnt-orange) so the two modules stay visually
     told apart, while both sitting calmly alongside Inventory's green and
     the portal's blue navigation rather than competing with them. */
  --module-procurement: #0D9488;
  --module-procurement-dark: #0F766E;
  --module-procurement-soft: #CCFBF1;
  --module-service-procurement: #4F46E5;
  --module-service-procurement-dark: #4338CA;
  --module-service-procurement-soft: #E0E7FF;
  --module-reports: #7C3AED;
  --module-reports-dark: #6D28D9;
  --module-reports-soft: #EDE9FE;
  --module-admin: #475569;
  --module-admin-dark: #334155;
  --module-admin-soft: #F1F5F9;

  /* Legacy aliases — kept so existing --accent-* references elsewhere
     in this file keep working unchanged while everything transitions
     onto the --module-* names above. */
  --accent-inventory: var(--module-inventory);
  --accent-inventory-dark: var(--module-inventory-dark);
  --accent-inventory-soft: var(--module-inventory-soft);
  --accent-procurement: var(--module-procurement);
  --accent-procurement-dark: var(--module-procurement-dark);
  --accent-procurement-soft: var(--module-procurement-soft);
  --accent-reports: var(--module-reports);
  --accent-reports-dark: var(--module-reports-dark);
  --accent-reports-soft: var(--module-reports-soft);
  --accent-admin: var(--module-admin);
  --accent-admin-dark: var(--module-admin-dark);
  --accent-admin-soft: var(--module-admin-soft);

  /* ============================================================
     ACTION COLOURS — what a control *does*, fixed everywhere in the
     app regardless of which module it's rendered inside. Never
     overridden by .module-* scoping.
     ============================================================ */
  --action-approve: #059669;
  --action-approve-dark: #047857;
  --action-approve-soft: #D1FAE5;
  --action-decline: #DC2626;
  --action-decline-soft: #FEE2E2;
  --action-delete: #DC2626;
  --action-edit: #2563EB;
  --action-warning: #D97706;
  --action-warning-soft: #FEF3C7;
  --action-cancel: #475569;
  --action-cancel-soft: #F1F5F9;

  /* Status — muted pastels only */
  --color-danger: #DC2626;
  --color-danger-soft: #FEE2E2;
  --color-success: #166534;
  --color-success-soft: #DCFCE7;
  --color-medium: #92400E;
  --color-medium-soft: #FEF3C7;
  --color-high: #B91C1C;
  --color-high-soft: #FEE2E2;
  --color-info: #1D4ED8;
  --color-info-soft: #DBEAFE;

  /* Spacing scale — new controls in dense areas (Approvals inbox,
     New Request form) are built from these instead of one-off px
     values; older parts of the file still use literal px and are
     unaffected. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;

  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 10px -6px rgba(15,23,42,0.10);
  --font-display: 'Inter', 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
  --motion: 150ms ease;
  --motion-slow: 190ms ease;
}
*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0; background:var(--color-bg); color:var(--color-ink);
  font-family: var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;
}
body::before{ content:none; }
body::after{ content:none; }
a{ color:inherit; }
h1,h2,h3,h4{ font-family: var(--font-display); margin:0 0 4px; font-weight:700; color:var(--color-primary-dark); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 22px; position:relative; z-index:1; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:2px solid var(--color-gold-bright); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ---- Star motif ---- */
.plain-divider{ height:1px; margin:22px 0 16px; background:linear-gradient(90deg, transparent, var(--color-border) 15%, var(--color-border) 85%, transparent); }

/* ---- Header: brand band + nav ribbon ---- */
.brand-band{ position:relative; z-index:55; background:linear-gradient(180deg, var(--color-primary-light), var(--color-surface)); border-bottom:1px solid var(--color-border); }
.brand-band-inner{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:15px 0; }
.brand{ display:flex; align-items:center; gap:13px; text-decoration:none; color:var(--color-ink); }
.brand-logo-img{ height:42px; width:auto; display:block; flex:none; }
.brand-divider{ width:1px; height:26px; background:var(--color-border); flex:none; }
.brand-sub{ font-size:11px; font-weight:600; color:var(--color-primary-dark); letter-spacing:.02em; line-height:1.3; max-width:150px; }
.header-right{ display:flex; align-items:center; gap:16px; }
.search-box input{ width:200px; }

.nav-ribbon{ position:sticky; top:0; z-index:50; background:var(--color-surface); border-bottom:1px solid var(--color-border); box-shadow:var(--shadow-sm); }
.nav-ribbon-inner{ display:flex; align-items:center; gap:2px; padding:7px 0; }
.nav-ribbon a{
  position:relative; text-decoration:none; color:var(--color-ink-soft); font-size:13.5px; font-weight:600;
  padding:9px 16px; display:inline-block; border-radius:6px;
  transition:color 150ms ease, background-color 150ms ease;
}
.nav-ribbon a::after{
  content:''; position:absolute; left:14px; right:14px; bottom:2px; height:2px;
  background:var(--color-primary); border-radius:2px;
  transform:scaleX(0); transform-origin:left; transition:transform 200ms ease;
}
.nav-ribbon a:hover{ color:var(--color-primary-dark); background:var(--color-surface-2); }
.nav-ribbon a:hover::after{ transform:scaleX(1); }
.nav-ribbon a.active{ color:var(--color-primary-dark); font-weight:700; }
.nav-ribbon a.active::after{ transform:scaleX(1); }
/* Module-specific accents: each section of the app keeps a consistent identity */
.nav-ribbon a[data-module="inventory"]:hover, .nav-ribbon a[data-module="inventory"].active{ color:var(--accent-inventory-dark); }
.nav-ribbon a[data-module="inventory"]::after{ background:var(--accent-inventory); }
.nav-ribbon a[data-module="procurement"]:hover, .nav-ribbon a[data-module="procurement"].active{ color:var(--accent-procurement-dark); }
.nav-ribbon a[data-module="procurement"]::after{ background:var(--accent-procurement); }
.nav-ribbon a[data-module="service-procurement"]:hover, .nav-ribbon a[data-module="service-procurement"].active{ color:var(--module-service-procurement-dark); }
.nav-ribbon a[data-module="service-procurement"]::after{ background:var(--module-service-procurement); }
.nav-ribbon a[data-module="admin"]:hover, .nav-ribbon a[data-module="admin"].active{ color:var(--accent-admin-dark); }
.nav-ribbon a[data-module="admin"]::after{ background:var(--accent-admin); }

.auth-box{ display:flex; align-items:center; gap:10px; padding-left:16px; border-left:1px solid var(--color-border); }
.role-chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; background:var(--color-primary-light); color:var(--color-primary-dark); border:1px solid var(--color-border); padding:5px 11px 5px 8px; border-radius:999px; }
.role-chip::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--color-gold); flex:none; }
.btn{ font-weight:600; font-size:13.5px; padding:8px 14px; border-radius:var(--radius-sm); border:1.5px solid transparent; transition:background-color 150ms ease, border-color 150ms ease, color 150ms ease; white-space:nowrap; }
.btn-primary{ background:var(--color-primary); color:#fff; }
.btn-primary:hover{ background:var(--color-primary-dark); }
.btn-gold{ background:var(--color-primary); color:#fff; }
.btn-gold:hover{ background:var(--color-primary-dark); }
.btn-outline{ background:transparent; border-color:var(--color-border); color:var(--color-ink); }
.btn-outline:hover{ border-color:var(--color-primary); color:var(--color-primary); }
.btn-danger{ background:transparent; border-color:var(--color-danger); color:var(--color-danger); }
.btn-danger:hover{ background:var(--color-danger); color:#fff; }
.btn-sm{ padding:5px 10px; font-size:12.5px; }
.btn-ghost-dark{ background:transparent; border-color:var(--color-border); color:var(--color-ink-soft); }
.btn-ghost-dark:hover{ background:var(--color-surface-2); color:var(--color-primary); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }


/* ---- Dashboard header subtitle ---- */
.page-subtitle-inline{ font-size:13px; color:var(--color-ink-faint); margin-bottom:10px; }

/* ---- Signed-out banner landing page ---- */
.landing-banner{ position:relative; width:100%; min-height:520px; background-size:cover; background-position:center; display:flex; align-items:center; }
.landing-white-overlay{ position:absolute; inset:0; background:rgba(255,255,255,0.8); }
.landing-hero-split{ position:relative; z-index:1; display:grid; grid-template-columns:1.3fr 1fr; gap:40px; align-items:center; padding:48px 22px; }
.landing-hero-left h1{ font-size:34px; color:var(--color-ink); margin-bottom:6px; line-height:1.2; }
.landing-hero-left h2{ font-size:19px; color:var(--color-primary-dark); font-weight:600; margin-bottom:14px; font-family:var(--font-body); }
.landing-hero-left p{ font-size:14.5px; color:var(--color-ink-soft); max-width:480px; margin-bottom:22px; line-height:1.6; }
.landing-feature-row{ display:flex; flex-wrap:wrap; gap:10px; }
.landing-feature-badge{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.85); border:1px solid var(--color-border); border-radius:10px; padding:9px 13px; font-size:12px; font-weight:600; color:var(--color-ink); box-shadow:var(--shadow-sm); }
.landing-feature-icon{ font-size:16px; }
.landing-hero-right{ display:flex; justify-content:center; }
.landing-signin-card{ background:rgba(255,255,255,0.97); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:30px 32px; text-align:center; max-width:360px; width:100%; }
.landing-signin-card h3{ font-size:20px; margin-bottom:6px; }
.landing-signin-sub{ font-size:12.5px; color:var(--color-ink-soft); margin:0 0 18px; line-height:1.5; }
.landing-signin-btn{ width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px; background:#fff; border:1.5px solid var(--color-border); border-radius:8px; padding:11px 20px; font-size:14px; font-weight:600; color:var(--color-ink); cursor:pointer; transition:border-color 150ms ease, box-shadow 150ms ease; }
.landing-signin-btn:hover{ border-color:var(--color-primary); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.landing-trust-list{ list-style:none; margin:18px 0 0; padding:14px 0 0; border-top:1px solid var(--color-border); text-align:left; display:flex; flex-direction:column; gap:9px; }
.landing-trust-list li{ font-size:12px; color:var(--color-ink-soft); }
@media (max-width:900px){ .landing-hero-split{ grid-template-columns:1fr; } .landing-hero-right{ justify-content:flex-start; } }
@media (max-width:640px){ .landing-hero-left h1{ font-size:26px; } }

/* Clean, minimal login homepage — no background photo, no operational
   stats; just the pitch, sign-in, and school branding, per the supplied
   reference design (badge pill, two-tone heading, centered seal). */
.landing-clean{ background:var(--color-bg); padding:36px 0 56px; }
.landing-badge-pill{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--color-border); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; color:var(--color-ink-soft); margin-bottom:18px; box-shadow:var(--shadow-sm); }
.landing-h1-accent{ color:var(--color-primary); }
.landing-emblem-block{ margin-top:28px; text-align:center; max-width:280px; }
.landing-emblem-img{ width:150px; height:150px; object-fit:contain; }
.landing-emblem-tagline{ margin-top:10px; font-style:italic; font-size:13px; color:var(--color-ink-soft); }
.landing-signin-divider{ display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--color-ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
.landing-signin-divider::before, .landing-signin-divider::after{ content:''; flex:1; height:1px; background:var(--color-border); }
@media (max-width:900px){ .landing-emblem-block{ margin-left:auto; margin-right:auto; } }

/* ---- Workflow diagram ---- */
.landing-workflow-section{ background:var(--color-surface); border-bottom:1px solid var(--color-border); padding:34px 0 30px; }
.landing-section-heading{ text-align:center; font-size:19px; font-weight:700; color:var(--color-ink); position:relative; margin-bottom:26px; }
.landing-section-heading::after{ content:''; display:block; width:44px; height:3px; background:var(--color-primary); margin:8px auto 0; border-radius:2px; }
.workflow-row{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; }
.workflow-step{ display:flex; flex-direction:column; align-items:center; gap:8px; width:88px; text-align:center; }
.workflow-step-icon{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; }
.workflow-step-label{ font-size:11px; font-weight:600; color:var(--color-ink-soft); line-height:1.3; }
.workflow-arrow{ color:var(--color-ink-faint); font-size:16px; padding:0 2px; }
.accent-dashboard{ background:var(--color-primary-light); }
.accent-inventory{ background:var(--accent-inventory-soft); }
.accent-procurement{ background:var(--accent-procurement-soft); }
.accent-reports{ background:var(--accent-reports-soft); }
.accent-admin{ background:var(--accent-admin-soft); }
@media (max-width:820px){ .workflow-arrow{ display:none; } .workflow-row{ gap:16px; } }

/* ---- Landing stats ---- */
.landing-stats-section{ padding:30px 22px 46px; }
.landing-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; }
.landing-stat-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:16px 18px; display:flex; align-items:center; gap:14px; transition:box-shadow 150ms ease, transform 150ms ease; }
.landing-stat-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
.landing-stat-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; }
.landing-stat-num{ font-size:24px; font-weight:700; color:var(--color-ink); letter-spacing:-.01em; }
.landing-stat-lbl{ font-size:11.5px; color:var(--color-ink-faint); margin-top:1px; }

/* ---- Footer columns ---- */
.footer-cols{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding:18px 22px; font-size:12px; color:var(--color-ink-faint); line-height:1.6; }
.footer-col strong{ color:var(--color-ink-soft); }
@media (max-width:820px){ .footer-cols{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .footer-cols{ grid-template-columns:1fr; text-align:center; } }

/* ---- Static info pages (About/Help/Contact) ---- */
.static-page-body{ max-width:680px; }
.static-page-body p{ font-size:14px; color:var(--color-ink-soft); line-height:1.7; margin-bottom:14px; }


/* ---- Compact dashboard stat cards ---- */
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin:0 0 4px; }
.stat-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:12px 14px; display:flex; align-items:center; gap:11px; transition:box-shadow .18s ease, transform .18s ease; text-decoration:none; cursor:pointer; }
.stat-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
.stat-icon{ width:34px; height:34px; border-radius:9px; background:var(--color-primary-light); display:flex; align-items:center; justify-content:center; flex:none; }
.stat-num{ font-size:19px; font-weight:700; color:var(--color-ink); line-height:1.15; letter-spacing:-.01em; }
.stat-lbl{ font-size:11px; color:var(--color-ink-faint); margin-top:1px; }

/* ---- Section heading + KPI row ---- */
.section-heading{ font-size:12.5px; font-weight:700; color:var(--color-ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px; }
.kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }

/* Home dashboard cards — navy header band + white body + muted gold for
   emphasis numbers, scoped to .home-dashboard-page only (set on Home's
   outer wrapper). Every other page keeps the plain card treatment above. */
.home-dashboard-page{ background:var(--dashboard-page-bg); }
/* Dashboard heading matches the same navy used by the section-header
   bars below it — text and its underline both, so it reads as one
   consistent accent rather than the page-default blue clashing with it. */
.home-dashboard-page .page-title h2{ color:var(--dashboard-navy); }
.home-dashboard-page .page-title h2::after{ background:var(--dashboard-navy); }
.dash-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:20px; }
.dash-card{ background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(15,42,71,0.06), 0 4px 14px -8px rgba(15,42,71,0.12); text-decoration:none; color:inherit; display:block; transition:transform var(--motion), box-shadow var(--motion); }
a.dash-card:hover{ transform:translateY(-2px); box-shadow:0 4px 16px -6px rgba(15,42,71,0.22); }
.dash-card-header{ background:var(--dashboard-navy); color:#fff; padding:9px 14px; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; display:flex; align-items:center; justify-content:space-between; }
.dash-card-body{ padding:16px 14px; }
.dash-card-num{ font-size:26px; font-weight:800; color:var(--dashboard-navy); line-height:1; }
.dash-card-num.gold{ color:var(--dashboard-gold); }
.dash-card-sub{ font-size:11.5px; color:var(--color-ink-faint); margin-top:4px; }
.dash-section-title{ font-size:13px; font-weight:700; color:var(--dashboard-navy); text-transform:uppercase; letter-spacing:.04em; margin:24px 0 12px; }
.dash-chart-card{ background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(15,42,71,0.06), 0 4px 14px -8px rgba(15,42,71,0.12); }
.dash-chart-card .dash-card-header{ font-size:11px; }
.dash-chart-card .dash-chart-body{ padding:16px; }
.kpi-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:12px 15px; transition:box-shadow .18s ease, transform .18s ease; }
.kpi-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }

.activity-carousel-wrap{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.activity-carousel{ display:flex; gap:10px; overflow-x:auto; scroll-behavior:smooth; padding:2px 2px 6px; scrollbar-width:thin; flex:1; }
.activity-carousel::-webkit-scrollbar{ height:6px; }
.activity-carousel::-webkit-scrollbar-thumb{ background:var(--color-border); border-radius:3px; }
.activity-card{
  flex:none; width:220px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:10px;
  padding:12px; text-decoration:none; color:inherit; transition:box-shadow var(--motion), transform var(--motion), border-color var(--motion);
}
.activity-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); border-color:var(--color-primary); }
.activity-card-icon{ font-size:18px; margin-bottom:6px; }
.activity-card-title{ font-size:12.5px; font-weight:700; color:var(--color-ink); line-height:1.3; margin-bottom:3px; }
.activity-card-meta{ font-size:11px; color:var(--color-ink-soft); margin-bottom:4px; }
.activity-card-time{ font-size:10.5px; color:var(--color-ink-faint); }
.activity-nav-btn{
  flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--color-border); background:var(--color-surface);
  color:var(--color-ink-soft); font-size:16px; line-height:1; cursor:pointer; transition:background var(--motion), color var(--motion), border-color var(--motion);
}
.activity-nav-btn:hover{ background:var(--color-primary-light); color:var(--color-primary-dark); border-color:var(--color-primary); }
.kpi-lbl{ font-size:11.5px; color:var(--color-ink-faint); margin-bottom:4px; }
.kpi-val{ font-size:20px; font-weight:700; color:var(--color-ink); letter-spacing:-.01em; }

/* ---- Analytics chart cards ---- */
.analytics-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-top:16px; }
@media (max-width:820px){ .analytics-grid{ grid-template-columns:1fr; } }
.chart-card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:17px 19px 13px; }
.chart-card-title{ font-size:12.5px; font-weight:700; color:var(--color-ink-soft); margin-bottom:10px; }
.donut-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.legend-list{ flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }

/* ---- Rich empty state for analytics ---- */
.empty-analytics{ text-align:center; padding:56px 24px; margin-top:16px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
.empty-analytics-icon{ width:64px; height:64px; border-radius:50%; background:var(--color-primary-light); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.empty-analytics h3{ font-size:16px; color:var(--color-ink); margin-bottom:6px; }
.empty-analytics p{ font-size:13px; color:var(--color-ink-faint); max-width:380px; margin:0 auto; }
.legend-row{ display:flex; align-items:center; gap:7px; font-size:12px; }
.legend-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.legend-label{ flex:1; color:var(--color-ink-soft); }
.legend-value{ font-weight:600; color:var(--color-ink); white-space:nowrap; }
.legend-pct{ color:var(--color-ink-faint); font-weight:400; }
.hbar-list{ display:flex; flex-direction:column; gap:9px; }
.hbar-row{ display:grid; grid-template-columns:100px 1fr auto; align-items:center; gap:8px; font-size:12px; }
.hbar-label{ color:var(--color-ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbar-track{ height:8px; background:var(--color-surface-2); border-radius:4px; overflow:hidden; }
.hbar-fill{ height:100%; background:var(--color-primary); border-radius:4px; }
.hbar-value{ font-weight:600; color:var(--color-ink); white-space:nowrap; }

/* ---- Content ---- */
.content{ padding:26px 0 60px; }
/* Module scoping: overriding --color-primary locally lets every existing
   button, tab, icon, and focus ring automatically pick up the right module
   accent without touching each component individually. */
.module-inventory{ --color-primary: var(--module-inventory); --color-primary-dark: var(--module-inventory-dark); --color-primary-light: var(--module-inventory-soft); --color-ink: #0F172A; }
.module-procurement{ --color-primary: var(--module-procurement); --color-primary-dark: var(--module-procurement-dark); --color-primary-light: var(--module-procurement-soft); }
.module-service-procurement{ --color-primary: var(--module-service-procurement); --color-primary-dark: var(--module-service-procurement-dark); --color-primary-light: var(--module-service-procurement-soft); }
.module-reports{ --color-primary: var(--module-reports); --color-primary-dark: var(--module-reports-dark); --color-primary-light: var(--module-reports-soft); }
.module-admin{ --color-primary: var(--module-admin); --color-primary-dark: var(--module-admin-dark); --color-primary-light: var(--module-admin-soft); }
.page-title{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.page-title h2{ font-size:25px; font-weight:800; position:relative; display:inline-flex; align-items:center; gap:12px; letter-spacing:-.02em; }
.page-title h2::after{ content:''; position:absolute; left:0; bottom:-9px; width:38px; height:3px; background:var(--color-primary); border-radius:2px; }
.page-title-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
.page-subtitle{ color:var(--color-ink-faint); font-size:13.5px; margin:16px 0 4px; }
.breadcrumb{ font-size:12.5px; color:var(--color-ink-faint); margin-bottom:10px; }
.breadcrumb a{ text-decoration:none; color:var(--color-primary); font-weight:600; }

/* ---- Cards / grid ---- */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-top:18px; }
.card{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:18px; transition:.15s; }
.card-link{ text-decoration:none; color:inherit; display:block; }
.card-link:hover .card{ box-shadow:var(--shadow); border-color:var(--color-gold); transform:translateY(-1px); }
.card-icon{ width:40px; height:40px; border-radius:10px; background:var(--color-primary-light); color:var(--color-primary); display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-family:var(--font-display); font-weight:700; font-size:17px; }

/* ---- Inventory category tiles (Round 2 polish) ---- */
.cat-tile{ display:flex; height:100%; }
.cat-card{ padding:22px 20px; border:1px solid var(--color-border); box-shadow:none; transition:transform 180ms ease, border-color 180ms ease, background-color 180ms ease; display:flex; flex-direction:column; width:100%; }
.cat-tile:hover .cat-card{ transform:translateY(-2px); border-color:var(--color-border); background:#FAFBFC; cursor:pointer; }
.cat-card-icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.cat-card-title{ font-size:15px; font-weight:700; color:var(--color-ink); margin-bottom:4px; letter-spacing:-.01em; }
.cat-card-meta{ font-size:12px; color:var(--color-ink-faint); font-weight:500; }
.card-title{ font-weight:700; font-size:15.5px; color:var(--color-primary-dark); margin-bottom:2px; }
.card-meta{ font-size:12.5px; color:var(--color-ink-faint); }
.card-badge-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

.nav-tile{ background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:24px; display:flex; gap:16px; align-items:flex-start; text-decoration:none; color:inherit; transition:.15s; }
.nav-tile:hover{ box-shadow:var(--shadow); border-color:var(--color-gold); transform:translateY(-2px); }
.nav-tile-icon{ width:52px; height:52px; border-radius:14px; background:var(--color-primary); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
.nav-tile h3{ font-size:18px; margin-bottom:4px; }
.nav-tile p{ font-size:13px; color:var(--color-ink-soft); margin:0; }

/* ---- Tabs ---- */
.tab-strip{ display:flex; gap:2px; border-bottom:1.5px solid var(--color-border); margin:10px 0 0; overflow-x:auto; }
.tab-btn{ background:none; border:none; border-radius:6px 6px 0 0; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--color-ink-soft); border-bottom:2px solid transparent; margin-bottom:-1.5px; white-space:nowrap; transition:color var(--motion-slow), background-color var(--motion-slow), border-color var(--motion-slow); }
.tab-btn:hover{ color:var(--color-primary-dark); background:var(--color-surface-2); }
.tab-btn.active{ color:var(--color-ink); border-bottom-color:var(--color-primary); font-weight:700; }
.proc-tab-strip .tab-btn{ display:inline-flex; align-items:center; gap:7px; padding:11px 14px; }
.proc-tab-strip .tab-btn.active{ background:var(--color-primary-light); border-radius:8px 8px 0 0; }
.tab-count-badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
  border-radius:999px; background:var(--color-ink-faint); color:#fff; font-size:10.5px; font-weight:700;
}
.proc-tab-strip .tab-btn.active .tab-count-badge{ background:var(--color-primary); }
/* "Something just changed here" — subtle, short-lived, never flashing. */
.proc-tab-strip .tab-btn.tab-attention{ animation:tabAttentionPulse 1.8s ease-out 1; }
.proc-tab-strip .tab-btn.tab-attention .tab-count-badge{ background:var(--action-approve); }
@keyframes tabAttentionPulse{
  0%{ background:var(--action-approve-soft); }
  100%{ background:transparent; }
}
.tab-panel{ padding-top:14px; }

/* ---- Tables ---- */
.table-wrap{ overflow-x:auto; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); max-height:70vh; overflow-y:auto; }
table{ width:100%; border-collapse:collapse; font-size:13.5px; }

/* ---- Procurement visual stepper ---- */

   Mobile pass — real adjustments, not just a shrunk desktop layout.
   Anything not touched here (field-row, req-action-bar, table-wrap,
   analytics-grid, print) already had its own responsive rule above.
   ============================================================ */
@media (max-width:640px){

  .search-box{ order:3; flex:1 1 100%; }
  .search-box input{ width:100%; box-sizing:border-box; }
  .auth-box{ padding-left:0; border-left:none; }
  .role-chip{ display:none; } /* name/role already visible via Sign out context; saves space on a phone-width header */

  .tab-strip{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab-btn{ padding:9px 12px; font-size:13px; }

  /* Grids collapse to one column outright on a phone rather than relying

  .stat-row, .dash-grid, .kpi-row, .card-grid, .approval-card-grid, .install-card-grid{ grid-template-columns:1fr !important; }

  .modal{ max-width:100%; min-height:100%; border-radius:0; }

     true via .table-wrap) — just tightened so more columns are readable
     at once before the user needs to scroll sideways. */
  .table-wrap table{ font-size:12.5px; }

  .btn{ min-height:40px; padding:9px 14px; }
  .btn-sm{ min-height:34px; }

  .activity-card{ width:200px; }
  .req-line-card, .approval-card{ padding:12px; }
}

function escapeHtml(str){ if(str===null||str===undefined) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function formatDate(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateDMY(iso){ if(!iso) return '—'; const d=new Date(iso+(String(iso).length<=10?'T00:00:00':'')); if(isNaN(d.getTime())) return String(iso); const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear(); }
function formatDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d.getTime())) return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }

/* ============================================================
   Soft delete / Archive — Admin only. Records are never truly
   removed; they're flagged .deleted and logged in DB.archiveLog,
   and can be restored at any time.
   ============================================================ */
function archiveRecord(entityType, record, label, reason){
  DB.archiveLog.push({
    id: nextId('arch'), entityType, entityId: record.id, label,
    deletedByEmail: currentUserEmail, deletedByName: (myStaffRecord()||{}).name || currentUserEmail,
    reason: reason||'', deletedAt: new Date().toISOString(), restored: false
  });
  record.deleted = true;
  record.deletedAt = new Date().toISOString();
  record.deletedByEmail = currentUserEmail;
}
function restoreRecord(entityType, record){
  record.deleted = false;
  const logEntry = DB.archiveLog.slice().reverse().find(e=>e.entityType===entityType && e.entityId===record.id && !e.restored);
  if(logEntry) logEntry.restored = true;
}
function promptAndArchive(entityType, record, label, onDone){
  const reason = prompt('Delete "'+label+'"? This can be restored later from Archive.\n\nOptional reason:', '');
  if(reason===null) return false;
  archiveRecord(entityType, record, label, reason);
  if(onDone) onDone();
  return true;
}
function toast(message, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    el.addEventListener('animationend', ()=>el.remove(), { once:true });
  }, 3600);
}
/* Wraps a save-triggering button: disables it with a busy label while `fn`
   runs (so a slow connection reads as "working", not "frozen" or ignoring
   the click), restores it and shows an error toast if `fn` throws, and
   returns whether it succeeded so the caller can bail out cleanly instead
   of showing a success toast / closing a modal for a save that failed. */
async function runSaveAction(btn, busyLabel, fn){
  const origLabel = btn ? btn.textContent : null;
  const origDisabled = btn ? btn.disabled : false;
  if(btn){ btn.disabled = true; btn.textContent = busyLabel; }
  try{
    await fn();
    return true;
  }catch(e){
    if(btn){ btn.disabled = origDisabled; btn.textContent = origLabel; }
    toast(e.message || 'Something went wrong — please try again', 'error');
    return false;
  }
}
/* For the common "push one new record, then save" shape: if the save fails,
   undoes the push so a retry (or the next unrelated save) can't silently
   create a duplicate — same problem the New Request flow guards against,
   just for a single record instead of a batch. */
async function pushAndSave(array, record){
  array.push(record);
  try{ await saveDb(); }
  catch(e){ const i = array.indexOf(record); if(i>-1) array.splice(i,1); throw e; }
}

/* ============================================================
   Approval engine (v2) — policy-driven, role-based, no fixed
   linear chain and no hardcoded emails.

   A request's approvalStatus is the authoritative state:
     not_required      — bypassed approval entirely per Admin policy
     pending_coordinator — sitting with whoever holds the Coordinator role
     pending_principal   — escalated, sitting with Principal
     approved / declined — terminal
   ============================================================ */
function initApproval(reqItem){
  if(reqItem.procurementPolicy === 'not_required'){
    // Policy says no approval needed — go straight to Purchase Assignment.
    // Never touch a fake approval step just to make history look complete.
    reqItem.approvalStatus = 'not_required';
    reqItem.status = 'purchase_pending';
  } else {
    reqItem.approvalStatus = 'pending_coordinator';
    reqItem.status = 'pending_approval';
  }
}
function approvalStageLabel(approvalStatus){
  return { pending_coordinator:'Coordinator', pending_principal:'Principal', approved:'Approved', declined:'Declined', not_required:'Not Required' }[approvalStatus] || approvalStatus;
}
// Who currently holds approval authority for this request — role-based via
// Manage Staff, never a specific hardcoded email.
function canActOnApproval(reqItem){
  if(reqItem.status !== 'pending_approval') return false;
  if(reqItem.approvalStatus === 'pending_coordinator') return hasRole('coordinator');
  if(reqItem.approvalStatus === 'pending_principal') return hasRole('principal');
  return false;
}
function myApprovalQueue(){ return DB.requestItems.filter(r=> !r.deleted && r.status==='pending_approval' && canActOnApproval(r)); }
async function applyApprovalAction(r, action, comment){
  const actorName = (myStaffRecord()||{}).name || currentUserEmail;
  const stage = approvalStageLabel(r.approvalStatus);
  if(action === 'approve'){
    r.approvalStatus = 'approved';
    r.status = 'purchase_pending';
    r.history.push({ stage: stage+' Approval', action:'approved', actorEmail:currentUserEmail, actorName, remark: comment||'', timestamp:new Date().toISOString() });
  } else if(action === 'decline'){
    r.approvalStatus = 'declined';
    r.status = 'rejected';
    r.history.push({ stage: stage+' Decline', action:'declined', actorEmail:currentUserEmail, actorName, remark: comment, timestamp:new Date().toISOString() });
  } else if(action === 'escalate'){
    r.approvalStatus = 'pending_principal';
    r.escalatedByEmail = currentUserEmail; r.escalatedByName = actorName;
    r.escalatedAt = new Date().toISOString(); r.escalationComment = comment;
    r.history.push({ stage:'Escalated to Principal', action:'escalated', actorEmail:currentUserEmail, actorName, remark: comment, timestamp:new Date().toISOString() });
  }
  await saveDb();
}

/* ============================================================
   Google Drive helpers
   ============================================================ */
async function driveFetchPublic(path, params, allowRetry){
  if(allowRetry === undefined) allowRetry = true;
  const url = new URL(DRIVE_FILES_URL + path);
  url.searchParams.set('key', CONFIG.DRIVE_API_KEY);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  let res;
  const maxAttempts = allowRetry ? 3 : 1;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{ res = await fetch(url); break; } // got a real response (even an error status) — stop retrying, handle it below
    catch(networkErr){
      // fetch() itself rejected — the request never reached a server at all
      // (dropped connection, DNS hiccup, momentary offline). Retry a few
      // times before giving up; a confirmed HTTP error status below is NOT
      // retried here, since retrying won't fix a 403/404.
      if(attempt===maxAttempts) throw new Error('Could not reach Google Drive after several attempts. Check your internet connection and try again.');
      await new Promise(r=>setTimeout(r, 700*attempt));
    }
  }
  if(!res.ok) throw new Error('Drive read failed ('+res.status+')');
  return res;
}
async function driveFetchAuthed(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer '+accessToken });
  let res;
  const maxAttempts = 3;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{ res = await fetch(url, options); break; }
    catch(networkErr){
      // Same "no response at all" case as above — but this is a WRITE, so
      // it's worth telling the person a retry could double up their action
      // if the first attempt actually landed before the reply was lost.
      if(attempt===maxAttempts) throw new Error('Could not reach Google Drive after several attempts. Your connection may be unstable — please check it, then refresh this page before retrying to avoid creating a duplicate.');
      await new Promise(r=>setTimeout(r, 700*attempt));
    }
  }
  if(res.status === 401){
    accessToken = null; currentUserEmail = null;
    try{ sessionStorage.removeItem('taqwa_session'); }catch(e){}
    renderTopbar();
    throw new Error('Your session has expired. Please sign in again.');
  }
  if(res.status === 403){
    // A 403 here is usually NOT "you're not allowed" — it's a token that
    // was issued with fewer scopes than the app now needs (e.g. it was
    // obtained before Drive access was fully set up for this account, or
    // before a scope was added). restoreSession() only checks expiry, not
    // actual granted scope, so a degraded token can otherwise sit in
    // sessionStorage and keep failing for up to an hour even after the
    // underlying account access is fixed. Clearing it forces a fresh
    // prompt:'consent' login next time, which re-requests the full scope.
    const bodyText = await res.text().catch(()=> '');
    if(/insufficient.*(scope|permission)/i.test(bodyText)){
      accessToken = null; currentUserEmail = null;
      try{ sessionStorage.removeItem('taqwa_session'); }catch(e){}
      renderTopbar();
      throw new Error('Your Google sign-in needs to be refreshed to pick up current permissions. Please sign in again.');
    }
    throw new Error('Drive request failed (403): '+bodyText.slice(0,180));
  }
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error('Drive request failed ('+res.status+'): '+t.slice(0,180)); }
  return res;
}

/* Converts an ArrayBuffer to base64 in fixed-size chunks so encoding larger
   files (bill photos, PDFs) doesn't stall the browser. */
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  const CHUNK_SIZE = 0x8000;
  let binary = '';
  for(let i=0; i<bytes.length; i+=CHUNK_SIZE){
    const chunk = bytes.subarray(i, i+CHUNK_SIZE);
    binary += String.fromCharCode.apply(null, chunk);
  }
  return btoa(binary);
}
/* ============================================================
   Image compression — no backend here, everything runs in the browser.
   Targets under 200KB while keeping reasonable quality; if that's not
   achievable without the image becoming unreadable, allows up to a hard
   cap of 500KB rather than degrading it into mush. Only touches image
   files — anything else (e.g. a PDF bill) passes through untouched.
   ============================================================ */
const IMAGE_COMPRESS_TARGET_BYTES = 200*1024;
const IMAGE_COMPRESS_HARD_CAP_BYTES = 500*1024;
function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ resolve(file); return; }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      let width = img.naturalWidth, height = img.naturalHeight;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      function renderAt(w, h){
        canvas.width = w; canvas.height = h;
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
      }
      function tryQuality(q){
        return new Promise(res=> canvas.toBlob(b=>res(b), 'image/jpeg', q));
      }
      (async ()=>{
        renderAt(width, height);
        // Step 1: reduce JPEG quality first — cheaper than downscaling and
        // usually enough on its own for typical phone-camera photos.
        let quality = 0.85;
        let blob = await tryQuality(quality);
        while(blob && blob.size > IMAGE_COMPRESS_TARGET_BYTES && quality > 0.5){
          quality -= 0.1;
          blob = await tryQuality(quality);
        }
        // Step 2: if quality alone can't get under the target without going
        // below a "reasonable" floor, start downscaling dimensions instead
        // of pushing quality down further (blur reads worse than smaller).
        let attempts = 0;
        while(blob && blob.size > IMAGE_COMPRESS_TARGET_BYTES && attempts < 6){
          width = Math.round(width*0.85); height = Math.round(height*0.85);
          renderAt(width, height);
          blob = await tryQuality(Math.max(quality, 0.6));
          attempts++;
        }
        // Hard cap: never ship more than 500KB, even if that still means
        // slightly over the 200KB target.
        attempts = 0;
        while(blob && blob.size > IMAGE_COMPRESS_HARD_CAP_BYTES && attempts < 6){
          width = Math.round(width*0.8); height = Math.round(height*0.8);
          renderAt(width, height);
          blob = await tryQuality(0.6);
          attempts++;
        }
        if(!blob){ resolve(file); return; } // toBlob failed for some reason — fall back to the original rather than lose the upload
        const outName = (file.name||'photo').replace(/\.[^.]+$/, '') + '.jpg';
        resolve(new File([blob], outName, { type:'image/jpeg' }));
      })();
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); resolve(file); }; // not a decodable image — pass through, let the upload itself surface any real problem
    img.src = objectUrl;
  });
}
async function driveUploadBinary(file, parentId){
  const metadata = { name:file.name, parents:[parentId] };
  const boundary = '-------taqwa'+Date.now();
  const arrayBuffer = await file.arrayBuffer();
  const base64Data = arrayBufferToBase64(arrayBuffer);
  const body =
    '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: '+file.type+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+base64Data+'\r\n'+
    '--'+boundary+'--';
  const res = await driveFetchAuthed(DRIVE_UPLOAD_URL+'?uploadType=multipart', {
    method:'POST',
    headers:{ 'Content-Type':'multipart/related; boundary='+boundary },
    body
  });
  const fileId = (await res.json()).id;
  await driveSetPublicReadable(fileId);
  return fileId;
}
// Uses the Drive v3 "files/{id}?alt=media" endpoint with the API key rather
// than the old drive.google.com/uc?export=download hotlink, which Google now
// frequently serves as an HTML interstitial instead of raw image bytes,
// breaking <img src> embeds. alt=media returns the actual bytes directly for
// any file already made publicly readable via driveSetPublicReadable(), no
// sign-in required to view it.

async function loadDb(allowRetry){
  const raw = await driveGetJson(CONFIG.DB_FILE_ID, allowRetry);
  const base = emptyDb();
  DB = Object.assign(base, raw);
  ['departments','categories','inventoryItems','dismissedAlerts','buildings','rooms','itemTypes','staff','requests','requestItems','archiveLog','stockLedger','itemCatalog','purchaseOrders','serviceCategories','serviceRequests'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k] = base[k]; });
  DB.inventoryItems.forEach(i=>{
    if(!Array.isArray(i.history)) i.history = [];
    if(i.minStock===undefined) i.minStock = 0;
    if(i.preferredSupplier===undefined) i.preferredSupplier = '';
  });
  DB.requestItems.forEach(r=>{
    if(!Array.isArray(r.notes)) r.notes = [];
    if(!r.approvalStatus){
      // Defensive default for any record from before this workflow existed —
      // not a full migration, just enough to avoid an undefined state.
      if(r.status==='pending_approval') r.approvalStatus = 'pending_coordinator';
      else if(r.status==='rejected') r.approvalStatus = 'declined';
      else if(r.procurementPolicy==='not_required') r.approvalStatus = 'not_required';
      else r.approvalStatus = 'approved';
    }
  });
  DB.staff.forEach(s=>{
    if(s.canConsume===undefined) s.canConsume = false;
  });
  // Backfill new category fields for DBs saved before this feature existed
  DB.categories.forEach(c=>{
    if(!c.itemTypeId) c.itemTypeId = 'type_consumable';
    if(!c.procurementPolicy) c.procurementPolicy = 'required';
    if(!c.valueClass) c.valueClass = 'low';
  });
}

}

function allStaffEmails(){
  const set = new Set();
  CONFIG.ADMIN_EMAILS.forEach(e=>set.add(e.toLowerCase()));
  if(DB && Array.isArray(DB.staff)){
    DB.staff.forEach(s=>{ if(s.active!==false && s.email) set.add(s.email.toLowerCase()); });
  }
  return set;
}
function initAuth(){
  if(!CONFIG.OAUTH_CLIENT_ID) return;
  if(window.google && window.google.accounts && window.google.accounts.oauth2){
    setupTokenClient();
    return;
  }
  let tries = 0;
  const iv = setInterval(()=>{
    tries++;
    if(window.google && window.google.accounts && window.google.accounts.oauth2){
      clearInterval(iv);
      setupTokenClient();
    } else if(tries > 75){
      clearInterval(iv);
    }
  }, 200);
}
function setupTokenClient(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.OAUTH_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive email profile openid',
    callback: async (resp)=>{
      if(resp.error){ toast('Sign-in failed', 'error'); return; }
      accessToken = resp.access_token;
      const expiresInSec = Number(resp.expires_in) || 3300;
      const tryVerify = async (attempt)=>{
        try{
          const infoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:'Bearer '+accessToken } });
          if(!infoRes.ok) throw new Error('userinfo request failed ('+infoRes.status+')');
          const info = await infoRes.json();
          if(!info.email) throw new Error('no email in response');
          currentUserEmail = info.email;
          const allowed = allStaffEmails();
          if(allowed.size && !allowed.has((currentUserEmail||'').toLowerCase())){
            accessToken = null; currentUserEmail = null;
            toast('This Google account is not authorised for staff access.', 'error');
            renderTopbar(); return;
          }
          saveSession(expiresInSec);
          toast('Signed in as '+currentUserEmail, 'success');
          renderTopbar(); renderRoute();
        }catch(e){
          if(attempt < 2){ setTimeout(()=>tryVerify(attempt+1), 500); return; }
          accessToken = null; currentUserEmail = null;
          toast('Could not verify account — please try Staff Sign In again', 'error');
          renderTopbar();
        }
      };
      tryVerify(0);
    }
  });
}
/* Session persistence: keeps you signed in across a page refresh within the
   same browser tab (sessionStorage clears when the tab/browser fully closes). */
function saveSession(expiresInSec){
  try{
    sessionStorage.setItem('taqwa_session', JSON.stringify({
      accessToken, currentUserEmail, expiresAt: Date.now() + (expiresInSec*1000)
    }));
  }catch(e){}
}
function restoreSession(){
  try{
    const raw = sessionStorage.getItem('taqwa_session');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.accessToken || !s.currentUserEmail || Date.now() > s.expiresAt) return false;
    accessToken = s.accessToken; currentUserEmail = s.currentUserEmail;
    return true;
  }catch(e){ return false; }
}
function login(){ if(!tokenClient){ toast('Sign-in is not configured yet.', 'error'); return; } tokenClient.requestAccessToken({ prompt:'consent' }); }
function logout(){
  accessToken = null; currentUserEmail = null;
  try{ sessionStorage.removeItem('taqwa_session'); }catch(e){}
  toast('Signed out');
  location.hash = '#/';
  renderTopbar(); renderRoute();
}

function renderSearchResults(q){
  const slot = document.getElementById('search-results-slot');
  q = (q||'').trim().toLowerCase();
  if(q.length < 2 || !DB){ slot.innerHTML=''; return; }
  const results = [];

  // Inventory items — by name or item code, tagged with their current
  // asset state (Installed / Spare / Disposed) so the source is unambiguous,
  // matching the same distinction the Assets tabs already use.
  DB.inventoryItems.filter(i=>!i.deleted && ((i.name||'').toLowerCase().includes(q) || (i.itemCode||'').toLowerCase().includes(q))).slice(0,6).forEach(i=>{
    let subtitle = 'Inventory · '+catName(i.categoryId);
    if(itemPatternOf(i)==='asset'){
      if(installedQtyForItem(i)>0) subtitle = 'Inventory · Installed Asset · '+catName(i.categoryId);
      else if(Number(i.quantity)>0) subtitle = 'Inventory · Spare Asset · '+catName(i.categoryId);
      else if(disposedQtyForItem(i)>0) subtitle = 'Inventory · Disposed Asset · '+catName(i.categoryId);
    }
    results.push({ href:'#/inventory/item/'+i.id, title:i.name+(i.itemCode?' ('+i.itemCode+')':''), subtitle });
  });

  // Categories
  DB.categories.filter(c=>!c.deleted && (c.name||'').toLowerCase().includes(q)).slice(0,3).forEach(c=>{
    results.push({ href:'#/inventory/category/'+c.id, title:c.name, subtitle:'Inventory · Category' });
  });

  // Procurement requests — by item name, item code, or request number
  DB.requestItems.filter(r=> !r.deleted && ((r.itemName||'').toLowerCase().includes(q) || (r.itemCode||'').toLowerCase().includes(q) || (r.requestNumber||'').toLowerCase().includes(q))).slice(0,6).forEach(r=>{
    results.push({ href:'#/procurement/item/'+r.id, title:r.itemName, subtitle:'Procurement · '+r.requestNumber+' · '+itemStatusLabel(r.status) });
  });

  // Purchase Orders — by PO number, surfacing the underlying request
  DB.purchaseOrders.filter(po=>(po.poNumber||'').toLowerCase().includes(q)).slice(0,4).forEach(po=>{
    const r = DB.requestItems.find(x=>x.id===po.requestItemId);
    if(r) results.push({ href:'#/procurement/item/'+r.id, title:po.poNumber, subtitle:'Procurement · Purchase Order · '+r.itemName });
  });

  if(!results.length){ slot.innerHTML = '<div class="search-results"><a>No matches found</a></div>'; return; }
  slot.innerHTML = '<div class="search-results">' + results.map(r=>
    '<a href="'+r.href+'">'+escapeHtml(r.title)+'<small>'+escapeHtml(r.subtitle)+'</small></a>'
  ).join('') + '</div>';
}

function openModal(title, bodyHtml, footerHtml, moduleClass, isDataEntry){
  const box = document.getElementById('modal-box');
  box.className = 'modal' + (moduleClass ? ' '+moduleClass : '');
  box.innerHTML =
    '<div class="modal-header"><h3>'+title+'</h3><button class="modal-close" id="modal-close-btn">&times;</button></div>'
    + '<div class="modal-body">'+bodyHtml+'</div>'
    + (footerHtml ? '<div class="modal-footer">'+footerHtml+'</div>' : '');
  document.getElementById('modal-overlay').style.display = 'flex';
  // Data-entry modals never close on an accidental outside click — only
  // their own explicit Close/X/Cancel action can dismiss them, so in-
  // progress typed data is never lost by a stray click. View-only modals
  // keep the convenience of closing on outside click.
  document.getElementById('modal-overlay').setAttribute('data-entry-modal', isDataEntry ? '1' : '0');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('modal-box').innerHTML=''; }
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay' && document.getElementById('modal-overlay').getAttribute('data-entry-modal')!=='1') closeModal();
});

   ============================================================ */
// Deliberately does NOT reload the DB on every navigation click — that was
// firing a full Drive read on every single tab/link click, which (stacked
// with multiple open tabs, multiple accounts, and the 30s background poll)
// was heavy enough to trip Google's Drive API throttling on this key.
// The initial boot() load plus the 30s background auto-refresh (which keeps
// running regardless of which tab is open) already keep data acceptably
// fresh without re-fetching on every click.
window.addEventListener('hashchange', ()=>{
  renderRoute();
});
function renderRoute(){
  renderTopbar();
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  if(!parts.length) return renderHomePage();
  if(parts[0]==='about') return renderAboutPage();
  if(parts[0]==='help') return renderHelpPage();
  if(parts[0]==='contact') return renderContactPage();
  if(parts[0]==='inventory' && parts[1]==='item' && parts[2]) return renderInventoryItemDetailPage(parts[2]);
  if(parts[0]==='inventory' && parts[1]==='category' && parts[2]) return renderCategoryPage(parts[2]);
  if(parts[0]==='inventory' && !parts[1]) return renderInventoryPage();
  if(parts[0]==='procurement' && parts[1]==='item' && parts[2]) { renderProcurementPage(); openItemDetailModal(parts[2]); return; }
  if(parts[0]==='procurement') return renderProcurementPage(parts[1]);
  if(parts[0]==='service-procurement' && parts[1]==='item' && parts[2]) { renderServiceProcurementPage(); openServiceRequestModal(parts[2]); return; }
  if(parts[0]==='service-procurement') return renderServiceProcurementPage(parts[1]);
  if(parts[0]==='admin') return renderAdminSettingsPage();
  return renderHomePage();
}

function computeActiveAlerts(){
  const alerts = [];
  DB.inventoryItems.forEach(item=>{
    const threshold = Number(item.reorderThreshold);
    if(threshold>0 && Number(item.quantity) <= threshold){
      const key = 'lowstock_'+item.id;
      if(!DB.dismissedAlerts.includes(key)){
        alerts.push({ key, title:'Low stock: '+item.name, message: catName(item.categoryId)+' — only '+item.quantity+' '+(item.unit||'')+' left (reorder at '+threshold+')' });
      }
    }
  });
  return alerts;
}

  const alerts = computeActiveAlerts();
  if(!alerts.length) return '';
  return '<div class="alert-stack">' + alerts.map(a=>
    '<div class="alert-item"><span>⚠</span><span><strong>'+escapeHtml(a.title)+'</strong> — '+escapeHtml(a.message)+'</span><span class="spacer"></span>'
    + (isAdmin() ? '<button class="btn btn-outline btn-sm" data-dismiss-alert="'+a.key+'">Dismiss</button>' : '')

function wireAlertDismissButtons(){
  document.querySelectorAll('[data-dismiss-alert]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.getAttribute('data-dismiss-alert');
      const ok = await runSaveAction(btn, 'Dismissing…', async ()=>{
        DB.dismissedAlerts.push(key);
        await saveDb();
      });

      renderRoute();
    });
  });
}

function pendingForMe(){
  if(!isSignedIn()) return [];
  const out = [];
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    if(r.status==='pending_approval' && canActOnApproval(r)) out.push(r);
    else if(r.status==='purchase_pending' && canPurchaseAction()) out.push(r);
    else if((r.status==='purchased' || r.status==='received') && canReceiveAction()) out.push(r);
  });
  DB.serviceRequests.forEach(sr=>{
    if(sr.deleted) return;
    if(sr.status==='pending_approval' && canActOnServiceApproval(sr)) out.push(sr);
    else if(['approved','under_observation','not_satisfactory'].includes(sr.status) && canManageServiceReceipts()) out.push(sr);
  });
  return out;
}
/* ============================================================
   Analytics — spend computations (based on purchase records on request items)
   ============================================================ */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(d){ return d.toLocaleDateString('en-IN',{month:'short'}); }
function last6MonthBuckets(){
  const buckets = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: monthKey(d), label: monthLabel(d), value: 0 });
  }
  return buckets;
}
function purchasedItems(){ return DB.requestItems.filter(r=>!r.deleted && r.purchase && r.purchase.totalAmount!=null); }
/* Only genuinely CLOSED services count as expenditure — matching the same
   "recorded amount, not a proxy for submission/approval" rule Item
   Procurement already follows. Draft/pending/approved-but-incomplete/
   under-observation services contribute nothing here. */
function closedServices(){ return DB.serviceRequests.filter(sr=>!sr.deleted && sr.status==='closed' && sr.totalAmount!=null); }
function computeMonthlyExpenditure(){
  const buckets = last6MonthBuckets();
  const map = {}; buckets.forEach(b=>map[b.key]=b);
  purchasedItems().forEach(r=>{
    const d = new Date(r.purchase.purchaseDate || r.purchase.recordedAt);
    if(isNaN(d.getTime())) return;
    const k = monthKey(d);
    if(map[k]) map[k].value += Number(r.purchase.totalAmount)||0;
  });
  closedServices().forEach(sr=>{
    const d = new Date(sr.closedAt || sr.serviceDate);
    if(isNaN(d.getTime())) return;
    const k = monthKey(d);
    if(map[k]) map[k].value += Number(sr.totalAmount)||0;
  });
  return buckets;
}
function computeCategoryExpenditure(){
  const totals = {};
  purchasedItems().forEach(r=>{
    const label = catName(r.categoryId);
    totals[label] = (totals[label]||0) + (Number(r.purchase.totalAmount)||0);
  });
  return Object.entries(totals).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,6);
}
function computeItemTypeExpenditure(){
  const totals = {};
  purchasedItems().forEach(r=>{
    const label = itemTypeName(r.itemTypeId);
    totals[label] = (totals[label]||0) + (Number(r.purchase.totalAmount)||0);
  });
  return Object.entries(totals).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
}
function computeRequestsByStatus(){
  const buckets = { 'Pending Approval':0, 'In Progress':0, 'Completed':0, 'Rejected':0 };
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    if(r.status==='pending_approval') buckets['Pending Approval']++;
    else if(r.status==='rejected') buckets['Rejected']++;
    else if(r.status==='completed' || r.status==='archived') buckets['Completed']++;
    else buckets['In Progress']++;
  });
  return Object.entries(buckets).map(([label,value])=>({label,value}));
}
function currentMonthExpenditure(){
  const now = new Date(); const k = monthKey(now);
  let total = 0;
  purchasedItems().forEach(r=>{
    const d = new Date(r.purchase.purchaseDate || r.purchase.recordedAt);
    if(!isNaN(d.getTime()) && monthKey(d)===k) total += Number(r.purchase.totalAmount)||0;
  });
  closedServices().forEach(sr=>{
    const d = new Date(sr.closedAt || sr.serviceDate);
    if(!isNaN(d.getTime()) && monthKey(d)===k) total += Number(sr.totalAmount)||0;
  });
  return total;
}
function totalExpenditureAllTime(){
  return purchasedItems().reduce((s,r)=> s + (Number(r.purchase.totalAmount)||0), 0)
    + closedServices().reduce((s,sr)=> s + (Number(sr.totalAmount)||0), 0);
}
/* Consumption — entirely separate from Expenditure. Expenditure = money spent
   on purchases received. Consumption = stock actually used up, tracked via
   Issue-type ledger entries, independent of any specific purchase. */
function consumptionEntriesInRange(sinceDate){
  return DB.stockLedger.filter(e=> e.type==='Issue' && (!sinceDate || new Date(e.date) >= sinceDate));
}
function currentMonthConsumptionQty(){
  const now = new Date(); const k = monthKey(now);
  let total = 0;
  DB.stockLedger.forEach(e=>{
    if(e.type!=='Issue') return;
    const d = new Date(e.date);
    if(!isNaN(d.getTime()) && monthKey(d)===k) total += Number(e.quantityOut)||0;
  });
  return total;
}
function totalConsumptionQtyAllTime(){
  return DB.stockLedger.filter(e=>e.type==='Issue').reduce((s,e)=>s+(Number(e.quantityOut)||0),0);
}

/* ============================================================
   Analytics — lightweight inline SVG chart builders
   ============================================================ */
const CHART_COLORS = ['#2563EB','#14B8A6','#F59E0B','#8B5CF6','#EF4444','#64748B'];
function svgBarChart(data, opts){
  opts = opts || {};
  const w = 520, h = 200, padL = 34, padB = 26, padT = 14, padR = 10;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...data.map(d=>d.value));
  const barW = innerW / data.length * 0.55;
  const gap = innerW / data.length;
  let bars = '', labels = '';
  data.forEach((d,i)=>{
    const barH = max>0 ? (d.value/max) * innerH : 0;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + innerH - barH;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(barH,1).toFixed(1)+'" rx="3" fill="var(--dashboard-gold)" opacity="0.9"><title>'+escapeHtml(d.label)+': '+formatMoney(d.value)+'</title></rect>';
    labels += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="var(--color-ink-faint)">'+escapeHtml(d.label)+'</text>';
  });
  const gridY = padT + innerH;
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="200" preserveAspectRatio="xMidYMid meet">'
    + '<line x1="'+padL+'" y1="'+gridY+'" x2="'+(w-padR)+'" y2="'+gridY+'" stroke="var(--color-border)" stroke-width="1"/>'
    + bars + labels + '</svg>';
}
function svgDonutChart(data){
  const size = 170, cx = size/2, cy = size/2, r = 62, stroke = 24;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total<=0){
    return '<svg viewBox="0 0 '+size+' '+size+'" width="170" height="170"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--color-border)" stroke-width="'+stroke+'"/></svg>';
  }
  let angle = -90, paths = '';
  const circumference = 2*Math.PI*r;
  data.forEach((d,i)=>{
    const frac = d.value/total;
    const dash = frac*circumference;
    paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+CHART_COLORS[i%CHART_COLORS.length]+'" stroke-width="'+stroke+'" stroke-dasharray="'+dash.toFixed(1)+' '+(circumference-dash).toFixed(1)+'" stroke-dashoffset="'+(-angle/360*circumference).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+escapeHtml(d.label)+': '+formatMoney(d.value)+'</title></circle>';
    angle += frac*360;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="170" height="170">'+paths+'</svg>';
}
function renderDonutWithLegend(data, emptyLabel, formatter){
  formatter = formatter || formatMoney;
  if(!data.length || data.every(d=>d.value<=0)){
    return '<div class="empty-state" style="padding:20px;"><div class="icon">📊</div><h3>'+escapeHtml(emptyLabel||'No data yet')+'</h3></div>';
  }
  const total = data.reduce((s,d)=>s+d.value,0);
  const legend = data.map((d,i)=>{
    const pct = total>0 ? Math.round((d.value/total)*100) : 0;
    return '<div class="legend-row"><span class="legend-dot" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+';"></span><span class="legend-label">'+escapeHtml(d.label)+'</span><span class="legend-value">'+formatter(d.value)+' <span class="legend-pct">('+pct+'%)</span></span></div>';
  }).join('');
  return '<div class="donut-row"><div>'+svgDonutChart(data)+'</div><div class="legend-list">'+legend+'</div></div>';
}
function renderHBarList(data){
  if(!data.length || data.every(d=>d.value<=0)){
    return '<div class="empty-state" style="padding:20px;"><div class="icon">📊</div><h3>No data yet</h3></div>';
  }
  const max = Math.max(1, ...data.map(d=>d.value));
  return '<div class="hbar-list">' + data.map(d=>{
    const pct = Math.max(2, Math.round((d.value/max)*100));
    return '<div class="hbar-row"><div class="hbar-label">'+escapeHtml(d.label)+'</div><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;"></div></div><div class="hbar-value">'+formatMoney(d.value)+'</div></div>';
  }).join('') + '</div>';
}


function animateLandingCounters(){
  document.querySelectorAll('.landing-stat-num').forEach(el=>{
    const target = Number(el.getAttribute('data-count'))||0;
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const progress = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-progress, 3);
      el.textContent = Math.round(target*eased).toLocaleString('en-IN');
      if(progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
/* ============================================================
   Home dashboard — recent activity + metrics. Built entirely from the
   history[] entries already recorded on request items and inventory items
   (no separate activity-log system) — every event type in this list
   already gets logged there as part of the existing workflows.
   ============================================================ */
function activityIconFor(text){
  text = (text||'').toLowerCase();
  if(text.includes('escalat')) return '⬆️';
  if(text.includes('declin')) return '❌';
  if(text.includes('approv')) return '✅';
  if(text.includes('purchase recorded') || text.includes('recorded')) return '🛒';
  if(text.includes('received')) return '📦';
  if(text.includes('install')) return '🏗️';
  if(text.includes('dispos')) return '🗑️';
  if(text.includes('consum')) return '📉';
  if(text.includes('existing stock')) return '🆕';
  if(text.includes('requested') || text.includes('created')) return '📝';
  return '•';
}
function recentActivityEvents(days){
  days = days || 3;
  const cutoff = Date.now() - days*24*60*60*1000;
  const events = [];
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    (r.history||[]).forEach(h=>{
      const t = new Date(h.timestamp).getTime();
      if(!isNaN(t) && t>=cutoff){
        events.push({ timestamp:h.timestamp, title:(h.stage||h.action||'Update')+' — '+r.itemName,
          subtitle:(h.actorName||h.actorEmail||'—')+' · '+r.requestNumber, remark:h.remark,
          href:'#/procurement/item/'+r.id, icon: activityIconFor((h.stage||'')+' '+(h.action||'')) });
      }
    });
  });
  DB.inventoryItems.forEach(i=>{
    if(i.deleted) return;
    (i.history||[]).forEach(h=>{
      const t = new Date(h.timestamp).getTime();
      if(!isNaN(t) && t>=cutoff){
        events.push({ timestamp:h.timestamp, title:(h.action||'Update')+' — '+i.name,
          subtitle:(h.actorName||h.actorEmail||'—'), remark:h.remark,
          href:'#/inventory/item/'+i.id, icon: activityIconFor((h.action||'')+' '+(h.remark||'')) });
      }
    });
  });
  DB.serviceRequests.forEach(sr=>{
    if(sr.deleted) return;
    (sr.history||[]).forEach(h=>{
      const t = new Date(h.timestamp).getTime();
      if(!isNaN(t) && t>=cutoff){
        events.push({ timestamp:h.timestamp, title:(h.stage||h.action||'Update')+' — '+sr.serviceRequestNumber,
          subtitle:(h.actorName||h.actorEmail||'—')+' · '+svcCategoryName(sr.categoryId), remark:h.remark,
          href:'#/service-procurement/item/'+sr.id, icon: activityIconFor((h.stage||'')+' '+(h.action||'')) });
      }
    });
  });
  events.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
  return events.slice(0, 30);
}
function renderRecentActivityHtml(){
  const events = recentActivityEvents(3);
  if(!events.length) return '';
  return '<div class="section-heading">Recent Activity</div>'
    + '<div class="activity-carousel-wrap">'
    +   '<button class="activity-nav-btn" id="activity-nav-left" aria-label="Scroll left">‹</button>'
    +   '<div class="activity-carousel" id="activity-carousel">'

    +   '</div>'

    + '</div>';

function wireActivityCarousel(){
  const track = document.getElementById('activity-carousel');
  if(!track) return;
  const left = document.getElementById('activity-nav-left');

  if(left) left.addEventListener('click', ()=> track.scrollBy({ left:-260, behavior:'smooth' }));

function formatRelativeTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  return days+'d ago';
}
function dashboardMetrics(){
  const now = Date.now();
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const sevenDaysAgo = now - 7*24*60*60*1000;
  const startOfMonth = new Date(); startOfMonth.setDate(1); startOfMonth.setHours(0,0,0,0);
  let reqToday=0, reqWeek=0, expToday=0, expWeek=0, expMonth=0;
  DB.requestItems.forEach(r=>{
    if(r.deleted) return;
    const createdMs = new Date(r.createdAt).getTime();
    if(!isNaN(createdMs)){
      if(createdMs>=startOfToday.getTime()) reqToday++;
      if(createdMs>=sevenDaysAgo) reqWeek++;
    }
    // Expense is the actual recorded purchase amount, not a proxy for
    // submission/approval — a request that was only submitted or approved
    // but never purchased contributes nothing here.
    if(r.purchase && r.purchase.recordedAt){
      const recMs = new Date(r.purchase.recordedAt).getTime();
      const amt = Number(r.purchase.totalAmount)||0;
      if(!isNaN(recMs)){
        if(recMs>=startOfToday.getTime()) expToday += amt;
        if(recMs>=sevenDaysAgo) expWeek += amt;
        if(recMs>=startOfMonth.getTime()) expMonth += amt;
      }
    }
  });
  DB.serviceRequests.forEach(sr=>{
    if(sr.deleted) return;
    const createdMs = new Date(sr.createdAt).getTime();
    if(!isNaN(createdMs)){
      if(createdMs>=startOfToday.getTime()) reqToday++;
      if(createdMs>=sevenDaysAgo) reqWeek++;
    }
    // Same rule as above, applied to services — only a genuinely CLOSED
    // service counts as an expense, never a pending/approved/under-observation one.
    if(sr.status==='closed' && sr.closedAt){
      const closedMs = new Date(sr.closedAt).getTime();
      const amt = Number(sr.totalAmount)||0;
      if(!isNaN(closedMs)){
        if(closedMs>=startOfToday.getTime()) expToday += amt;
        if(closedMs>=sevenDaysAgo) expWeek += amt;
        if(closedMs>=startOfMonth.getTime()) expMonth += amt;
      }
    }
  });
  return { reqToday, reqWeek, expToday, expWeek, expMonth };
}
function renderHomePage(){

let consumptionCategoryFilter = '';
function wireAddExistingStockBtn(pattern){
  const btn = document.getElementById(pattern==='asset' ? 'add-existing-asset-btn' : 'add-existing-consumable-btn');
  if(btn) btn.addEventListener('click', ()=>openAddExistingStockModal(pattern));
